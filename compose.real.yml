# compose.real.yml — real-model / real-pi overlay for the M4 lab stack.
#
#   HOST_UID=$(id -u) HOST_GID=$(id -g) \
#     COMMUNICATION_LLM_API_KEY_HOST_FILE=$HOME/.config/communication/llmc-api-key \
#     docker compose -p communication-m4 \
#       -f compose.yml -f compose.harness.yml -f compose.m4.yml -f compose.real.yml \
#       up -d --build
#
#   `docker compose ... config --quiet` MUST render (all four -f files in that
#   order) before `up`; with any of the `:?` variables unset it refuses to
#   render, which is the point.
#
# What this layer adds over the M4 stack (compose.m4.yml's worker-a/worker-b
# and compose.yml's api-a/api-b, per service):
#   * A read-only bind of the operator's gateway key FILE at
#     /run/comm/llm-api-key on worker-a, worker-b, api-a and api-b. The host
#     file may be 0600 and owned by the host user: every reader in this stack
#     runs as ${HOST_UID} (compose.harness.yml / compose.m4.yml), so the
#     mount is readable without any chmod. No key value is ever written into
#     this file or any environment value here — only paths and interpolation
#     names.
#   * worker-a/worker-b: `model.chat` nodes run against the operator's
#     OpenAI-compatible gateway (cmd/communication/worker.go):
#       COMMUNICATION_MODEL_CHAT_BASE_URL      server root
#       COMMUNICATION_MODEL_CHAT_API_KEY       bearer token — NO _FILE variant
#        exists in the Go code (verified: only this env is read), so the
#        value comes from the host environment by ${LLMC_API_KEY:?}
#        interpolation, the host's gateway-key variable (docs/compatibility/
#        ACP.md); it is never a literal in this file
#       COMMUNICATION_MODEL_CHAT_MODELS        one-model allowlist
#   * worker-a/worker-b: the `pi` ACP launcher (ADR-0059) gets
#       COMMUNICATION_PI_API_KEY_FILE=/run/comm/llm-api-key (file delivery,
#        read at each launch; the Go code has no plain-env form) plus the
#        per-turn provider base URL + model rendered into the agent-home
#        models.json.
#   * worker-a/worker-b: COMMUNICATION_AGENT_EGRESS_ALLOW admits the hosts a
#        real turn actually needs — the claude launcher's default
#        (api.anthropic.com), GitHub push (docs/design/agent-push.md,
#        ADR-0045), and the gateway host below.
#   * api-a/api-b: the in-app assistant (ADR-0034) runs against the same
#     gateway with file-delivered key (serve.go: _API_KEY_FILE is the
#     preferred form).
#   * api-a/api-b: the ADR-0079 decision judge and the ADR-0080 server-side
#     speech endpoint point at the deterministic stub service
#     assistant-stub (e2e/stubs/assistant_stub.py) instead of any real
#     model, so the assistant's acceptance proofs see fixed transcripts
#     and fixed verdicts. The stub key "stub-key" is a lab constant, not a
#     secret; nothing leaves the compose network.
#
# Host variables (with safe defaults where shown):
#   COMMUNICATION_LLM_BASE_URL        (default https://llm-collective.e-gineering.com/v1)
#   COMMUNICATION_LLM_MODEL           (default david-birks/qwen3-8-flash-next)
#   LLMC_API_KEY                      the gateway key, from the host environment
#                                     only; must equal the file's contents
#   COMMUNICATION_LLM_API_KEY_HOST_FILE  REQUIRED: host path of the key file
#                                     (e.g. $HOME/.config/communication/llmc-api-key)
#   COMMUNICATION_LLM_HOST            (default llm-collective.e-gineering.com)
#                                     the base URL's host, for egress. compose
#                                     cannot parse a URL, so this is a separate
#                                     variable rather than derived; if you
#                                     point COMMUNICATION_LLM_BASE_URL at a
#                                     different gateway, set this too.
name: communication-m4

services:
  worker-a:
    volumes:
      - ${COMMUNICATION_LLM_API_KEY_HOST_FILE:?set COMMUNICATION_LLM_API_KEY_HOST_FILE to a host file holding the gateway key}:/run/comm/llm-api-key:ro
    environment:
      # Audit F6: the M4/lab stacks clone file:// fixture remotes.
      COMMUNICATION_ALLOW_FILE_GIT_URLS: "true"
      # model.chat (worker.go: parsed at startup; base URL unset means the
      # kind is not registered and its nodes fail with the honest refusal).
      COMMUNICATION_MODEL_CHAT_BASE_URL: "${COMMUNICATION_LLM_BASE_URL:-https://llm-collective.e-gineering.com/v1}"
      COMMUNICATION_MODEL_CHAT_API_KEY: "${LLMC_API_KEY:?set LLMC_API_KEY to the gateway key in the host environment (file form: COMMUNICATION_LLM_API_KEY_HOST_FILE)}"
      COMMUNICATION_MODEL_CHAT_MODELS: "${COMMUNICATION_LLM_MODEL:-david-birks/qwen3-8-flash-next}"
      # pi launcher (ADR-0059): key via the mounted file, never env;
      # base URL + model into the agent-home models.json per turn.
      COMMUNICATION_PI_API_KEY_FILE: /run/comm/llm-api-key
      COMMUNICATION_PI_BASE_URL: "${COMMUNICATION_LLM_BASE_URL:-https://llm-collective.e-gineering.com/v1}"
      COMMUNICATION_PI_MODEL: "${COMMUNICATION_LLM_MODEL:-david-birks/qwen3-8-flash-next}"
      # ADR-0035 worker-owned egress: claude (shipped default host) + GitHub
      # push (api.anthropic.com is nono's provisional default; the GitHub set
      # is agent-push.md step 3 plus its raw/archive/download hosts) + the
      # gateway host the model.chat and pi turns call.
      COMMUNICATION_AGENT_EGRESS_ALLOW: "api.anthropic.com,github.com,api.github.com,codeload.github.com,objects.githubusercontent.com,${COMMUNICATION_LLM_HOST:-llm-collective.e-gineering.com}"

  worker-b:
    volumes:
      - ${COMMUNICATION_LLM_API_KEY_HOST_FILE:?set COMMUNICATION_LLM_API_KEY_HOST_FILE to a host file holding the gateway key}:/run/comm/llm-api-key:ro
    environment:
      COMMUNICATION_ALLOW_FILE_GIT_URLS: "true"
      COMMUNICATION_MODEL_CHAT_BASE_URL: "${COMMUNICATION_LLM_BASE_URL:-https://llm-collective.e-gineering.com/v1}"
      COMMUNICATION_MODEL_CHAT_API_KEY: "${LLMC_API_KEY:?set LLMC_API_KEY to the gateway key in the host environment (file form: COMMUNICATION_LLM_API_KEY_HOST_FILE)}"
      COMMUNICATION_MODEL_CHAT_MODELS: "${COMMUNICATION_LLM_MODEL:-david-birks/qwen3-8-flash-next}"
      COMMUNICATION_PI_API_KEY_FILE: /run/comm/llm-api-key
      COMMUNICATION_PI_BASE_URL: "${COMMUNICATION_LLM_BASE_URL:-https://llm-collective.e-gineering.com/v1}"
      COMMUNICATION_PI_MODEL: "${COMMUNICATION_LLM_MODEL:-david-birks/qwen3-8-flash-next}"
      COMMUNICATION_AGENT_EGRESS_ALLOW: "api.anthropic.com,github.com,api.github.com,codeload.github.com,objects.githubusercontent.com,${COMMUNICATION_LLM_HOST:-llm-collective.e-gineering.com}"

  api-a:
    volumes:
      - ${COMMUNICATION_LLM_API_KEY_HOST_FILE:?set COMMUNICATION_LLM_API_KEY_HOST_FILE to a host file holding the gateway key}:/run/comm/llm-api-key:ro
    environment:
      # Audit F6: see worker-a.
      COMMUNICATION_ALLOW_FILE_GIT_URLS: "true"
      # ADR-0034: unset COMMUNICATION_ASSISTANT_BASE_URL means the assistant
      # is absent (503 assistant_not_configured). Setting it makes THIS
      # replica egress app content to the gateway — which is the operator's
      # explicit intent in applying this overlay.
      COMMUNICATION_ASSISTANT_BASE_URL: "${COMMUNICATION_LLM_BASE_URL:-https://llm-collective.e-gineering.com/v1}"
      COMMUNICATION_ASSISTANT_MODEL: "${COMMUNICATION_LLM_MODEL:-david-birks/qwen3-8-flash-next}"
      COMMUNICATION_ASSISTANT_API_KEY_FILE: /run/comm/llm-api-key
      # The broker's default is 30s per model call (internal/assistant/broker.go);
      # the real gateway is slower, so the lab's assistant journeys timed out.
      # Parsed with time.ParseDuration (cmd/communication/serve.go).
      COMMUNICATION_ASSISTANT_TIMEOUT: 180s
      # ADR-0078's catch-up tour generator waits 10 minutes per RUN before it
      # will ask the model about that run again. In a lab whose acceptance spec
      # finishes a run and then waits minutes for its tour, that floor is
      # longer than the wait: one failed attempt would block the retry past the
      # spec's deadline. Same parser as above; see serveCatchUpGenCooldown.
      COMMUNICATION_CATCHUP_GEN_COOLDOWN: 20s
      # The per-replica VISIT budget on generation model calls per 10 minutes
      # (shipped default 6; 0 disables generation). Spelled out here because
      # the lab's gateway is rate-limited and acceptance 42452527578 watched a
      # page-load storm spend its whole budget; see serveCatchUpGenPer10M.
      COMMUNICATION_CATCHUP_GEN_PER_10M: "6"
      # The completion sweep's OWN budget, separate from the visit cap above:
      # acceptance 42570366079 watched the shared purse let the sweep spend 36
      # generation calls in ~28 min (the cap refused 62 times) and push a live
      # assistant turn past its 200s bound. The lab gives the background sweep
      # 2 calls per 10 min so a person opening Catch up is never starved by
      # the backlog; see serveCatchUpSweepPer10M.
      COMMUNICATION_CATCHUP_SWEEP_PER_10M: "2"
      # ADR-0078 § Trigger: how often this replica's completion sweep tells
      # the runs that finished untoured (shipped default 2m; 0 disables). The
      # lab shortens it so an acceptance spec can watch a finished run get its
      # tour without anybody opening the Catch up page. Both replicas tick —
      # the tour write is idempotent on the run's claim, so a swept-twice run
      # is told once. See serveCatchUpGenSweep.
      COMMUNICATION_CATCHUP_GEN_SWEEP: 30s
      # ADR-0079 + ADR-0080 (CONTRACT § 3/§ 4): speech and the decision judge
      # run against the deterministic stub in assistant-stub, NOT a real
      # model — the lab's acceptance proofs need one fixed transcript
      # ("what workflows do I have") and a fixed verdict table, with a
      # /control/judge switch to watch the degraded "judge is down" path.
      # "stub-key" is a lab constant, not a secret (names as serve.go reads
      # them: COMMUNICATION_SPEECH_BASE_URL/_MODEL/_API_KEY and
      # COMMUNICATION_DECISION_BASE_URL/_MODEL/_API_KEY/_TIMEOUT).
      COMMUNICATION_SPEECH_BASE_URL: http://assistant-stub:8098/v1
      COMMUNICATION_SPEECH_MODEL: qwen3-asr-stub
      COMMUNICATION_SPEECH_API_KEY: stub-key
      COMMUNICATION_DECISION_BASE_URL: http://assistant-stub:8098/v1
      COMMUNICATION_DECISION_MODEL: judge-stub
      COMMUNICATION_DECISION_API_KEY: stub-key
      COMMUNICATION_DECISION_TIMEOUT: 3s
    depends_on:
      assistant-stub:
        condition: service_started

  api-b:
    volumes:
      - ${COMMUNICATION_LLM_API_KEY_HOST_FILE:?set COMMUNICATION_LLM_API_KEY_HOST_FILE to a host file holding the gateway key}:/run/comm/llm-api-key:ro
    environment:
      COMMUNICATION_ALLOW_FILE_GIT_URLS: "true"
      COMMUNICATION_ASSISTANT_BASE_URL: "${COMMUNICATION_LLM_BASE_URL:-https://llm-collective.e-gineering.com/v1}"
      COMMUNICATION_ASSISTANT_MODEL: "${COMMUNICATION_LLM_MODEL:-david-birks/qwen3-8-flash-next}"
      COMMUNICATION_ASSISTANT_API_KEY_FILE: /run/comm/llm-api-key
      COMMUNICATION_ASSISTANT_TIMEOUT: 180s
      # See api-a: the tour generator's per-run cooldown, shortened for the lab,
      # and its per-replica VISIT model-call cap, explicit for the rate-limited
      # gateway, and the sweep's OWN budget so background sweeping cannot spend
      # it.
      COMMUNICATION_CATCHUP_GEN_COOLDOWN: 20s
      COMMUNICATION_CATCHUP_GEN_PER_10M: "6"
      COMMUNICATION_CATCHUP_SWEEP_PER_10M: "2"
      # See api-a: the completion sweep's cadence, shortened for the lab.
      COMMUNICATION_CATCHUP_GEN_SWEEP: 30s
      # ADR-0079 + ADR-0080: same deterministic stub as api-a (the judge
      # counts every call and both replicas may serve a decision);
      # "stub-key" is a lab constant, not a secret. See api-a's block.
      COMMUNICATION_SPEECH_BASE_URL: http://assistant-stub:8098/v1
      COMMUNICATION_SPEECH_MODEL: qwen3-asr-stub
      COMMUNICATION_SPEECH_API_KEY: stub-key
      COMMUNICATION_DECISION_BASE_URL: http://assistant-stub:8098/v1
      COMMUNICATION_DECISION_MODEL: judge-stub
      COMMUNICATION_DECISION_API_KEY: stub-key
      COMMUNICATION_DECISION_TIMEOUT: 3s
    depends_on:
      assistant-stub:
        condition: service_started

  # assistant-stub — the deterministic speech + judge endpoint for the
  # assistant's lab proofs (ADR-0079/0080, CONTRACT § 3-§ 4). Stdlib-only
  # Python; answers POST /v1/audio/transcriptions and POST
  # /v1/chat/completions plus the lab's /control/judge + /control/stats.
  # It holds no secret ("stub-key" is a fixed lab constant) and no state
  # worth persisting, so restart "no" and no volumes beyond the read-only
  # script bind. Host port 18098 exists so lab scripts can flip the judge
  # and read its counters from outside.
  assistant-stub:
    image: python:3.13-alpine
    command: ["python3", "/stub/assistant_stub.py"]
    volumes:
      - ./e2e/stubs:/stub:ro
    ports:
      - "18098:8098"
    healthcheck:
      # python:3.13-alpine ships no curl — probe with the stdlib.
      test: ["CMD", "python3", "-c",
             "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8098/healthz', timeout=2).status == 200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 3s
    restart: "no"
