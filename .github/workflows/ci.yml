# CI for the Communication monorepo (ADR-0004: GitHub Actions; ADR-0007: one Go
# module at the repo root, ui/ holds the Vite + React SPA).
#
# Pinned versions — looked up 2026-10-14, actions on exact major tags, tools on
# exact versions:
#   actions/checkout@v7                     latest release v7.0.1
#   actions/setup-go@v7                     latest release v7.0.0
#   actions/setup-node@v7                   latest release v7.1.0
#   pnpm/action-setup@v6                    latest release v6.1.0
#   actions/upload-artifact@v7              latest release v7.0.2
#   docker/login-action@v4                  latest release v4.6.0
#   docker/setup-buildx-action@v4           latest release v4.4.1
#   docker/setup-qemu-action@v4             latest release v4.4.0
#   goreleaser/goreleaser-action@v7         latest release v7.3.0
#   GoReleaser                v2.18.3       (config schema version: 2)
#   golang.org/x/vuln/cmd/govulncheck       v1.9.0
#   github.com/google/go-licenses           v1.6.0
#   pnpm                                      12.11.2
#   Node.js                                   24.22.0 (current LTS line)
#   @redocly/cli                            2.63.0 (API contract lint, api/README.md)
#   openapi-typescript                    7.13.0 (ui/tools/apigen only — the API type generator; the app itself builds on TypeScript 7 and keeps its pins in ui/package.json / ui/tools/apigen/package.json)
#   @playwright/test                        1.64.1 (e2e/ Playwright suite, ADR-0006)
#   nono                                    0.80.0 (go job: the real sandbox binary
#                                             the M3 tests exec. Same pin, tarball
#                                             sha256 and gnu build as
#                                             worker/Dockerfile's NONO_SHA256 and
#                                             docs/compatibility/probes/sandbox/
#                                             README.md — the build every
#                                             docs/compatibility/SANDBOX.md row
#                                             was observed against)
# Container images for the go job's integration services (12-test-strategy:
# real Postgres/OIDC, never mocks):
#   postgres                                18.6
#   ghcr.io/navikt/mock-oauth2-server       6.0.7 (ADR-0012 dev/CI IdP)
#   chrislusf/seaweedfs                     4.48 (S3 conformance speaker, ADR-0020;
#                                             same pin as compose.yml's optional s3
#                                             profile)
# Go itself is NOT pinned here: it comes from go.mod via go-version-file.
#
# Only GITHUB_TOKEN is used anywhere in this repository's workflows. Publish
# steps are the only ones granted packages: write (ADR-0004 Security/privacy).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: go
    runs-on: ubuntu-latest
    # Integration tests (internal/store/postgres today, the OIDC login path as
    # it lands) skip unless these point at the services below, so CI runs them
    # for real rather than as mocks (12-test-strategy).
    env:
      COMMUNICATION_TEST_DATABASE_URL: postgres://ci@localhost:5432/ci?sslmode=disable
      COMMUNICATION_TEST_OIDC_ISSUER: http://localhost:18091/default
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U ci" --health-interval 2s --health-timeout 5s --health-retries 20
      oidc:
        # ADR-0012: real OIDC (discovery, JWKS, signed ID tokens), interactive
        # login only — no credentials exist to commit.
        image: ghcr.io/navikt/mock-oauth2-server:6.0.7
        env:
          JSON_CONFIG: '{"interactiveLogin":true}'
        ports:
          - 18091:8080
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The real-nono tests (internal/sandbox/nono) skip when the binary is not
      # on PATH — an honest gap, never a mock (AGENTS.md). This job is where that
      # gap is meant to close, so install the pinned build the same way the
      # worker image does (worker/Dockerfile stage `executionbin`): the gnu build
      # (not musl — the probe matrix ran against gnu) and `sha256sum -c` against
      # the digest recorded in that Dockerfile, the probes README and
      # docs/compatibility/SANDBOX.md.
      # The digest is pinned *here* rather than read from the release's own
      # SHA256SUMS.txt, because that file arrives over the same channel as the
      # tarball and verifies nothing on its own; it is checked as a second,
      # independent witness all the same, and the *extracted* binary is checked
      # too so the hash that fails names the layer that drifted.
      # A failed fetch or a hash mismatch fails this step loudly rather than
      # degrading to a skip: a silently absent sandbox binary is how these tests
      # stop being evidence without anyone noticing (AGENTS.md: the compatibility
      # table is never prefilled with PASS).
      # The script body below is the one that was run for real before it was
      # committed: verified fetch + both hashes + `nono 0.80.0` executing out of
      # $RUNNER_TEMP/nono-bin on the lab host.
      - name: Install pinned nono (real sandbox tests)
        run: |
          set -euo pipefail
          ver=0.80.0
          asset="nono-v${ver}-x86_64-unknown-linux-gnu"
          tarsum=6da665b61999570c10dffc7da78828fe1fb7f3cac53319e505cebecaef17037f
          binsum=e02d003d52b3f65e8c75358eb73e339ad952a2876529047e61183b46eff1287d
          dl="$RUNNER_TEMP/nono-dl"; bin="$RUNNER_TEMP/nono-bin"
          mkdir -p "$dl" "$bin"
          curl -fsSL --retry 3 -o "$dl/$asset.tar.gz" \
            "https://github.com/nolabs-ai/nono/releases/download/v${ver}/$asset.tar.gz"
          curl -fsSL --retry 3 -o "$dl/SHA256SUMS.txt" \
            "https://github.com/nolabs-ai/nono/releases/download/v${ver}/SHA256SUMS.txt"
          ( cd "$dl"
            printf '%s  %s.tar.gz\n' "$tarsum" "$asset" | sha256sum --strict --check -
            sha256sum --ignore-missing --check SHA256SUMS.txt
            tar -xzf "$asset.tar.gz" -C "$bin" )
          printf '%s  %s/nono\n' "$binsum" "$bin" | sha256sum --strict --check -
          chmod 0755 "$bin/nono"
          echo "$bin" >> "$GITHUB_PATH"
      # What this runner can actually enforce, on the record. The real-nono
      # tests skip with this same probe's verdict as their reason (see
      # requireRealNono in internal/sandbox/nono/selftest_test.go), so this is
      # the log line that distinguishes "enforcement was observed here" from
      # "the runner cannot enforce and said so". Not a gate: a kernel without
      # Landlock must not turn a green build red by contradicting the tests'
      # own skip policy — it must be visible while it is being skipped.
      # What is *expected* is a Landlock ABI v6 runner: the ubuntu-24.04 image
      # line runs a 6.x azure kernel and Ubuntu builds `landlock` into its boot
      # LSM list (landlock.io lists Ubuntu and Azure Linux as enabled by default;
      # other projects' Landlock CI treats ubuntu-latest as v6-capable and
      # ubuntu-22.04 as ABI v4). What is *claimed* is only what the line below
      # prints — the runner is the authority on itself, and the lab's matrix
      # (docs/compatibility/SANDBOX.md) was measured on Landlock V6.
      - name: Sandbox capability report
        run: |
          set -uo pipefail
          uname -r
          echo "lsm: $(cat /sys/kernel/security/lsm 2>/dev/null || echo UNREADABLE)"
          nono --version
          nono setup --check-only -v \
            || echo 'nono cannot enforce on this runner: the real-nono tests will skip, not pass vacuously'
      - name: go vet
        run: go vet ./...
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: go build
        run: go build ./...
      # -p 1: several packages migrate the same database, so package test
      # binaries must not run concurrently against it.
      - name: go test -race
        run: go test -race -p 1 ./...
      # S3 conformance (ADR-0020 D7 / objective 3): the artifacts package's
      # suite refuses to run against an S3 speaker that does not actually
      # verify SigV4 signatures (storeVerifiesSignatures precondition), because
      # an anonymous-friendly gateway would let the whole suite pass on a
      # broken signer — an observed fact from this lab, where SeaweedFS's
      # default accepted unsigned writes. So this speaker is started with an
      # identities file and the suite runs for real against it. The identity
      # is generated at run time, never committed, and valid only inside this
      # ephemeral container (AGENTS.md: no credentials in the repository).
      # Flags mirror the lab-verified container, which is also compose.yml's
      # optional `s3` profile.
      - name: S3 conformance (SeaweedFS)
        run: |
          set -euo pipefail
          access="CI$(head -c 12 /dev/urandom | od -An -tx1 | tr -d ' \n' | tr 'a-f' 'A-F')"
          secret="$(head -c 30 /dev/urandom | od -An -tx1 | tr -d ' \n')"
          printf '{"identities":[{"name":"ci","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}\n' \
            "$access" "$secret" > "$RUNNER_TEMP/s3.json"
          docker run -d --name s3-conformance \
            -p 127.0.0.1:8333:8333 \
            -v "$RUNNER_TEMP/s3.json:/etc/seaweedfs/s3.json:ro" \
            chrislusf/seaweedfs:4.48 \
            server -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json \
            -s3.iam=false -dir=/data -master.volumeSizeLimitMB=64
          for i in $(seq 1 30); do
            curl -s -o /dev/null http://127.0.0.1:8333/ && break
            sleep 1
          done
          COMMUNICATION_TEST_S3_ENDPOINT=http://127.0.0.1:8333 \
          COMMUNICATION_TEST_S3_ACCESS_KEY="$access" \
          COMMUNICATION_TEST_S3_SECRET_KEY="$secret" \
          COMMUNICATION_TEST_S3_BUCKET=communication-artifacts-ci \
            go test -race -p 1 -run 'TestS3ConformanceAgainstSeaweedFS' ./internal/artifacts/
      - name: stop SeaweedFS
        if: always()
        run: docker rm -f s3-conformance || true

  contract:
    name: contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.0
      - name: Enable corepack
        run: corepack enable
      # api/README.md documents pnpm --package=@redocly/cli@2.63.0 dlx redocly
      # lint locally (pnpm dlx alone fails: the package ships both `redocly`
      # and `openapi` binaries). In CI the npm exec equivalent below needs no
      # lockfile and no packageManager field; npm resolves the package's
      # `openapi` bin, which is the same CLI.
      # Warnings are reviewed, errors are not merged (see api/README.md).
      - name: Lint OpenAPI contract
        run: npx --yes @redocly/cli@2.63.0 lint api/openapi.yaml

  compose:
    name: compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # compose.yml lands with the M1 compose task; the guard keeps this job
      # green until then and strict (config -q) once it exists.
      - name: Validate compose configuration
        run: |
          if [ -f compose.yml ]; then
            docker compose -p communication config -q
          else
            echo "compose.yml not present yet — skipping"
          fi

  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: go-licenses
        run: go run github.com/google/go-licenses@v1.6.0 check ./... --disallowed_types=forbidden,restricted,unknown

  detect:
    name: detect
    runs-on: ubuntu-latest
    outputs:
      # Job-level expressions may not call hashFiles (GitHub restricts it to
      # step contexts), so it is evaluated in a step and republished as an
      # output.
      ui: ${{ steps.ui-package.outputs.ui }}
    steps:
      - uses: actions/checkout@v7
      - id: ui-package
        if: hashFiles('ui/package.json') != ''
        run: echo "ui=true" >> "$GITHUB_OUTPUT"

  ui:
    name: ui
    runs-on: ubuntu-latest
    needs: [detect]
    # Skipped until ui/package.json lands (ADR-0005, ADR-0007).
    if: needs.detect.outputs.ui == 'true'
    steps:
      # fetch-depth: 0 because the test-id guard below diffs a previous
      # revision against the worktree; the default shallow checkout carries no
      # history to compare against.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.0
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      # The workspace install (ui/pnpm-workspace.yaml) also installs
      # ui/tools/apigen — openapi-typescript 7.13 needs the TypeScript 5 JS API
      # while the app builds on TypeScript 7, so `gen:api` resolves the
      # generator from that package's tree and fails without it.
      - name: install
        run: pnpm --dir ui install --frozen-lockfile
      # ui's check script: gen:api:check (fails if src/api/schema.d.ts drifts
      # from api/openapi.yaml) && lint && fmt:check && typecheck &&
      # check:testids && test && build.
      - name: check
        run: pnpm --dir ui check
      # check:testids inside `check` compares the worktree with HEAD, which in
      # CI is the same tree — a no-op. The comparison that catches a restyle
      # dropping a test id is against the revision the PR is merging into (or,
      # on push to main, the previous commit), so run that one explicitly.
      - name: test ids vs base revision
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ -n "${BASE_REF:-}" ]; then
            git fetch --no-tags --no-recurse-submodules origin \
              "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
            rev="$(git merge-base HEAD "origin/${BASE_REF}")"
          else
            rev="$(git rev-parse HEAD^1)"
          fi
          echo "comparing ui test ids against ${rev}"
          pnpm --dir ui exec node scripts/check-testids.mjs "$rev"

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    # M1 journey (ADR-0006, 12-test-strategy E2E) against the real compose
    # stack on the isolated 2808x ports (e2e/compose.e2e.yml, project
    # communication-e2e) so nothing can clash with another runner's ports.
    # The worker/agent harness is deliberately excluded: CI carries no agent
    # credentials, and M1 needs no worker.
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: e2e/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.0
          cache: pnpm
          cache-dependency-path: e2e/pnpm-lock.yaml
      - name: install
        run: pnpm --dir e2e install --frozen-lockfile
      # The suite is chromium-only (playwright.config.ts); --with-deps pulls
      # the system libraries the headless shell needs.
      - name: install browsers
        run: pnpm --dir e2e exec playwright install --with-deps chromium
      - name: start stack
        run: docker compose -p communication-e2e -f compose.yml -f e2e/compose.e2e.yml up -d --build
      # Fails closed (navigation/health errors) when the stack is unreachable;
      # never skips (ADR-0006 Verification).
      - name: run e2e suite
        run: pnpm --dir e2e test
      # HTML report plus per-test traces/screenshots (retained on failure by
      # playwright.config.ts). Short retention: traces can capture session
      # cookies (ADR-0006 Security/privacy).
      - name: upload report and failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-e2e-${{ github.run_attempt }}
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7
      - name: teardown
        if: always()
        run: docker compose -p communication-e2e -f compose.yml -f e2e/compose.e2e.yml down -v

  image-main:
    name: image (main)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [go, audit]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # .goreleaser.yaml before.hooks run pnpm to build the embedded ui/dist
      # (ADR-0007), so this job needs the same pinned Node/pnpm setup as the
      # ui job before GoReleaser runs.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.0
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      # The image is built for linux/amd64 and linux/arm64 in one snapshot run,
      # so the arm64 layers need qemu user emulation.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Snapshot build: GoReleaser compiles both architectures and builds (but
      # never pushes) the per-platform images, tagged
      # ghcr.io/dbirks/communication:main-linux-{amd64,arm64}.
      - name: Build snapshot image
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.18.3
          args: release --snapshot --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Push the arch images, then compose the multi-arch manifests ADR-0004
      # promises for the main branch: :main and :sha-<short sha>.
      - name: Publish main and sha tags
        run: |
          set -euo pipefail
          repo=ghcr.io/dbirks/communication
          short="$(git rev-parse --short=7 HEAD)"
          docker push "${repo}:main-linux-amd64"
          docker push "${repo}:main-linux-arm64"
          docker buildx imagetools create \
            -t "${repo}:main" \
            "${repo}:main-linux-amd64" "${repo}:main-linux-arm64"
          docker buildx imagetools create \
            -t "${repo}:sha-${short}" \
            "${repo}:main-linux-amd64" "${repo}:main-linux-arm64"
