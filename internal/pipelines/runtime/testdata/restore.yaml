# restore_checkpoint, authored (ADR-0023 § 6, contract § 3 row 8): /a carries
# onExecutionError: continue so /b's failure is the only thing that can end the
# run, and /b asks for its workspace to be restored from the last committed
# checkpoint before its second attempt. Whether that boundary is actually
# committed is a run-time fact — the two checkpoint tests differ only in the
# `uncommitted` flag on /a's checkpoint — so the plan is the same document for
# both the refusal (checkpoint_unavailable) and the success
# (run.checkpoint_restored).
apiVersion: communication.dev/v1alpha1
kind: Pipeline
metadata:
  name: restore-checkpoint
spec:
  inputs:
    type: object
    required: [goal]
    properties:
      goal: {type: string, minLength: 1}
  policies:
    maxConcurrentNodes: 4
    maxDurationSeconds: 3600
    maxNodeExecutions: 50
    cancelPolicy: cascade
  nodes:
  - id: a
    kind: process.exec
    config:
      executable: a
    onFailure:
      onExecutionError: continue
  - id: b
    kind: process.exec
    dependsOn: [a]
    retry:
      maxAttempts: 2
      backoff: {baseSeconds: 1, multiplier: 2, maxSeconds: 30, jitter: false}
      retriableErrors: [infra, interrupted]
      workspacePolicy: restore_checkpoint
    config:
      executable: b
  resultBindings:
    b_status: ${{ nodes.b.status }}
