# Gate honesty (12 case 9 / C9): the gate holds no worker while a sibling
# branch keeps running, and the dependant reads the decision as a business
# outcome. The sibling carries an authored retry block (ADR-0023 § 7: base 1 s,
# multiplier 2, ±20 % jitter, three attempts over infra/interrupted/timeout),
# which is what lets the lease-expiry and human-takeover tests watch a real
# second attempt appear and watch the budget run out.
apiVersion: communication.dev/v1alpha1
kind: Pipeline
metadata:
  name: gate-and-sibling
spec:
  inputs:
    type: object
    required: [goal]
    properties:
      goal: {type: string, minLength: 1}
  policies:
    maxConcurrentNodes: 2
    maxDurationSeconds: 3600
    maxNodeExecutions: 50
    cancelPolicy: cascade
  nodes:
  - id: gate
    kind: human.approval
    config:
      summary: ${{ inputs.goal }}
      approverRoles: [maintainer]
      deadlineSeconds: 60
      onTimeout: fail
  - id: sibling
    kind: process.exec
    retry:
      maxAttempts: 3
      backoff: {baseSeconds: 1, multiplier: 2, maxSeconds: 60, jitter: true}
      retriableErrors: [infra, interrupted, timeout]
    config:
      executable: side
  - id: after
    kind: process.exec
    dependsOn: [gate]
    when: nodes.gate.outputs.decision == 'approved'
    config:
      executable: go_on
  resultBindings:
    gate_decision: ${{ nodes.gate.outputs.decision }}
