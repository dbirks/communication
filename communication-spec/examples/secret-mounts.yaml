# A design example for node secret mounts. NOT a real runnable pipeline manifest.
secret_mounts:
  - secret: project/test-database-url
    mode: env_file
    repository: backend
    relative_path: .env.test.local
    key: DATABASE_URL
    lifecycle: node_attempt
  - secret: project/github-app-token
    mode: env
    name: GH_TOKEN
    lifecycle: node_attempt
sandbox:
  backend: nono
  enforcement: required
  filesystem:
    writableRepositories: [backend]
    readableRepositories: [frontend, backend]
  network:
    default: deny
    # Provider-specific domain/endpoint enforcement must be verified in M0.
    allow: [api.github.com]
