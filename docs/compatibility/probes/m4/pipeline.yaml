          timeoutSeconds: 900
          retry:
            maxAttempts: 2
            backoff: {baseSeconds: 5, multiplier: 2, maxSeconds: 60, jitter: false}
            retriableErrors: [infra, interrupted]
          config:
            executable: m4-exit.sh
            args: [test]
            cwd: repos/app
