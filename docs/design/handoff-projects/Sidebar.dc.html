<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Red+Hat+Text:wght@400;500;600;700&family=Red+Hat+Mono:wght@400;500;600&family=Kaisei+Opti:wght@500&display=swap" rel="stylesheet">
</helmet>
<aside style="display:flex; flex-direction:column; gap:12px; width:240px; height:100%; box-sizing:border-box; flex-shrink:0; overflow:hidden; border-right:1px solid #1e1d1a; background:#fff; padding:12px 10px; color:#1e1d1a; font-family:'Red Hat Text',ui-sans-serif,system-ui,sans-serif;">
  <div style="display:flex; align-items:center; gap:9px; padding:0 4px;">
    <span style="position:relative; display:inline-block; width:26px; height:26px; flex-shrink:0;">
      <span style="position:absolute; top:3px; right:-3px; bottom:-3px; left:3px; border-radius:3px; background:repeating-linear-gradient(135deg,#2f4bd6 0 1px,transparent 1px 3px);"></span>
      <span style="position:absolute; inset:0; display:flex; align-items:center; justify-content:center; border-radius:3px; border:1px solid #1e1d1a; background:#fff; font-family:'Kaisei Opti',serif; font-weight:500; font-size:16px; line-height:1;">C</span>
    </span>
    <span style="flex:1; min-width:0; font-size:13.5px; font-weight:600;">Communication</span>
  </div>
  <div style="display:flex; gap:6px;">
    <button style="flex:1; height:30px; display:inline-flex; align-items:center; justify-content:center; padding:0 10px; border-radius:4px; border:1px solid #cfc9bd; background:#efede7; color:#1e1d1a; box-shadow:2px 2px 0 #cfc9bd; font-family:inherit; font-size:13px; font-weight:600;">New</button>
    <button style="height:30px; flex-shrink:0; border-radius:4px; border:1px solid #cfc9bd; background:#fff; padding:0 9px; font-family:'Red Hat Mono',monospace; font-size:11px; color:#1e1d1a; box-shadow:2px 2px 0 #cfc9bd; white-space:nowrap;">Ask ⌘K</button>
  </div>
  <nav style="display:flex; flex-direction:column; gap:2px;">
    <sc-for list="{{ nav }}" as="item" hint-placeholder-count="4">
      <a style="{{ item.style }}">
        <span style="flex:1; min-width:0;">{{ item.label }}</span>
        <span style="{{ item.flagStyle }}">{{ item.flag }}</span>
      </a>
    </sc-for>
  </nav>
  <div style="height:1px; background:#e6e2d9;"></div>
  <div style="display:flex; flex-direction:column; gap:4px;">
    <span style="padding:0 8px 4px; font-family:'Red Hat Mono',monospace; font-size:10px; letter-spacing:.06em; color:#6e6a62;">PROJECTS</span>
    <div style="display:flex; flex-direction:column; gap:1px;">
      <sc-for list="{{ projects }}" as="p" hint-placeholder-count="3">
        <div>
          <div style="{{ p.rowStyle }}">
            <svg width="16" height="16" viewBox="0 0 12 12" style="{{ p.chevStyle }}"><path d="M3 4.5l3 3 3-3" fill="none" stroke="#3a3833" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
            <span style="flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:12.5px; font-weight:600;">{{ p.name }}</span>
            <span style="{{ p.flagStyle }}">{{ p.flag }}</span>
          </div>
          <sc-if value="{{ p.showSections }}" hint-placeholder-val="{{ false }}">
            <div style="margin-left:14px; border-left:1px solid #e6e2d9; padding:2px 0 4px 10px; display:flex; flex-direction:column; gap:1px;">
              <sc-for list="{{ p.sections }}" as="s">
                <a style="{{ s.style }}">{{ s.label }}</a>
              </sc-for>
              <span style="padding:6px 8px 2px; font-family:'Red Hat Mono',monospace; font-size:9.5px; letter-spacing:.06em; color:#6e6a62;">REPOS</span>
              <sc-for list="{{ p.repos }}" as="r">
                <a style="{{ r.style }}">{{ r.name }}</a>
              </sc-for>
            </div>
          </sc-if>
          <sc-if value="{{ p.showRepos }}" hint-placeholder-val="{{ false }}">
            <div style="margin-left:14px; border-left:1px solid #e6e2d9; padding-left:10px;">
              <sc-for list="{{ p.repos }}" as="r">
                <a style="{{ r.style }}">{{ r.name }}</a>
              </sc-for>
            </div>
          </sc-if>
        </div>
      </sc-for>
    </div>
  </div>
  <div style="display:flex; flex-direction:column; gap:1px;">
    <span style="padding:0 8px 4px; font-family:'Red Hat Mono',monospace; font-size:10px; letter-spacing:.06em; color:#6e6a62;">LIBRARY</span>
    <div style="display:flex; align-items:center; gap:4px;">
      <svg width="14" height="14" viewBox="0 0 12 12" style="flex-shrink:0; margin:0 1px; transform:rotate(-90deg);"><path d="M3 4.5l3 3 3-3" fill="none" stroke="#3a3833" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      <a style="{{ wfStyle }}"><span style="flex:1;">Workflows</span><span style="font-family:'Red Hat Mono',monospace; font-size:10.5px; color:#6b675e;">5</span></a>
    </div>
    <sc-for list="{{ lib }}" as="item">
      <a style="{{ item.style }}"><span style="width:16px; flex-shrink:0;"></span><span style="flex:1;">{{ item.label }}</span><span style="font-family:'Red Hat Mono',monospace; font-size:10.5px; color:#6b675e;">{{ item.count }}</span></a>
    </sc-for>
  </div>
  <div style="margin-top:auto; border-top:1px solid #e6e2d9; padding:8px 4px 0;">
    <div style="display:flex; align-items:center; gap:8px; padding:3px 8px; border-radius:3px;">
      <span style="display:grid; place-items:center; width:26px; height:26px; border-radius:3px; border:1px solid #1e1d1a; background:#fff; font-family:'Red Hat Mono',monospace; font-size:10px;">DB</span>
      <strong style="font-size:12.5px; font-weight:600;">David Birks</strong>
    </div>
  </div>
</aside>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:240,&quot;height&quot;:800},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;inbox&quot;,&quot;board&quot;,&quot;threads&quot;,&quot;project&quot;,&quot;workflows&quot;,&quot;steps&quot;,&quot;profiles&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;project&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;nested&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;section&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;overview&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;repo&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? "home";
    const proj = this.props.project ?? "";
    const nested = this.props.nested ?? false;
    const section = this.props.section ?? "overview";
    const repo = this.props.repo ?? "";
    const ROW = { display: "flex", alignItems: "center", gap: 6, borderRadius: 3, border: "1px solid transparent", padding: "5px 8px", fontSize: 13, textDecoration: "none", color: "#6b675e" };
    const TEX = "repeating-linear-gradient(0deg,#e4e8fa 0 1px,transparent 1px 4px),repeating-linear-gradient(90deg,#e4e8fa 0 1px,transparent 1px 4px)";
    const ACT = { borderColor: "#1e1d1a", backgroundColor: "#fff", backgroundImage: TEX, fontWeight: 600, color: "#1e1d1a" };
    const row = (on, extra) => ({ ...ROW, ...(extra || {}), ...(on ? ACT : {}) });
    const flag = (c) => ({ marginLeft: "auto", flexShrink: 0, fontFamily: "'Red Hat Mono',monospace", fontSize: 10.5, fontWeight: 600, color: c });
    const AMBER = "#7a4a00", BLUE = "#0f5e96", RED = "#b0281a", MUTED = "#6b675e";
    const nav = [
      ["home", "Home", "", MUTED], ["inbox", "Inbox", "! 2", AMBER], ["board", "Board", "● 3", BLUE], ["threads", "Threads", "4", MUTED],
    ].map(([id, label, f, c]) => ({ label, flag: f, flagStyle: flag(c), style: row(active === id) }));
    const sectionDefs = [["overview", "Overview"], ["runs", "Runs"], ["threads", "Threads"], ["workflows", "Workflows"], ["settings", "Settings"]];
    const repoStyle = (on) => ({ display: "flex", padding: "3px 8px", fontFamily: "'Red Hat Mono',monospace", fontSize: 11.5, color: on ? "#1e1d1a" : "#3a3833", fontWeight: on ? 600 : 400, textDecoration: "none", borderRadius: 3, ...(on ? { background: "#f6f7fe" } : {}) });
    const projects = [
      { id: "northwind", name: "Northwind", flag: "! 1", c: AMBER, repos: ["storefront", "payments-api"] },
      { id: "lumen", name: "Lumen Docs", flag: "● 1", c: BLUE, repos: ["docs-site"] },
      { id: "tools", name: "Internal Tools", flag: "", c: MUTED, repos: ["cli"] },
    ].map((p) => {
      const isActive = p.id === proj;
      const open = isActive;
      return {
        name: p.name, flag: p.flag, flagStyle: flag(p.c),
        rowStyle: { display: "flex", alignItems: "center", gap: 4, padding: "4px 6px", borderRadius: 3, ...(isActive && nested ? { border: "1px solid #1e1d1a", backgroundImage: TEX, background: undefined } : { border: "1px solid transparent" }) },
        chevStyle: { flexShrink: 0, transform: open ? "none" : "rotate(-90deg)" },
        showSections: open && nested,
        showRepos: open && !nested,
        sections: sectionDefs.map(([id, label]) => ({ label, style: { ...ROW, padding: "4px 8px", fontSize: 12.5, ...(active === "project" && section === id && !repo ? { color: "#1e1d1a", fontWeight: 600, background: "#f6f7fe", borderColor: "#e4e8fa" } : {}) } })),
        repos: p.repos.map((r) => ({ name: r, style: repoStyle(isActive && repo === r) })),
      };
    });
    const lib = [["steps", "Steps", ""], ["profiles", "Agent profiles", "3"]].map(([id, label, count]) => ({ label, count, style: row(active === id) }));
    const wfStyle = { display: "flex", flex: 1, minWidth: 0, alignItems: "center", gap: 8, borderRadius: 3, border: "1px solid transparent", padding: "4px 8px", fontSize: 12.5, textDecoration: "none", color: "#6b675e", ...(active === "workflows" ? ACT : {}) };
    return { nav, projects, lib, wfStyle };
  }
}
</script>
</body>
</html>
