# acceptance.yml — the heavy acceptance suite, parallelized on standard runners.
#
# What this is: the phases the orchestrator used to run serially on one 15 GB
# laptop (~/.cache/pi-orch/communication/accept_run.sh, ~2 h) — the lab-gated
# Playwright suites, the live M4 exit gates (§ 7.1/§ 7.2), the "play the user"
# emulator loop and the real GitHub issue→draft-PR probe — codified as four
# PARALLEL jobs, one fresh communication-m4 stack per ubuntu-latest runner
# (4 vCPU / 16 GB; the repo is public, so the runners are free). The m4 phase is
# a SIX-shard matrix plus a stackless `m4 (regrade)` job that re-grades the
# § 7.1 cross-gate rows over the shards' uploaded witness files (see below).
#
# What this is NOT: the `ci` and `e2e` phases of accept_run.sh ARE ci.yml
# (go/contract/ui/e2e/m4-gate-logic jobs). Nothing here duplicates them; this
# workflow only carries the phases that need a live lab.
#
# Pinned actions follow ci.yml exactly (actions on major tags):
#   actions/checkout@v7 · actions/setup-node@v7 · pnpm/action-setup@v6 ·
#   actions/upload-artifact@v7 · actions/download-artifact@v7 (the regrade job's
#   witness download — the same major as the upload pin above). Node 24.22.0 and
#   pnpm (from e2e/package.json) are the ci.yml pins. Playwright chromium comes
#   from the e2e package's own @playwright/test 1.64.1. nono and apm are NOT
#   installed on the host here: the lab's worker image bakes both binaries in
#   (worker/Dockerfile's executionbin stage, sha256-pinned), so the runners need
#   nothing extra.
#
# Secrets (repository secrets, written to 0600 files under $RUNNER_TEMP and
# named through the *_FILE env vars the scripts already read — the values
# never appear on a command line and are never echoed):
#   COMMUNICATION_LLM_API_KEY        the gateway key for
#                                    llm-collective.e-gineering.com
#                                    (→ COMMUNICATION_LLM_API_KEY_HOST_FILE;
#                                    compose.real.yml + e2e/tests/helpers.ts's
#                                    restart interpolation read it). The SAME
#                                    file is what the pi launcher reads: the
#                                    compose.real.yml worker containers get
#                                    COMMUNICATION_PI_API_KEY_FILE=
#                                    /run/comm/llm-api-key, that key file
#                                    bind-mounted ro (ADR-0059).
#   COMMUNICATION_TEST_REPO_TOKEN    fine-grained token for the throwaway
#                                    repo dbirks/comms-test-repo-1
#                                    (→ COMMUNICATION_TEST_REPO_TOKEN_FILE;
#                                    docs/compatibility/probes/m4/gh-loop.sh)
# Agent launcher: COMMUNICATION_LAB_LAUNCHER=pi (workflow env below) seeds the
# lab's agent profiles on the pi launcher against the LLM collective instead
# of claude — runners have no ~/.claude login and the operator decision is NO
# Claude token. Honest state: launcher pi has no verified prompting mode, so
# the worker fail-closes agent.acp attempts on it under EVERY recorded
# permission mode (ADR-0019 D6; docs/compatibility/ACP.md "Pi", observed
# 2026-10-24); the affected gates/legs report GAPs naming launcher pi, never
# a pass. docs/testing/acceptance-ci.md carries the affected-leg list.
# GITHUB_TOKEN (workflow-level, issues: write) lets e2e/emulator/loop.sh's
# file-issues step file emulator defects as issues: `gh` (preinstalled on the
# runner) authenticates from GH_TOKEN in the environment; file-issues.mjs only
# shells out to `gh` and never touches tokens itself.
#
# Evidence: every job uploads its raw output and the stack's compose logs as
# an artifact (session storage states — admin.json / alice.json — are
# excluded from the emulator artifact; they are live cookies). Retention 7
# days. See docs/testing/acceptance-ci.md.
name: Acceptance

on:
  workflow_dispatch:
    inputs:
      jobs:
        description: >-
          Comma list limiting the run to named jobs/shards, e.g.
          "m4:watch,github-loop" or "m4" (all shards). "all" runs everything.
          Surrounding spaces are trimmed; unknown names fail the run loudly.
          Names: lab-e2e, m4, m4:fence, m4:restore, m4:watch,
          m4:fanout, m4:core-a, m4:core-b, verification, github-loop.
        required: false
        default: all
        type: string
  push:
    branches: [main]
  schedule:
    # Nightly 04:00 UTC — the full heavy suite on main regardless of pushes.
    - cron: "0 4 * * *"

permissions:
  contents: read
  # The emulator loop files recurring UI defects as issues (file-issues.mjs
  # via `gh`); nothing else here writes.
  issues: write

concurrency:
  group: acceptance-${{ github.ref }}
  # NEVER cancel-in-progress: the first real run cancelled itself the moment
  # main moved again, losing hours of lab work mid-shard. A running
  # acceptance run always finishes; GitHub keeps only the NEWEST queued run
  # per group, so superseded pushes collapse in the queue instead of killing
  # a finished-past-the-halfway run.
  cancel-in-progress: false

env:
  # The ci.yml pins, in one place.
  NODE_VERSION: "24.22.0"
  M4_COMPOSE: docker compose -p communication-m4 -f compose.yml -f compose.harness.yml -f compose.m4.yml -f compose.real.yml
  # Lab agent launcher (seed.sh / seed-github-loop.sh read it; unset keeps
  # local behaviour = claude). pi's per-turn config reaches the WORKER
  # containers through compose.real.yml: COMMUNICATION_PI_API_KEY_FILE is
  # /run/comm/llm-api-key there — the COMMUNICATION_LLM_API_KEY secret file
  # bind-mounted ro (ADR-0059) — and the base URL + model interpolate from
  # the COMMUNICATION_LLM_* pair below (identical defaults; set explicitly so
  # an operator repoints the whole suite in one place). The
  # COMMUNICATION_PI_* pair mirrors them for anything reading the launcher's
  # own names on the host.
  COMMUNICATION_LAB_LAUNCHER: pi
  COMMUNICATION_LLM_BASE_URL: https://llm-collective.e-gineering.com/v1
  COMMUNICATION_LLM_MODEL: david-birks/qwen3-8-flash-next
  COMMUNICATION_PI_BASE_URL: https://llm-collective.e-gineering.com/v1
  COMMUNICATION_PI_MODEL: david-birks/qwen3-8-flash-next

jobs:
  # ────────────────────────────────────────────────────────────────────
  # select: parses the workflow_dispatch `jobs` input into the per-job
  # booleans and the m4 matrix JSON the other jobs read through `needs`
  # (matrix is not an available context in jobs.<id>.if, so per-shard
  # filtering must be computed here, not inline). push/schedule always
  # mean "all". Unknown names fail the run here — a typo must not
  # silently skip every job.
  # ────────────────────────────────────────────────────────────────────
  select:
    name: select jobs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      lab-e2e: ${{ steps.pick.outputs.lab-e2e }}
      m4: ${{ steps.pick.outputs.m4 }}
      m4-all: ${{ steps.pick.outputs.m4-all }}
      m4-shards: ${{ steps.pick.outputs.m4-shards }}
      verification: ${{ steps.pick.outputs.verification }}
      github-loop: ${{ steps.pick.outputs.github-loop }}
    steps:
      - id: pick
        env:
          JOBS: ${{ github.event_name == 'workflow_dispatch' && inputs.jobs || 'all' }}
        run: |
          set -eu
          J="$(printf '%s' "${JOBS:-all}" | tr -d '[:space:]')"; : "${J:=all}"
          sel() { [ "$J" = all ] && return 0; case ",$J," in *",$1,"*) return 0 ;; *) return 1 ;; esac; }
          # Loud typo guard: every token must name a job or a shard — an
          # unrecognised name must fail the run, not silently skip everything.
          if [ "$J" != all ]; then
            KNOWN=",lab-e2e,m4,m4:fence,m4:restore,m4:watch,m4:fanout,m4:core-a,m4:core-b,verification,github-loop,"
            IFS=',' read -r -a TOKENS <<< "$J"
            for t in "${TOKENS[@]}"; do
              [ -n "$t" ] || continue
              case "$KNOWN" in
                *",$t,"*) ;;
                *) echo "::error::jobs input names unknown job/shard [$t]"; exit 1 ;;
              esac
            done
          fi
          for job in lab-e2e verification github-loop; do
            if sel "$job"; then echo "$job=true" >> "$GITHUB_OUTPUT"; else echo "$job=false" >> "$GITHUB_OUTPUT"; fi
          done
          # The m4 shard→gates table. The exit driver's `--list` re-checks
          # every shard's gate ids at run time ("check the shard's gate ids
          # exist"), so drift between this table and the driver fails loudly.
          inc=()
          names=()
          for pair in "fence:C3,C4,C5,W2" "restore:C6" "watch:W5,W6,W11" "fanout:C8" "core-a:C1,C2,C7,C9,C10,W1,W3,W7" "core-b:C11,C12,C13,C14,W4,W8,W9,W10"; do
            if sel m4 || sel "m4:${pair%%:*}"; then
              inc+=("{\"shard\":\"${pair%%:*}\",\"gates\":\"${pair#*:}\"}")
              names+=("${pair%%:*}")
            fi
          done
          m4_json="[$(IFS=,; printf '%s' "${inc[*]}")]"
          echo "m4=$m4_json" >> "$GITHUB_OUTPUT"
          echo "m4-shards=$(IFS=,; printf '%s' "${names[*]}")" >> "$GITHUB_OUTPUT"
          # m4-all: EVERY shard ran, so every cross-gate witness exists somewhere in
          # this run and `m4 (regrade)` can grade the rows the shards printed PENDING
          # for. One shard short and the answer is false — those rows must stay GAPs
          # in their own shard rather than promise a regrade that will not run.
          if [ "${#names[@]}" -eq 6 ]; then
            echo "m4-all=true" >> "$GITHUB_OUTPUT"
          else
            echo "m4-all=false" >> "$GITHUB_OUTPUT"
            echo "::notice::m4 (regrade) will be SKIPPED: only [$(IFS=,; printf '%s' "${names[*]}")] of the six m4 shards ran, so a cross-gate row's witness (C11c over C8b/C10a/C1f/C2c/C2d, C5g/C6c against C1's key set) may never exist in this run — those rows print GAP where they ran, and the run carries no merged verdict."
          fi
          echo "selection: $J -> m4 matrix $m4_json"

  # ────────────────────────────────────────────────────────────────────
  # accept_run.sh's `lab` phase: every lab-gated e2e suite (M5, shell,
  # issue2, home, harness flags) against a fresh seeded lab. The verdict is
  # the Playwright list summary: any failed/skipped/flaky/did-not-run line
  # fails the job, and a run that never reached a summary at all fails too
  # (a crashed reporter is not "0 failed").
  # ──────────────────────────────────────────────────────────────────────────
  lab-e2e:
    name: lab-e2e
    needs: select
    if: ${{ needs.select.outputs.lab-e2e == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      # Worker-image build hardening: worker/Dockerfile's executionbin stage
      # uses .release-assets/ from the build context when present and only
      # falls back to the GitHub release CDN (which intermittently 504s for
      # minutes); either way every tarball passes the same pinned
      # `sha256sum -c`. On a cache hit the fetch step is a no-op, and the key
      # IS the pins (any version bump in worker/Dockerfile changes it).
      - name: cache release assets
        uses: actions/cache@v4
        with:
          path: .release-assets
          key: release-assets-${{ runner.os }}-${{ hashFiles('worker/Dockerfile') }}
      - name: fetch release assets
        run: bash scripts/fetch-release-assets.sh
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: e2e/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: e2e/pnpm-lock.yaml
      - name: install (e2e package + chromium)
        run: |
          set -euo pipefail
          pnpm --dir e2e install --frozen-lockfile
          pnpm --dir e2e exec playwright install --with-deps chromium
      - name: install python3-yaml
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3-yaml
      - name: write the gateway key file
        env:
          COMMUNICATION_LLM_API_KEY: ${{ secrets.COMMUNICATION_LLM_API_KEY }}
        run: |
          set -eu
          [ -n "$COMMUNICATION_LLM_API_KEY" ] \
            || { echo "::error::repository secret COMMUNICATION_LLM_API_KEY is missing"; exit 1; }
          d="$RUNNER_TEMP/comm-secrets"; mkdir -p "$d"; chmod 700 "$d"
          # printf is the bash builtin: the value never enters an argv word;
          # only the file PATH is exported (the *_FILE indirection the host
          # scripts already use).
          printf '%s' "$COMMUNICATION_LLM_API_KEY" > "$d/llm-api-key"
          chmod 600 "$d/llm-api-key"
          echo "COMMUNICATION_LLM_API_KEY_HOST_FILE=$d/llm-api-key" >> "$GITHUB_ENV"
      - name: write the GitHub read-token file (ADR-0061 credential for m5gh-*)
        env:
          # The job's own token — any valid GITHUB_TOKEN reads PUBLIC repo
          # data (api.github.com), and an authenticated read costs 5000
          # requests/hour instead of the anonymous 60 this egress IP shares
          # with every other workflow. e2e/tests/m5-issue-run.spec.ts reads
          # this file and attaches it to its m5gh-* repository row as an
          # integration_broker secret credential (ADR-0061), so the issue
          # picker's live read is authenticated and the leg never skips.
          GH_READ_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          [ -n "$GH_READ_TOKEN" ] \
            || { echo "::error::the run's GITHUB_TOKEN is empty — the lab cannot read GitHub authenticated"; exit 1; }
          d="$RUNNER_TEMP/comm-secrets"; mkdir -p "$d"; chmod 700 "$d"
          # printf is the bash builtin: the value never enters an argv word
          # and is never echoed; only the file PATH is exported (the *_FILE
          # indirection the lab scripts already use everywhere else).
          printf '%s' "$GH_READ_TOKEN" > "$d/github-read-token"
          chmod 600 "$d/github-read-token"
          echo "E2E_GITHUB_READ_TOKEN_FILE=$d/github-read-token" >> "$GITHUB_ENV"
      - name: bring the lab up
        run: bash scripts/lab-up.sh
      - name: seed (§ 7.0 contract)
        run: bash docs/compatibility/probes/m4/seed.sh
      - name: run the lab-gated suites
        env:
          # Named explicitly at the consumer (same idiom as the launcher
          # knob below): the m5gh-* repo row's ADR-0061 GitHub credential,
          # so the issue picker reads api.github.com authenticated and the
          # leg is deterministic on shared runner egress IPs.
          E2E_GITHUB_READ_TOKEN_FILE: ${{ env.E2E_GITHUB_READ_TOKEN_FILE }}
          # The four real-agent specs (home-cluster, m2-journey, m5-inbox,
          # shell-journey) read this same knob (e2e/tests/lab-launcher.ts):
          # under pi they pick the pi launcher card and seed their profiles
          # as autonomous_within_sandbox (ADR-0069), exactly like the seed
          # step above. Workflow-level env already reaches every step; this
          # names it explicitly at the consumer so a refactor cannot drop it
          # silently.
          COMMUNICATION_LAB_LAUNCHER: ${{ env.COMMUNICATION_LAB_LAUNCHER }}
        run: |
          set -uo pipefail
          HOST_UID="$(id -u)"; HOST_GID="$(id -g)"; export HOST_UID HOST_GID
          # The exact accept_run.sh `lab` phase environment.
          export COMMUNICATION_E2E_M5=1 COMMUNICATION_E2E_SHELL=1 COMMUNICATION_E2E_ISSUE2=1 COMMUNICATION_E2E_HOME=1 COMMUNICATION_E2E_HARNESS=1 COMMUNICATION_E2E_SHELL_JOURNEY=1
          export E2E_SHELL_STAMP="j$RANDOM"
          export E2E_BASE_URL=http://localhost:18091 E2E_API_A_URL=http://localhost:18092 E2E_API_B_URL=http://localhost:18093
          export E2E_HOME_URL=http://localhost:18091 E2E_COMPOSE_PROJECT=communication-m4 E2E_COMPOSE_FILES=compose.yml,compose.harness.yml,compose.m4.yml,compose.real.yml
          pnpm --dir e2e exec playwright test --reporter=list > lab-list.txt 2>&1 || true
          tail -20 lab-list.txt
          # A missing summary means the reporter never finished — not a pass.
          grep -qE '^ +[0-9]+ (passed|failed|tests? ran)' lab-list.txt \
            || { echo "no Playwright summary line in lab-list.txt — the run did not complete"; exit 1; }
          if grep -qE '^ +[0-9]+ (failed|skipped|flaky|did not run)' lab-list.txt; then
            echo "lab suite reported a non-clean summary (see above)"
            exit 1
          fi
      - name: dump compose state
        if: failure()
        run: |
          set -uo pipefail
          # compose.real.yml interpolates ${LLMC_API_KEY:?} at config render,
          # so `ps` and `logs` need it too — lab-up.sh exported it only inside
          # its own step. Read it back from the key file (a shell assignment:
          # never an argv word, never printed); skipped when the key step
          # itself failed, where there is no file to read.
          if [ -n "${COMMUNICATION_LLM_API_KEY_HOST_FILE:-}" ] && [ -r "$COMMUNICATION_LLM_API_KEY_HOST_FILE" ]; then
            LLMC_API_KEY="$(cat "$COMMUNICATION_LLM_API_KEY_HOST_FILE")"; export LLMC_API_KEY
          fi
          ${{ env.M4_COMPOSE }} ps -a || true
      - name: capture compose logs
        if: always()
        run: |
          set -uo pipefail
          # Same render-time requirement as the step above: without this the
          # capture died on "services.worker-a…LLMC_API_KEY is missing" and
          # lab-compose.log held the interpolation error, not the lab logs.
          if [ -n "${COMMUNICATION_LLM_API_KEY_HOST_FILE:-}" ] && [ -r "$COMMUNICATION_LLM_API_KEY_HOST_FILE" ]; then
            LLMC_API_KEY="$(cat "$COMMUNICATION_LLM_API_KEY_HOST_FILE")"; export LLMC_API_KEY
          fi
          ${{ env.M4_COMPOSE }} logs --no-color --timestamps > lab-compose.log 2>&1 || true
      - name: upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lab-e2e-${{ github.run_attempt }}
          path: |
            lab-list.txt
            lab-compose.log
          if-no-files-found: ignore
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────────────
  # accept_run.sh's `m4` phase: the live § 7.1/§ 7.2 exit gates, sharded so
  # every long fault group owns a runner. The shard→gates table lives in the
  # select job (single source); it is exactly the gate table of
  # `python3 e2e/m4/e2e_m4_exit.py --list` (C1–C14, W1–W11),
  # each id in exactly one shard — the "gates in --list" step re-proves the
  # ids on every run, and docs/testing/acceptance-ci.md carries the coverage
  # table. Cross-gate witnesses decide shard membership:
  #   * C3d is regraded at process exit from C4's in-process verdict lines
  #     → C3 rides with C4;
  #   * C11c is regraded from C12/C13/C14's verdicts → they share a shard;
  #   * W2's transcript arm prefers the run C4e fenced its real turn inside,
  #     and W11's attempt-pair arm reads the interrupted-then-succeeded pair
  #     W5's kill produces → W2 rides with C4/C5, W11 with W5.
  # Each shard runs the driver exactly as accept_run does (`--up --ready
  # --seed`, the driver's own 3-file stack bring-up — note that stack has NO
  # compose.real.yml, so its workers hold no PI_*/gateway env at all; with
  # launcher pi the attempt still fails closed at the prompting-mode gate
  # BEFORE any credential read, so the verdict is the same honest refusal
  # docs/testing/acceptance-ci.md names), on its own fresh
  # runner, and uploads m4.out + compose logs whatever the verdicts say.
  # ──────────────────────────────────────────────────────────────────────────
  m4:
    name: m4 (${{ matrix.shard }})
    # `jobs=m4` selects every shard; `jobs=m4:watch` (etc.) one shard. The
    # include list is built by select — matrix is not readable in a job-level
    # if, so the filtering happens there, and an empty selection skips the
    # whole job rather than spawning a matrix of nothing.
    needs: select
    if: ${{ needs.select.outputs.m4 != '[]' && needs.select.outputs.m4 != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select.outputs.m4) }}
    env:
      SHARD: ${{ matrix.shard }}
      GATES: ${{ matrix.gates }}
    steps:
      - uses: actions/checkout@v7
      # Worker-image build hardening (see lab-e2e's identical step): the m4
      # driver's `--up` builds worker/Dockerfile from this checkout, so the
      # .release-assets cache keeps its nono/apm/gh fetches off the flaky
      # GitHub release CDN. Verification (sha256sum -c) is unchanged.
      - name: cache release assets
        uses: actions/cache@v4
        with:
          path: .release-assets
          key: release-assets-${{ runner.os }}-${{ hashFiles('worker/Dockerfile') }}
      - name: fetch release assets
        run: bash scripts/fetch-release-assets.sh
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: e2e/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: e2e/pnpm-lock.yaml
      - name: install (e2e package + chromium for the W legs' playwright-cli)
        run: |
          set -euo pipefail
          pnpm --dir e2e install --frozen-lockfile
          # The W gates drive `pnpm dlx @playwright/cli@0.1.22`, which bundles
          # its OWN playwright-core 1.64.0-alpha pinning chromium v1247 — a
          # DIFFERENT build than the v1248 the e2e package's playwright 1.64.1
          # installs. On a fresh runner only 1248 exists and `open` dies
          # daemon-side (Actions run 41408536765: "Daemon pid=…: Browser
          # \"chrome-for-testing\" is not installed; expected executable at
          # …/chromium-1247/chrome-linux64/chrome", reproduced locally by
          # pointing PLAYWRIGHT_BROWSERS_PATH at a 1248-only cache). So the
          # CLI installs its own revision into the shared
          # ~/.cache/ms-playwright registry; system deps come from the
          # --with-deps install below (identical for the two revisions).
          pnpm dlx @playwright/cli@0.1.22 install-browser chromium
          pnpm --dir e2e exec playwright install --with-deps chromium
      - name: playwright-cli preflight (open must work on this runner)
        # Fails the job on its own, printing FULL stdout+stderr, so a browser
        # problem never hides inside a W-gate verdict line truncated at the
        # stack header. Named session `preflight` only — never `default`,
        # and close closes exactly that one.
        run: |
          set -eu
          rc=0
          pnpm dlx @playwright/cli@0.1.22 -s=preflight open --browser=chromium about:blank || rc=$?
          pnpm dlx @playwright/cli@0.1.22 -s=preflight close || true
          if [ "$rc" != 0 ]; then
            echo "::error::playwright-cli open failed on this runner (rc=$rc) — the W legs cannot drive a browser"
            exit "$rc"
          fi
          echo "playwright-cli preflight: open+close OK"
      - name: install python3-yaml
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3-yaml
      - name: agent homes the harness overlay binds
        # ${HOME}/.claude / ${HOME}/.codex are rw binds in compose.harness.yml;
        # create them empty when the runner has none so the mount resolves —
        # the agent legs then fail on the missing LOGIN (honest), not on a
        # root-owned docker-created directory. See the report section in
        # docs/testing/acceptance-ci.md.
        run: mkdir -p "$HOME/.claude" "$HOME/.codex"
      - name: write the gateway key file
        env:
          COMMUNICATION_LLM_API_KEY: ${{ secrets.COMMUNICATION_LLM_API_KEY }}
        run: |
          set -eu
          [ -n "$COMMUNICATION_LLM_API_KEY" ] \
            || { echo "::error::repository secret COMMUNICATION_LLM_API_KEY is missing"; exit 1; }
          d="$RUNNER_TEMP/comm-secrets"; mkdir -p "$d"; chmod 700 "$d"
          d="$RUNNER_TEMP/comm-secrets"; mkdir -p "$d"; chmod 700 "$d"
          printf '%s' "$COMMUNICATION_LLM_API_KEY" > "$d/llm-api-key"
          chmod 600 "$d/llm-api-key"
          # The FILE path is what compose.m4-llm.yml MOUNTS for the pi launcher
          # (COMMUNICATION_PI_API_KEY_FILE: file delivery per ADR-0040/0059 — the
          # only form the Go launcher code reads).
          echo "COMMUNICATION_LLM_API_KEY_HOST_FILE=$d/llm-api-key" >> "$GITHUB_ENV"
          # …and the VALUE is what the SAME layer feeds the worker's model.chat
          # key: cmd/communication/worker.go's parseModelChatOptions reads
          # COMMUNICATION_MODEL_CHAT_API_KEY from the environment and has NO
          # _FILE form (checked 2026-11-05), so § 7.1 C10c's model.chat reviewer
          # arm needs the value in the env the exit driver renders compose with.
          # A shell assignment that reads the file back (the scripts/lab-up.sh
          # idiom for compose.real.yml): never an argv word, never echoed, never
          # logged. The m4 exit driver composes compose.m4-llm.yml off these two
          # variables and prints only the layer NAMES.
          LLMC_API_KEY="$(cat "$d/llm-api-key")"; export LLMC_API_KEY
          echo "LLMC_API_KEY=$LLMC_API_KEY" >> "$GITHUB_ENV"
      - name: check the shard's gate ids exist
        run: |
          set -euo pipefail
          python3 - "$GATES" "$SHARD" <<'PY'
          import subprocess, sys
          wanted = [g.strip().upper() for g in sys.argv[1].split(",") if g.strip()]
          listed = {line.split()[0] for line in subprocess.run(
              ["python3", "e2e/m4/e2e_m4_exit.py", "--list"],
              capture_output=True, text=True, check=True
          ).stdout.splitlines() if line.strip()}
          missing = [g for g in wanted if g not in listed]
          if not wanted or missing:
              sys.exit(f"shard {sys.argv[2]} names gate ids not in --list: {missing or '(empty shard)'}")
          print(f"shard {sys.argv[2]}: {len(wanted)} gate ids, all listed: {','.join(wanted)}")
          PY
      - name: run shard (fresh stack via --up --ready --seed)
        env:
          # The witness contract: every shard records what it measured, and the
          # cross-gate rows may only print PENDING when `m4 (regrade)` will run to
          # grade them (select's m4-all — one shard short and there is nothing to
          # merge, so the honest word stays GAP).
          M4_ALL: ${{ needs.select.outputs.m4-all }}
        # The driver composes compose.m4-llm.yml ON TOP of its three files
        # because this job exported COMMUNICATION_LLM_API_KEY_HOST_FILE (plus
        # LLMC_API_KEY for the worker's model.chat): with the layer the agent
        # legs MEASURE (launcher pi reaches the gateway on the mounted key) and
        # m4.out's first line names the composed files. With no readable key
        # file the driver stays on the three files and the launcher-pi refusal
        # GAP path stands (docs/testing/acceptance-ci.md).
        run: |
          set -uo pipefail
          HOST_UID="$(id -u)"; HOST_GID="$(id -g)"; export HOST_UID HOST_GID
          rc=0
          args=(--up --ready --seed --only "$GATES" --shard "$SHARD"
                --witness m4-witness.json)
          [ "$M4_ALL" = "true" ] && args+=(--expect-regrade)
          python3 e2e/m4/e2e_m4_exit.py "${args[@]}" > m4.out 2>&1 || rc=$?
          echo "m4 shard $SHARD exit rc=$rc — summary tail:"
          tail -60 m4.out
          [ -f m4-witness.json ] || echo "::warning::shard $SHARD left no m4-witness.json — m4 (regrade) will fail naming it"
          exit $rc
      - name: capture compose logs
        if: always()
        run: |
          set -uo pipefail
          # The same -f list the driver brought the stack up with: the m4-llm
          # layer rides this job's exported key variables, and capturing logs
          # WITHOUT it would describe a stack that is not the one that ran.
          M4_F=(-f compose.yml -f compose.harness.yml -f compose.m4.yml)
          if [ -n "${COMMUNICATION_LLM_API_KEY_HOST_FILE:-}" ] \
              && [ -r "$COMMUNICATION_LLM_API_KEY_HOST_FILE" ]; then
            M4_F+=(-f compose.m4-llm.yml)
          fi
          docker compose -p communication-m4 "${M4_F[@]}" \
            logs --no-color --timestamps > m4-compose.log 2>&1 || true
          docker compose -p communication-m4 "${M4_F[@]}" \
            down -v --remove-orphans || true
      - name: upload shard evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: m4-${{ matrix.shard }}-${{ github.run_attempt }}
          path: |
            m4.out
            m4-compose.log
            m4-witness.json
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────────
  # m4 (regrade): the cross-GATE rows the shards could only print PENDING
  # for. docs/m4-contract.md § 7.1 grades several rows off ANOTHER gate's
  # measurement (C11c's structural arms over C8b/C14a/C10a/C10b/C7c/C1f/
  # C2c/C13c/C2d/C12a/C12b/C13b; C5g's and C6c's "the same node_instance_key
  # set as C1"; C3d's citation of C4's fence), and the shards are six
  # separate driver processes on six fresh stacks — so the in-process ledger
  # can never see them and the row used to file a GAP that still let the
  # shard job pass. Each shard now uploads m4-witness.json (every verdict
  # line + the node_instance_key sets later gates compare against); this job
  # merges them and re-grades every cross-gate row over the union with NO
  # stack, failing on any FAIL and on any witness no shard ever measured
  # (including a shard whose witness never arrived). It runs when ALL six
  # shards ran; otherwise it prints a notice and exits — a partial selection
  # has no merged record, and there the rows stay honest GAPs in their own
  # shard rather than promises nobody keeps. Key-set rows compare STRUCTURE
  # (the node_instance_key SETs the same § 7.0 seed pipeline produces on
  # fresh stacks), which is exactly what the contract rows claim.
  # ──────────────────────────────────────────────────────────────────────
  m4-regrade:
    name: m4 (regrade)
    # !cancelled(): a shard that went red still uploaded its witness (the
    # upload step is `if: always()`), and grading what those shards measured
    # is information the run should not lose behind the shard's own failure.
    needs: [select, m4]
    if: ${{ needs.select.outputs.m4 != '[]' && needs.select.outputs.m4 != '' && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      M4_ALL: ${{ needs.select.outputs.m4-all }}
      M4_SHARDS: ${{ needs.select.outputs.m4-shards }}
    steps:
      - uses: actions/checkout@v7
      - name: check the shard coverage
        id: scope
        run: |
          set -eu
          if [ "$M4_ALL" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Skipped WITH a notice: a job-level `if` that hides this job would
          # leave the PENDING rows unowned and unread, which is the silence
          # the whole regrade exists to prevent.
          echo "::notice::m4 (regrade) SKIPPED — the run selected [$M4_SHARDS] of the six m4 shards, so no merged witness record exists. Cross-gate rows (§ 7.1 C11c arms, C5g, C6c, C3d) printed GAP where they ran; run the full 'm4' (or 'all') matrix to grade them."
          echo "run=false" >> "$GITHUB_OUTPUT"
      - name: download the shards' witness files
        if: steps.scope.outputs.run == 'true'
        uses: actions/download-artifact@v7
        with:
          # Only the six shard artifacts (m4-<shard>-<attempt>); this job's own
          # regrade evidence artifact is uploaded after the download.
          pattern: m4-*-${{ github.run_attempt }}
          path: m4-witnesses
          merge-multiple: false
      - name: regrade the cross-gate rows over every shard's witnesses
        if: steps.scope.outputs.run == 'true'
        run: |
          set -uo pipefail
          files=()
          while IFS= read -r f; do files+=("$f"); done \
            < <(find m4-witnesses -name m4-witness.json 2>/dev/null | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::no m4-witness.json in any shard artifact — every cross-gate row this run passed on PENDING is ungradeable"
            exit 1
          fi
          echo "regrading over ${#files[@]} witness file(s), expected shards: $M4_SHARDS"
          rc=0
          python3 e2e/m4/e2e_m4_exit.py --regrade "${files[@]}" \
            --expect-shards "$M4_SHARDS" > m4-regrade.out 2>&1 || rc=$?
          echo "m4 (regrade) exit rc=$rc — verdict tail:"
          tail -80 m4-regrade.out
          exit $rc
      - name: upload the regrade verdicts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: regrade-m4-${{ github.run_attempt }}
          path: |
            m4-regrade.out
          if-no-files-found: warn
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────────────
  # accept_run.sh's `emu` phase: the "play the user" loop, six passes with a
  # full lab rebuild ($LAB_RESET_CMD) before each, stopping at two clean
  # passes. New fingerprints file as GitHub issues (label `emulator`) under
  # the job's GITHUB_TOKEN; the run's own pass artifacts carry the evidence.
  # ──────────────────────────────────────────────────────────────────────────
  verification:
    name: verification (emulator loop)
    needs: select
    if: ${{ needs.select.outputs.verification == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      # `gh` (preinstalled) authenticates from GH_TOKEN; file-issues.mjs
      # shells out to gh and never reads a token itself.
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # File against the repository this workflow runs in (the module
      # default is dbirks/communication; the env keeps it honest on forks).
      EMU_ISSUES_REPO: ${{ github.repository }}
      # loop.sh eval's this before every pass; on CI the lab is this
      # checkout, so scripts/lab-up.sh IS the reset (see its header).
      LAB_RESET_CMD: bash scripts/lab-up.sh && bash docs/compatibility/probes/m4/seed.sh
    steps:
      - uses: actions/checkout@v7
      # Worker-image build hardening (see lab-e2e's identical step): every
      # LAB_RESET_CMD pass rebuilds through scripts/lab-up.sh from the repo
      # root, so .release-assets is in the compose build context for all of
      # them — a CDN 504 mid-loop no longer resets a pass's clock.
      - name: cache release assets
        uses: actions/cache@v4
        with:
          path: .release-assets
          key: release-assets-${{ runner.os }}-${{ hashFiles('worker/Dockerfile') }}
      - name: fetch release assets
        run: bash scripts/fetch-release-assets.sh
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: e2e/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: e2e/pnpm-lock.yaml
      - name: install (e2e package + chromium)
        run: |
          set -euo pipefail
          pnpm --dir e2e install --frozen-lockfile
          # The emulator loop drives @playwright/test (v1248 below); the
          # CLI's own chromium v1247 is installed too and proven by the
          # preflight, so a broken runner browser shows up HERE, in its own
          # step with full stderr, not only inside pass verdicts. Same
          # revision-skew story as the m4 job's install step.
          pnpm dlx @playwright/cli@0.1.22 install-browser chromium
          pnpm --dir e2e exec playwright install --with-deps chromium
      - name: playwright-cli preflight (open must work on this runner)
        # Named session `preflight` only — never `default`; close closes
        # exactly that one. FULL stdout+stderr lands in the job log.
        run: |
          set -eu
          rc=0
          pnpm dlx @playwright/cli@0.1.22 -s=preflight open --browser=chromium about:blank || rc=$?
          pnpm dlx @playwright/cli@0.1.22 -s=preflight close || true
          if [ "$rc" != 0 ]; then
            echo "::error::playwright-cli open failed on this runner (rc=$rc)"
            exit "$rc"
          fi
          echo "playwright-cli preflight: open+close OK"
      - name: install python3-yaml
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3-yaml
      - name: write the gateway key file
        env:
          COMMUNICATION_LLM_API_KEY: ${{ secrets.COMMUNICATION_LLM_API_KEY }}
        run: |
          set -eu
          [ -n "$COMMUNICATION_LLM_API_KEY" ] \
            || { echo "::error::repository secret COMMUNICATION_LLM_API_KEY is missing"; exit 1; }
          d="$RUNNER_TEMP/comm-secrets"; mkdir -p "$d"; chmod 700 "$d"
          printf '%s' "$COMMUNICATION_LLM_API_KEY" > "$d/llm-api-key"
          chmod 600 "$d/llm-api-key"
          echo "COMMUNICATION_LLM_API_KEY_HOST_FILE=$d/llm-api-key" >> "$GITHUB_ENV"
      - name: write the GitHub read-token file (ADR-0061 credential for `server`)
        env:
          # The job's own token — any valid GITHUB_TOKEN reads PUBLIC repo
          # data (api.github.com), and an authenticated read costs 5000
          # requests/hour instead of the anonymous 60 this egress IP shares
          # with every other workflow. e2e/emulator/github-read-credential.ts
          # reads this file and attaches it to the journey's `server`
          # repository row as an integration_broker secret credential
          # (ADR-0061), so the rcn-3b ISSUES lane's live read is
          # authenticated and the pass is not at the mercy of a spent budget.
          GH_READ_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          [ -n "$GH_READ_TOKEN" ] \
            || { echo "::error::the run's GITHUB_TOKEN is empty — the emulator cannot read GitHub authenticated"; exit 1; }
          d="$RUNNER_TEMP/comm-secrets"; mkdir -p "$d"; chmod 700 "$d"
          # printf is the bash builtin: the value never enters an argv word
          # and is never echoed; only the file PATH is exported (the *_FILE
          # indirection the lab scripts already use everywhere else), and the
          # spec reads it into a secret POST body only — never a log, argv or
          # the pass's results.json.
          printf '%s' "$GH_READ_TOKEN" > "$d/github-read-token"
          chmod 600 "$d/github-read-token"
          echo "E2E_GITHUB_READ_TOKEN_FILE=$d/github-read-token" >> "$GITHUB_ENV"
      - name: run the emulator loop (max 6 passes, 2 consecutive clean to pass)
        env:
          # Named explicitly at the consumer (same idiom as lab-e2e's run
          # step): loop.sh passes its own environment straight to
          # `pnpm --dir e2e exec playwright test`, so this is how the knob
          # reaches the spec process that writes the ADR-0061 credential.
          E2E_GITHUB_READ_TOKEN_FILE: ${{ env.E2E_GITHUB_READ_TOKEN_FILE }}
        run: bash e2e/emulator/loop.sh --max-passes 6
      - name: upload pass evidence (screenshots, results.json, reports)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: emulator-out-${{ github.run_attempt }}
          # admin.json / alice.json are the passes' live session storage
          # states (cookies + CSRF) — they never leave the runner
          # (ADR-0006 Security/privacy; AGENTS.md no-secrets).
          path: |
            e2e/emulator/out/
            !e2e/emulator/out/**/admin.json
            !e2e/emulator/out/**/alice.json
          if-no-files-found: ignore
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────────────
  # The REAL issue → draft-PR loop on the throwaway repo: seed the gh-loop
  # project, fire two labeled GitHub issues, and require each to come back
  # as a draft PR from comm/issue-* (docs/compatibility/probes/m4/gh-loop.sh).
  # The run can take hours per issue (the driver's own FIRE_WAIT/RUN_WAIT
  # budgets), hence the long job timeout.
  # ──────────────────────────────────────────────────────────────────────────
  github-loop:
    name: github-loop
    needs: select
    if: ${{ needs.select.outputs.github-loop == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      # Worker-image build hardening (see lab-e2e's identical step).
      - name: cache release assets
        uses: actions/cache@v4
        with:
          path: .release-assets
          key: release-assets-${{ runner.os }}-${{ hashFiles('worker/Dockerfile') }}
      - name: fetch release assets
        run: bash scripts/fetch-release-assets.sh
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: e2e/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: e2e/pnpm-lock.yaml
      - name: install (e2e package + chromium)
        run: |
          set -euo pipefail
          pnpm --dir e2e install --frozen-lockfile
          pnpm --dir e2e exec playwright install --with-deps chromium
      - name: install python3-yaml
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3-yaml
      - name: write the gateway key file
        env:
          COMMUNICATION_LLM_API_KEY: ${{ secrets.COMMUNICATION_LLM_API_KEY }}
        run: |
          set -eu
          [ -n "$COMMUNICATION_LLM_API_KEY" ] \
            || { echo "::error::repository secret COMMUNICATION_LLM_API_KEY is missing"; exit 1; }
          d="$RUNNER_TEMP/comm-secrets"; mkdir -p "$d"; chmod 700 "$d"
          printf '%s' "$COMMUNICATION_LLM_API_KEY" > "$d/llm-api-key"
          chmod 600 "$d/llm-api-key"
          echo "COMMUNICATION_LLM_API_KEY_HOST_FILE=$d/llm-api-key" >> "$GITHUB_ENV"
      - name: write the throwaway-repo token file
        env:
          COMMUNICATION_TEST_REPO_TOKEN: ${{ secrets.COMMUNICATION_TEST_REPO_TOKEN }}
        run: |
          set -eu
          [ -n "$COMMUNICATION_TEST_REPO_TOKEN" ] \
            || { echo "::error::repository secret COMMUNICATION_TEST_REPO_TOKEN is missing"; exit 1; }
          d="$RUNNER_TEMP/comm-secrets"; mkdir -p "$d"; chmod 700 "$d"
          printf '%s' "$COMMUNICATION_TEST_REPO_TOKEN" > "$d/test-repo-token"
          chmod 600 "$d/test-repo-token"
          # gh-loop.sh / seed-github-loop.sh read the token from this file and
          # never from argv or the environment's plain value.
          echo "COMMUNICATION_TEST_REPO_TOKEN_FILE=$d/test-repo-token" >> "$GITHUB_ENV"
      - name: bring the lab up
        run: bash scripts/lab-up.sh
      - name: seed (§ 7.0 contract; gh-loop's own project seed runs on demand)
        run: bash docs/compatibility/probes/m4/seed.sh
      - name: run the GitHub issue→draft-PR loop (2 issues)
        run: |
          set -uo pipefail
          rc=0
          bash docs/compatibility/probes/m4/gh-loop.sh 2 > gh-loop.out 2>&1 || rc=$?
          echo "gh-loop exit rc=$rc — verdict tail:"
          tail -60 gh-loop.out
          exit $rc
      - name: capture compose logs
        if: always()
        run: ${{ env.M4_COMPOSE }} logs --no-color --timestamps > gh-loop-compose.log 2>&1 || true
      - name: upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: github-loop-${{ github.run_attempt }}
          path: |
            gh-loop.out
            gh-loop-compose.log
          if-no-files-found: ignore
          retention-days: 7
