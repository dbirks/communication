# Retry-feedback sample (ADR-0023 § 6's retry_context, ADR-0073): one
# agent.acp /plan whose DECLARED outputs cap `plan.summary` at
# maxLength 600, exactly like the lab's feature-development planner node
# whose replies ran 647/760/765 characters long and were refused three
# times with the same prompt. invalid_output sits inside retriableErrors,
# so the boundary's refusal must reach the NEXT attempt as
# retry_context.validation_errors — the point being to let the retry
# correct the field, not repeat it.
apiVersion: communication.dev/v1alpha1
kind: Pipeline
metadata:
  name: outputs-retry
  description: One planner node whose declared summary maxLength arms the retry feedback path.
spec:
  inputs:
    type: object
    required: [goal]
    properties:
      goal: {type: string, minLength: 1}
  policies:
    maxConcurrentNodes: 1
    maxDurationSeconds: 3600
    maxNodeExecutions: 50
    cancelPolicy: cascade
  nodes:
  - id: plan
    kind: agent.acp
    retry:
      maxAttempts: 3
      backoff: {baseSeconds: 5, multiplier: 2, maxSeconds: 60, jitter: false}
      retriableErrors: [infra, interrupted, invalid_output]
    config:
      profile: m4-planner
      sessionMode: new
      prompt: |
        Goal: ${{ inputs.goal }}
        Reply with JSON {plan:{summary}} only.
    outputs:
      type: object
      required: [plan]
      properties:
        plan:
          type: object
          required: [summary]
          properties:
            summary: {type: string, minLength: 1, maxLength: 600}
