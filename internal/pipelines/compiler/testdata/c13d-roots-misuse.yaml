apiVersion: communication.dev/v1alpha1
kind: Pipeline
metadata:
  name: m4x-c13d-misuse
  description: Plan, approve, implement, test, review, loop until verified, publish evidence.
spec:
  inputs:
    type: object
    required: [goal, repository]
    properties:
      goal: {type: string, minLength: 1}
      repository: {type: string, minLength: 1}
      acceptance_criteria:
        type: string
        default: Tests pass, the plan is followed, and the reviewer approves.
      fanout:
        type: boolean
        default: false
        description: Arms the C8 for_each fan-out branch (emit_items + fan_out run only when true).
      fanout_count:
        type: integer
        minimum: 0
        maximum: 1000
        default: 0
        description: Items the m4-exit.sh items fixture emits (C8a 0, C8b-e 25).
  outputs:
    type: object
    required: [implementation_summary]
    properties:
      implementation_summary: {type: string}
      review_approved: {type: boolean}
      iterations: {type: integer}
  policies:
    maxConcurrentNodes: 1
    maxDurationSeconds: 3600
    maxNodeExecutions: 50
    maxChildDepth: 0
    workspaceMode: worktree
    cancelPolicy: cascade
  nodes:
  - id: m_item
    kind: agent.acp
    timeoutSeconds: 60
    config:
      profile: m4-planner
      sessionMode: new
      prompt: 'item -> ${{ item.x }}'
  - id: m_items
    kind: agent.acp
    dependsOn: [m_item]
    timeoutSeconds: 60
    config:
      profile: m4-planner
      sessionMode: new
      prompt: 'items -> ${{ items.x }}'
  - id: m_previous
    kind: agent.acp
    dependsOn: [m_items]
    timeoutSeconds: 60
    config:
      profile: m4-planner
      sessionMode: new
      prompt: 'previous -> ${{ previous.x }}'
  - id: m_iteration
    kind: agent.acp
    dependsOn: [m_previous]
    timeoutSeconds: 60
    config:
      profile: m4-planner
      sessionMode: new
      prompt: 'iteration -> ${{ iteration > 1 ? "2+" : "1" }}'
  - id: m_parameters
    kind: agent.acp
    dependsOn: [m_iteration]
    timeoutSeconds: 60
    config:
      profile: m4-planner
      sessionMode: new
      prompt: 'parameters -> ${{ parameters.x }}'
