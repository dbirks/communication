# docs/samples/home/issue-to-pr.yaml — the product's core loop as one pipeline:
# a GitHub issue in, a tested change out as a DRAFT pull request (ADR-0045's
# agent-held push token is what makes the push and the PR possible).
#
# Unlike the two samples beside this file, it is agent-driven: two agent.acp
# nodes on pi coding agents inside the nono sandbox. A worker can run it only
# with all of this in place:
#
#   • two agent profiles on the pi launcher
#     (docs/adr/ADR-0059-pi-acp-launcher-api-key.md: the worker image ships
#     pi + pi-acp, and the operator's COMMUNICATION_PI_API_KEY_FILE /
#     COMMUNICATION_PI_BASE_URL / COMMUNICATION_PI_MODEL are what the launcher
#     delivers into pi's models.json): `pi-planner` (read-only checkout, no
#     token) and `pi-implementer` (run_workspace, holds the push token).
#   • a project secret `github-push-token` (delivery mode env, env_name
#     GH_TOKEN) allowlisted to pi-implementer ONLY — ADR-0045; the planner
#     never sees it. The token rides the exec environment, never argv
#     (ADR-0040), and git + gh are in the worker image.
#   • worker agent egress widened past the api.anthropic.com default to
#     github.com + api.github.com (COMMUNICATION_AGENT_EGRESS_ALLOW, ADR-0035)
#     so the sandbox can git push and run `gh pr create`.
#   • for a PRIVATE repository: the repository row's GitHub credential
#     (docs/adr/ADR-0061-repository-github-credential.md) — without it the
#     anonymous clone/issue read fails before node 1 runs.
#
# `goal` is the issue title + body (the project's GitHub issue trigger's
# template fills it, ADR-0056); `repository` is the project's repository
# BINDING name (07), not a URL, and the checkout lands at repos/<binding
# name> in the run workspace.
#
# Paste into Library → New pipeline → New draft, Validate, Publish, then
# assign to a project and start a run (by hand or via an issue trigger).
# Nothing here publishes to main: the deliverable is a DRAFT PR a maintainer
# reviews and a human merges.
apiVersion: communication.dev/v1alpha1
kind: Pipeline
metadata:
  name: issue-to-pr
  description: >-
    Take a GitHub issue, plan it on the repository checkout with a pi agent, hold the plan behind a maintainer approval, implement it in the sandbox, push the branch and open a draft pull request with the allowlisted token, and publish the delivery report.
spec:
  inputs:
    type: object
    required:
      - goal
      - repository
    properties:
      goal:
        type: string
        minLength: 1
        description: The issue title + body — the issue trigger's template fills this.
      repository:
        type: string
        minLength: 1
        description: Project repository binding name, e.g. app.
      issue_number:
        type: integer
        minimum: 0
        default: 0
        description: GitHub issue number; 0 = the goal carries no issue.
      branch_prefix:
        type: string
        minLength: 1
        default: comm/issue-
        description: >-
          Branch prefix; the branch is <prefix><issue_number>-<slug>, or
          <prefix>run-<slug> when issue_number is 0.
  outputs:
    type: object
    required:
      - pr_url
      - branch
    properties:
      pr_url:
        type: string
      branch:
        type: string
  policies:
    maxConcurrentNodes: 1
    maxDurationSeconds: 7200
    maxNodeExecutions: 20
    maxChildDepth: 0
    workspaceMode: worktree
    cancelPolicy: cascade
  nodes:
    # 1. The plan. A pi agent on the READ-ONLY checkout: it reads the repository
    #    itself, not a survey digest. The reply contract is the probe document's
    #    strict style (docs/compatibility/probes/m4/pipeline.yaml): summary is
    #    REQUIRED and <=600 chars (the prompt asks for 450 or fewer — the margin
    #    is deliberate, a model that writes to "600" lands at 699) because the
    #    expression language has no join /
    #    format function (ADR-0022 § 5) and it is the only plan text a human sees
    #    at the approval gate; steps and test_plan stay in the node outputs.
    #    invalid_output is retriable (run 42452527578: the pi session died
    #    mid-answer and the truncated reply failed extraction, killing the run
    #    with no second attempt) and the prompt below pins the final message to
    #    the JSON object alone, as /implement's does. The prompt also STATES the
    #    schema's limits to the agent: run 42495774259 died at /plan three times
    #    — summary at 806 then 675 characters, then a reply with no top-level
    #    `plan` object — because the limits this node's `outputs` schema enforces
    #    were never written down where the model could read them.
    - id: plan
      kind: agent.acp
      timeoutSeconds: 900
      retry:
        maxAttempts: 3
        backoff:
          baseSeconds: 5
          multiplier: 2
          maxSeconds: 120
          jitter: true
        retriableErrors:
          - infra
          - interrupted
          - timeout
          - agent_error
          - invalid_output
      config:
        profile: pi-planner
        sessionMode: new
        workspace:
          mode: read_only
          repositories:
            - '${{ inputs.repository }}'
        prompt: |
          Goal (a GitHub issue; the number is ${{ inputs.issue_number }} and 0
          means no issue number — the text below is the whole brief):
          ${{ inputs.goal }}

          Repository checkout (read-only): ${{ inputs.repository }}
          Read the repository — layout, the files the goal touches, how it is
          tested — and plan the change. Your reply is machine-checked against the
          JSON schema below, so reply with JSON of exactly this shape:
          {"plan": {"goal": "<one-sentence objective>",
                    "summary": "<the plan as a human reads it>",
                    "steps": [{"file": "<repo path>", "action": "<the change to make>"}],
                    "test_plan": "<what the implementer must run to prove it>"}}
          Field meanings and EVERY limit that schema enforces — breaking one fails
          the node even when the plan is good:
            plan — REQUIRED object, and the only top-level property. `goal` /
              `summary` at the top level, or plan sent as a string, fails as
              "missing property 'plan'". Never wrap plan in a string.
            plan.goal — string, non-empty (minLength 1): the objective in one
              sentence.
            plan.summary — string, non-empty and AT MOST 600 CHARACTERS
              (maxLength: 600 is a hard ceiling, not a target). This is the ONLY
              plan text a human sees at the approval gate: 2-6 short lines, plain
              text or simple "- " bullets, one planned change per line in order,
              no JSON, no braces or quotes, nothing that only makes sense next to
              the full steps array — aim for ~450 characters so there is margin
              under the 600 the reply is checked against.
            plan.steps — array with AT LEAST 1 item (minItems: 1; no upper limit).
              Each item is an object carrying BOTH `file` (a repository path,
              non-empty string) and `action` (the change to make, non-empty
              string).
            plan.test_plan — string, non-empty (minLength 1): names the test
              command(s) the implementer must get green.
          Your FINAL message must be ONLY the JSON object — no tool-call markup, no
          narration, no markdown fence; a final message that is not the object
          fails the node even when the work is done.
      outputs:
        type: object
        required:
          - plan
        properties:
          plan:
            type: object
            required:
              - goal
              - summary
              - steps
              - test_plan
            properties:
              goal:
                type: string
                minLength: 1
              summary:
                type: string
                minLength: 1
                maxLength: 600
              steps:
                type: array
                minItems: 1
                items:
                  type: object
                  required:
                    - file
                    - action
                  properties:
                    file:
                      type: string
                      minLength: 1
                    action:
                      type: string
                      minLength: 1
              test_plan:
                type: string
                minLength: 1
    # 2. A maintainer decides. The approval renders goal + plan summary + test
    #    plan; steps stay in the node outputs the approver can open.
    - id: approve
      kind: human.approval
      dependsOn:
        - plan
      retry:
        maxAttempts: 1
      config:
        summary: |
          Issue for repository ${{ inputs.repository }} (issue number ${{ inputs.issue_number }}):
          ${{ inputs.goal }}

          Plan:
          ${{ nodes.plan.outputs.plan.summary }}

          Test plan:
          ${{ nodes.plan.outputs.plan.test_plan }}
        approverRoles:
          - maintainer
        deadlineSeconds: 86400
        onTimeout: fail
    # 3. The change. A pi agent in the run workspace holding the allowlisted
    #    push token (secretRefs: project/github-push-token, env GH_TOKEN — the
    #    only profile the secret is authorized for). It implements, tests until
    #    green, pushes the branch and opens a DRAFT PR itself; the token never
    #    lands in argv or any file (ADR-0045, ADR-0040). invalid_output is
    #    retriable like /plan (run 42213500404: the agent opened PR #411, then
    #    its final message was broken tool-call markup, and the run died with
    #    no second attempt); the retry is idempotent because workspacePolicy
    #    defaults to continue_workspace (ADR-0023 § 6) and the prompt below
    #    makes the agent reuse the existing branch and PR instead of opening
    #    duplicates.
    - id: implement
      kind: agent.acp
      dependsOn:
        - approve
      timeoutSeconds: 3600
      retry:
        maxAttempts: 2
        backoff:
          baseSeconds: 10
          multiplier: 2
          maxSeconds: 120
          jitter: true
        retriableErrors:
          - infra
          - interrupted
          - timeout
          - agent_error
          - invalid_output
      config:
        profile: pi-implementer
        sessionMode: new
        workspace:
          mode: run_workspace
          repositories:
            - '${{ inputs.repository }}'
        secretRefs:
          - project/github-push-token
        prompt: |
          Implement the approved plan in repository ${{ inputs.repository }}.
          Goal: ${{ inputs.goal }}
          Approved plan (JSON): ${{ nodes.plan.outputs.plan }}
          Approved test plan: ${{ nodes.plan.outputs.plan.test_plan }}

          Issue number: ${{ inputs.issue_number }} (0 means no issue); branch
          prefix: ${{ inputs.branch_prefix }}
          This attempt may be a RETRY: the workspace carries what earlier
          attempts did and the branch may already be pushed with a draft PR
          open. Finish that work — never create a second branch or a second
          pull request for this issue.
          1. Look FIRST for an existing branch for this issue, locally
             (git branch --list "<issue branch prefix>*") and on origin
             (git ls-remote --heads origin "<issue branch prefix>*"), where
             the issue branch prefix is <branch_prefix><issue_number>- (or
             <branch_prefix>run- when the issue number is 0); if one exists,
             check it out and work on it. Only when none exists, create
             <branch_prefix><issue_number>-<short-slug> — a short slug of a
             few lowercase words from the goal — or
             <branch_prefix>run-<short-slug> when the issue number is 0.
          2. Implement the plan step by step; add or adjust tests for the change.
          3. Find the project's test command (README first, then package.json
             scripts — for this sample's repo it is `npm test`) and run it; fix
             and re-run until the whole suite is green.
          4. Commit with a message referencing Fixes #<issue_number> when the
             issue number is > 0; when an earlier attempt already committed
             the work and the tree is clean, there is nothing to commit.
          5. Push: git push -u origin <branch>.
          6. Publish the DRAFT pull request for that branch. Check for an
             existing PR first (gh pr view on the branch): if one exists — an
             earlier attempt opened it — update it with gh pr edit and report
             its URL; NEVER open a duplicate. Only when no PR exists yet, run
             gh pr create --draft --title "<goal in one line>" --body "<plan
             summary, then the tail of the final test output, then a line
             Closes #<issue_number> when the issue number is > 0>". Use the
             GH_TOKEN environment for authentication.
          7. Reply with JSON of exactly this shape — your reply is machine-checked
             against the JSON schema below:
          {"summary": "<what you changed and why, in prose>",
           "branch": "<the branch you pushed, exactly as pushed>",
           "pr_url": "<the draft PR URL gh reported>",
           "tests_passed": true,
           "files_changed": ["<repo path>"]}
          Field meanings and EVERY limit that schema enforces — breaking one fails
          the node even when the draft PR is already open:
            summary — REQUIRED string, non-empty (minLength 1): ONE plain-text
              string, what you changed and why.
            branch — REQUIRED string, non-empty (minLength 1): the exact ref you
              pushed.
            pr_url — REQUIRED string that must match the pattern
              ^https://github.com/.+/pull/[0-9]+$ — the exact URL gh printed, so
              https://github.com/<owner>/<repo>/pull/<number>: no trailing slash,
              no query string, no surrounding words, not a compare or tree URL.
            tests_passed — REQUIRED JSON boolean (true/false, never "true"), true
              only if the last full test run was green.
            files_changed — OPTIONAL array of repository path strings, one path
              per element, [] when nothing changed; no maximum length.
          There is no wrapper object: these fields are the whole top-level object.
          Write nothing outside this object. Your FINAL message must be ONLY the
          JSON object — no tool-call markup, no
          narration, no markdown fence; a final message that is not the object
          fails the node even when the work is done.
      outputs:
        type: object
        required:
          - summary
          - branch
          - pr_url
          - tests_passed
        properties:
          summary:
            type: string
            minLength: 1
          branch:
            type: string
            minLength: 1
          pr_url:
            type: string
            pattern: ^https://github.com/.+/pull/[0-9]+$
          tests_passed:
            type: boolean
          files_changed:
            type: array
            items:
              type: string
    # 4. The artifact a reviewer finds after the run closes: the implement
    #    node's reply (summary, branch, pr_url, tests_passed, files_changed).
    - id: report
      kind: artifact.publish
      dependsOn:
        - implement
      config:
        name: delivery.md
        kind: markdown
        mediaType: text/markdown
        sensitivity: standard
        from:
          mode: output_json
          value: ${{ nodes.implement.outputs }}
  resultBindings:
    pr_url: ${{ nodes.implement.outputs.pr_url }}
    branch: ${{ nodes.implement.outputs.branch }}
