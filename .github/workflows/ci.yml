# CI for the Communication monorepo (ADR-0004: GitHub Actions; ADR-0007: one Go
# module at the repo root, ui/ holds the Vite + React SPA).
#
# Pinned versions — looked up 2026-10-14, actions on exact major tags, tools on
# exact versions:
#   actions/checkout@v7                     latest release v7.0.1
#   actions/setup-go@v7                     latest release v7.0.0
#   actions/setup-node@v7                   latest release v7.1.0
#   pnpm/action-setup@v6                    latest release v6.1.0
#   actions/upload-artifact@v7              latest release v7.0.2
#   docker/login-action@v4                  latest release v4.6.0
#   docker/setup-buildx-action@v4           latest release v4.4.1
#   docker/setup-qemu-action@v4             latest release v4.4.0
#   goreleaser/goreleaser-action@v7         latest release v7.3.0
#   GoReleaser                v2.18.3       (config schema version: 2)
#   golang.org/x/vuln/cmd/govulncheck       v1.9.0
#   github.com/google/go-licenses           v1.6.0
#   pnpm                                      12.11.2
#   Node.js                                   24.22.0 (current LTS line)
#   @redocly/cli                            2.63.0 (API contract lint, api/README.md)
#   openapi-typescript                    7.13.0 (ui/tools/apigen only — the API type generator; the app itself builds on TypeScript 7 and keeps its pins in ui/package.json / ui/tools/apigen/package.json)
#   @playwright/test                        1.64.1 (e2e/ Playwright suite, ADR-0006)
#   nono                                    0.80.0 (go job: the real sandbox binary
#                                             the M3 tests exec. Same pin, tarball
#                                             sha256 and gnu build as
#                                             worker/Dockerfile's NONO_SHA256 and
#                                             docs/compatibility/probes/sandbox/
#                                             README.md — the build every
#                                             docs/compatibility/SANDBOX.md row
#                                             was observed against)
#   apm                                     0.34.0 (go job: the real package-manager
#                                             CLI the lab-gated APM resolve tests
#                                             exec. Same pin and tarball sha256 as
#                                             worker/Dockerfile's APM_SHA256 and the
#                                             provenance line in
#                                             docs/compatibility/APM.md)
# Container images for the go job's integration services (12-test-strategy:
# real Postgres/OIDC, never mocks):
#   postgres                                18.6
#   ghcr.io/navikt/mock-oauth2-server       6.0.7 (ADR-0012 dev/CI IdP)
#   chrislusf/seaweedfs                     4.48 (S3 conformance speaker, ADR-0020;
#                                             same pin as compose.yml's optional s3
#                                             profile)
# Go itself is NOT pinned here: it comes from go.mod via go-version-file.
#
# Only GITHUB_TOKEN is used anywhere in this repository's workflows. Publish
# steps are the only ones granted packages: write (ADR-0004 Security/privacy).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Every commit on main must finish and publish its image for Flux to roll out.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  go:
    name: go
    runs-on: ubuntu-latest
    # Integration tests (internal/store/postgres today, the OIDC login path as
    # it lands) skip unless these point at the services below, so CI runs them
    # for real rather than as mocks (12-test-strategy).
    #
    # Every remaining precondition lives on the `go test` step, not here: the
    # pg_dump check needs this job's postgres service *container id* (the `job`
    # context is not available in job-level env), the real-APM proofs need the
    # CLI installed below plus COMMUNICATION_APM_REAL, and the S3 conformance
    # suite needs the SeaweedFS speaker started above it. With all of them set
    # nothing in `./...` has a reason to skip, and the gate after the test step
    # fails the job if one does anyway.
    env:
      COMMUNICATION_TEST_DATABASE_URL: postgres://ci@localhost:5432/ci?sslmode=disable
      COMMUNICATION_TEST_OIDC_ISSUER: http://localhost:18091/default
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        # Probe over TCP, never the UNIX socket: on a fresh volume the official
        # image first runs a temporary initdb server (listen_addresses='',
        # socket only), so a socket probe can go healthy while the job's TCP
        # connect to localhost:5432 is still refused. TCP only accepts once the
        # real server is up.
        options: --health-cmd "pg_isready -h 127.0.0.1 -p 5432 -U ci -d ci" --health-interval 2s --health-timeout 5s --health-retries 20
      oidc:
        # ADR-0012: real OIDC (discovery, JWKS, signed ID tokens), interactive
        # login only — no credentials exist to commit.
        image: ghcr.io/navikt/mock-oauth2-server:6.0.7
        env:
          JSON_CONFIG: '{"interactiveLogin":true}'
        ports:
          - 18091:8080
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The real-nono tests (internal/sandbox/nono) skip when the binary is not
      # on PATH — an honest gap, never a mock (AGENTS.md). This job is where that
      # gap is meant to close, so install the pinned build the same way the
      # worker image does (worker/Dockerfile stage `executionbin`): the gnu build
      # (not musl — the probe matrix ran against gnu) and `sha256sum -c` against
      # the digest recorded in that Dockerfile, the probes README and
      # docs/compatibility/SANDBOX.md.
      # The digest is pinned *here* rather than read from the release's own
      # SHA256SUMS.txt, because that file arrives over the same channel as the
      # tarball and verifies nothing on its own; it is checked as a second,
      # independent witness all the same, and the *extracted* binary is checked
      # too so the hash that fails names the layer that drifted.
      # A failed fetch or a hash mismatch fails this step loudly rather than
      # degrading to a skip: a silently absent sandbox binary is how these tests
      # stop being evidence without anyone noticing (AGENTS.md: the compatibility
      # table is never prefilled with PASS).
      # The script body below is the one that was run for real before it was
      # committed: verified fetch + both hashes + `nono 0.80.0` executing out of
      # $RUNNER_TEMP/nono-bin on the lab host.
      - name: Install pinned nono (real sandbox tests)
        run: |
          set -euo pipefail
          ver=0.80.0
          asset="nono-v${ver}-x86_64-unknown-linux-gnu"
          tarsum=6da665b61999570c10dffc7da78828fe1fb7f3cac53319e505cebecaef17037f
          binsum=e02d003d52b3f65e8c75358eb73e339ad952a2876529047e61183b46eff1287d
          dl="$RUNNER_TEMP/nono-dl"; bin="$RUNNER_TEMP/nono-bin"
          mkdir -p "$dl" "$bin"
          curl -fsSL --retry 3 -o "$dl/$asset.tar.gz" \
            "https://github.com/nolabs-ai/nono/releases/download/v${ver}/$asset.tar.gz"
          curl -fsSL --retry 3 -o "$dl/SHA256SUMS.txt" \
            "https://github.com/nolabs-ai/nono/releases/download/v${ver}/SHA256SUMS.txt"
          ( cd "$dl"
            printf '%s  %s.tar.gz\n' "$tarsum" "$asset" | sha256sum --strict --check -
            sha256sum --ignore-missing --check SHA256SUMS.txt
            tar -xzf "$asset.tar.gz" -C "$bin" )
          printf '%s  %s/nono\n' "$binsum" "$bin" | sha256sum --strict --check -
          chmod 0755 "$bin/nono"
          echo "$bin" >> "$GITHUB_PATH"
      # The two real-APM proofs — TestResolveRealLockDigest (internal/agent/apm)
      # and TestAPMSandboxRealResolveUnderNono (internal/worker) — gate on
      # COMMUNICATION_APM_REAL plus the pinned apm CLI on PATH, and answer with
      # the lock digest that internal/agent/apm/stage.go's PinnedVersion and
      # docs/compatibility/APM.md pin. This is worker/Dockerfile's `executionbin`
      # apm leg verbatim: same release, same tarball digest, same
      # `sha256sum --strict --check`. The release's own `.sha256` sidecar is
      # fetched and checked as a second, independent witness (it arrives over the
      # same channel as the tarball, so it verifies nothing alone — the pin above
      # is the authority), and the version the binary reports is checked too, so
      # a failing step names the layer that drifted. A mismatch fails loudly:
      # digest-comparison evidence produced by a different apm build is not
      # evidence about the pinned one.
      #
      # Two properties of the bundle decide *where* it may live:
      #   * apm is a PyInstaller bundle — `apm` and `_internal/` are one unit and
      #     the top-level directory is stripped on extraction, exactly as the
      #     Dockerfile's /opt/apm is built. The directory goes on PATH; it is not
      #     a single copied binary.
      #   * it must not land under /tmp, /var/tmp or /dev/shm: the worker's
      #     sandboxed resolve grants a *tool read* on the resolved apm directory,
      #     and a grant inside the default-writable temp tree is refused rather
      #     than silently widened (probe C-TMP1 — wsgit.CheckGrantPath, enforced
      #     for tool reads by nono.BuildLaunchArgv; observed locally as "tool read
      #     grant /tmp/... is not usable", which fails this proof outright).
      #     $RUNNER_TEMP is /home/runner/work/_temp on a GitHub-hosted runner, so
      #     it is a legitimate grant target; the worker test's own scratch comes
      #     from $HOME/.cache/communication-lab (procExecScratch), also outside
      #     the temp tree.
      # The bundle needs glibc >= 2.38 (its bundled libpython3.12 — the same
      # measured requirement that pushed worker/Dockerfile's base to trixie) and
      # libffi.so.8 (its _ctypes extension dlopens it). Both hold on the
      # ubuntu-24.04 line (verified in a bare ubuntu:24.04 container here: glibc
      # 2.39, /usr/lib/x86_64-linux-gnu/libffi.so.8), and what the image
      # ubuntu-latest points at *this run* is settled by the `apm --version` smoke
      # below rather than by this comment: if the runner cannot execute the pinned
      # build, the step fails loudly with that message instead of letting the two
      # proofs below degrade into a skip.
      - name: Install pinned apm (real APM resolve tests)
        run: |
          set -euo pipefail
          ver=0.34.0
          asset="apm-linux-x86_64.tar.gz"
          apmsum=4487af55604b4fa6f4587f3ee6e833b44ce99c491f11069790e4e13e297cde8c
          dl="$RUNNER_TEMP/apm-dl"; bin="$RUNNER_TEMP/apm-bin"
          mkdir -p "$dl" "$bin"
          curl -fsSL --retry 3 -o "$dl/$asset" \
            "https://github.com/microsoft/apm/releases/download/v${ver}/${asset}"
          curl -fsSL --retry 3 -o "$dl/${asset}.sha256" \
            "https://github.com/microsoft/apm/releases/download/v${ver}/${asset}.sha256"
          ( cd "$dl"
            printf '%s  %s\n' "$apmsum" "$asset" | sha256sum --strict --check -
            sha256sum --strict --check "$asset.sha256"
            tar -xzf "$asset" -C "$bin" --strip-components=1 )
          test -x "$bin/apm"; test -d "$bin/_internal"
          chmod 0755 "$bin/apm"
          echo "$bin" >> "$GITHUB_PATH"
          "$bin/apm" --version | grep -qF "version ${ver}"
          "$bin/apm" --version
      # What this runner can actually enforce, on the record. The real-nono
      # tests skip with this same probe's verdict as their reason (see
      # requireRealNono in internal/sandbox/nono/selftest_test.go), so this is
      # the log line that distinguishes "enforcement was observed here" from
      # "the runner cannot enforce and said so". This step is not itself a gate
      # (it prints and moves on); the no-skips gate on the go test step is what
      # makes "cannot enforce" visible as a red job instead of a silent gap.
      # Read this step's output first when that gate names a real-nono test.
      # What is *expected* is a Landlock ABI v6 runner: the ubuntu-24.04 image
      # line runs a 6.x azure kernel and Ubuntu builds `landlock` into its boot
      # LSM list (landlock.io lists Ubuntu and Azure Linux as enabled by default;
      # other projects' Landlock CI treats ubuntu-latest as v6-capable and
      # ubuntu-22.04 as ABI v4). What is *claimed* is only what the line below
      # prints — the runner is the authority on itself, and the lab's matrix
      # (docs/compatibility/SANDBOX.md) was measured on Landlock V6.
      - name: Sandbox capability report
        run: |
          set -uo pipefail
          uname -r
          echo "lsm: $(cat /sys/kernel/security/lsm 2>/dev/null || echo UNREADABLE)"
          nono --version
          nono setup --check-only -v \
            || echo 'nono cannot enforce on this runner: the real-nono tests will skip, not pass vacuously'
      - name: go vet
        run: go vet ./...
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: go build
        run: go build ./...
      # S3 conformance (ADR-0020 D7 / objective 3): the artifacts package's
      # suite refuses to run against an S3 speaker that does not actually
      # verify SigV4 signatures (storeVerifiesSignatures precondition), because
      # an anonymous-friendly gateway would let the whole suite pass on a
      # broken signer — an observed fact from this lab, where SeaweedFS's
      # default accepted unsigned writes. So this speaker is started with an
      # identities file and the suite runs for real against it. The identity
      # is generated at run time, never committed, and valid only inside this
      # ephemeral container (AGENTS.md: no credentials in the repository).
      # Flags mirror the lab-verified container, which is also compose.yml's
      # optional `s3` profile.
      #
      # The speaker comes up BEFORE the test step rather than driving its own
      # run: with the endpoint and identity published to the job environment,
      # TestS3ConformanceAgainstSeaweedFS executes inside the main pass, under
      # the same -race -p 1 invocation as every other package. A separate
      # `go test` for one named test was how a suite could go unrun (renamed,
      # or never reached) while the step stayed green; the main pass runs what
      # exists.
      - name: Start SeaweedFS (the S3 speaker the conformance suite needs)
        run: |
          set -euo pipefail
          access="CI$(head -c 12 /dev/urandom | od -An -tx1 | tr -d ' \n' | tr 'a-f' 'A-F')"
          secret="$(head -c 30 /dev/urandom | od -An -tx1 | tr -d ' \n')"
          printf '{"identities":[{"name":"ci","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}\n' \
            "$access" "$secret" > "$RUNNER_TEMP/s3.json"
          docker run -d --name s3-conformance \
            -p 127.0.0.1:8333:8333 \
            -v "$RUNNER_TEMP/s3.json:/etc/seaweedfs/s3.json:ro" \
            chrislusf/seaweedfs:4.48 \
            server -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json \
            -s3.iam=false -dir=/data -master.volumeSizeLimitMB=64
          for _ in $(seq 1 30); do
            curl -s -o /dev/null http://127.0.0.1:8333/ && break
            sleep 1
          done
          curl -s -o /dev/null http://127.0.0.1:8333/ \
            || { docker logs s3-conformance; exit 1; }
          # Published to the job environment rather than passed to one command:
          # the suite's precondition is env-shaped, and an unset variable is a
          # skip (which the gate below refuses). Values written here are not
          # echoed by the step, live only for this job, and name credentials on
          # a container that is deleted by the teardown step.
          {
            echo 'COMMUNICATION_TEST_S3_ENDPOINT=http://127.0.0.1:8333'
            echo "COMMUNICATION_TEST_S3_ACCESS_KEY=$access"
            echo "COMMUNICATION_TEST_S3_SECRET_KEY=$secret"
            echo 'COMMUNICATION_TEST_S3_BUCKET=communication-artifacts-ci'
          } >> "$GITHUB_ENV"
      # -p 1: several packages migrate the same database, so package test
      # binaries must not run concurrently against it.
      #
      # -json and the gate under it: "no test is skipped" is only a rule if
      # something enforces it. Every lab-gated suite in this tree skips on a
      # missing precondition, and a skip in a green package exits 0 — so the
      # verdicts are read from the event stream, not from the summary prose.
      # With the services, the pinned binaries and the environment above all
      # present, no test in ./... should skip; if one does, CI names it and
      # fails instead of awarding a pass to an assertion that never ran
      # (AGENTS.md, 12-test-strategy).
      - name: go test -race
        env:
          # TestSecretStorePlaintextAbsentFromDatabaseDump dumps the whole
          # database with the operator's own client (m3-contract § 1) — pg_dump
          # is not on the runner, it is in the container that holds the
          # database, which here is this job's postgres service.
          COMMUNICATION_LAB_PG_CONTAINER: ${{ job.services.postgres.id }}
          # The two proofs that compare a real apm lock digest against the
          # pinned one (the CLI installed above must be the binary that runs).
          COMMUNICATION_APM_REAL: '1'
        run: |
          set -euo pipefail
          go test -race -p 1 -json ./... | tee go-test.json
      # Any {"Action":"skip"} carrying a Test field is a test that registered
      # and did not run: listed, annotated, and fatal. A skip event with no
      # Test field is Go's per-package verdict for a package with no test files
      # ("?  pkg [no test files]"), which describes the tree rather than an
      # unrun assertion, so it is not a failure. An empty report, or one with
      # no started test, fails too — nothing ran is not the same as everything
      # passed. Stdlib-only python3, the same system interpreter the m4-gate-logic
      # job already relies on; this step adds no dependency.
      - name: Fail the build on any skipped test
        run: python3 .github/scripts/check-go-test-skips.py go-test.json
      - name: stop SeaweedFS
        if: always()
        run: docker rm -f s3-conformance || true

  contract:
    name: contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.0
      - name: Enable corepack
        run: corepack enable
      # api/README.md documents pnpm --package=@redocly/cli@2.63.0 dlx redocly
      # lint locally (pnpm dlx alone fails: the package ships both `redocly`
      # and `openapi` binaries). In CI the npm exec equivalent below needs no
      # lockfile and no packageManager field; npm resolves the package's
      # `openapi` bin, which is the same CLI.
      # Warnings are reviewed, errors are not merged (see api/README.md).
      - name: Lint OpenAPI contract
        run: npx --yes @redocly/cli@2.63.0 lint api/openapi.yaml

  compose:
    name: compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # compose.yml lands with the M1 compose task; the guard keeps this job
      # green until then and strict (config -q) once it exists.
      - name: Validate compose configuration
        run: |
          if [ -f compose.yml ]; then
            docker compose -p communication config -q
          else
            echo "compose.yml not present yet — skipping"
          fi

  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: go-licenses
        run: go run github.com/google/go-licenses@v1.6.0 check ./... --disallowed_types=forbidden,restricted,unknown

  detect:
    name: detect
    runs-on: ubuntu-latest
    outputs:
      # Job-level expressions may not call hashFiles (GitHub restricts it to
      # step contexts), so it is evaluated in a step and republished as an
      # output.
      ui: ${{ steps.ui-package.outputs.ui }}
    steps:
      - uses: actions/checkout@v7
      - id: ui-package
        if: hashFiles('ui/package.json') != ''
        run: echo "ui=true" >> "$GITHUB_OUTPUT"

  ui:
    name: ui
    runs-on: ubuntu-latest
    needs: [detect]
    # Skipped until ui/package.json lands (ADR-0005, ADR-0007).
    if: needs.detect.outputs.ui == 'true'
    steps:
      # fetch-depth: 0 because the test-id guard below diffs a previous
      # revision against the worktree; the default shallow checkout carries no
      # history to compare against.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.0
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      # The workspace install (ui/pnpm-workspace.yaml) also installs
      # ui/tools/apigen — openapi-typescript 7.13 needs the TypeScript 5 JS API
      # while the app builds on TypeScript 7, so `gen:api` resolves the
      # generator from that package's tree and fails without it.
      - name: install
        run: pnpm --dir ui install --frozen-lockfile
      # ui's check script: gen:api:check (fails if src/api/schema.d.ts drifts
      # from api/openapi.yaml) && lint && fmt:check && typecheck &&
      # check:testids && test && build.
      - name: check
        run: pnpm --dir ui check
      # The honesty rule ("never fake data the API doesn't serve") statically:
      # every string the design mock invented (e2e/emulator/mockdata.ts) must be
      # absent from ui/src, including in `placeholder=` attributes, which never
      # reach innerText so the browser-side emulator check cannot see them.
      # Plain Node from the repo root — no lab, no Playwright, no install step
      # (Node >= 23 strips mockdata.ts's types on import).
      - name: mock data scan (ui/src vs the design mock)
        run: node e2e/emulator/mockdata-scan.mjs
      # check:testids inside `check` compares the worktree with HEAD, which in
      # CI is the same tree — a no-op. The comparison that catches a restyle
      # dropping a test id is against the revision the PR is merging into (or,
      # on push to main, the previous commit), so run that one explicitly.
      - name: test ids vs base revision
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ -n "${BASE_REF:-}" ]; then
            git fetch --no-tags --no-recurse-submodules origin \
              "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
            rev="$(git merge-base HEAD "origin/${BASE_REF}")"
          else
            rev="$(git rev-parse HEAD^1)"
          fi
          echo "comparing ui test ids against ${rev}"
          pnpm --dir ui exec node scripts/check-testids.mjs "$rev"

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    # M1 journey (ADR-0006, 12-test-strategy E2E) against the real compose
    # stack on the isolated 2808x ports (e2e/compose.e2e.yml, project
    # communication-e2e) so nothing can clash with another runner's ports.
    # The worker/agent harness is deliberately excluded: CI carries no agent
    # credentials, and M1 needs no worker.
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: e2e/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.0
          cache: pnpm
          cache-dependency-path: e2e/pnpm-lock.yaml
      - name: install
        run: pnpm --dir e2e install --frozen-lockfile
      # The suite is chromium-only (playwright.config.ts); --with-deps pulls
      # the system libraries the headless shell needs.
      - name: install browsers
        run: pnpm --dir e2e exec playwright install --with-deps chromium
      - name: start stack
        run: docker compose -p communication-e2e -f compose.yml -f e2e/compose.e2e.yml up -d --build
      # Fails closed (navigation/health errors) when the stack is unreachable;
      # never skips (ADR-0006 Verification).
      - name: run e2e suite
        run: pnpm --dir e2e test
      # The first failed run of this job left only "api-b exited (2)" as
      # evidence — compose up -d does not print container logs, and a config
      # refusal dies in half a second with its whole message inside the
      # container. Dump status and logs on any failure of the job (including
      # "start stack", which skips the later steps but leaves the job red),
      # so the next failure is diagnosable from the run log alone. Logs are
      # not secret material here: this stack has no credentials, and session
      # cookies live in the browser, not in serve's access log fields.
      - name: dump compose logs on failure
        if: failure()
        run: |
          docker compose -p communication-e2e -f compose.yml -f e2e/compose.e2e.yml ps -a
          docker compose -p communication-e2e -f compose.yml -f e2e/compose.e2e.yml logs
      # HTML report plus per-test traces/screenshots (retained on failure by
      # playwright.config.ts). Short retention: traces can capture session
      # cookies (ADR-0006 Security/privacy).
      - name: upload report and failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-e2e-${{ github.run_attempt }}
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7
      - name: teardown
        if: always()
        run: docker compose -p communication-e2e -f compose.yml -f e2e/compose.e2e.yml down -v

  m4-gate-logic:
    name: m4-gate-logic
    runs-on: ubuntu-latest
    # Every e2e/m4/test_*.py checks the *verdict logic* of the M4 exit gates
    # (docs/m4-contract.md § 7) offline: given recorded Postgres/API evidence,
    # does the gate decide pass/fail the way § 7 specifies? They are stdlib
    # unittest only — no stack, no agent, no network — so they run in seconds
    # and catch a gate that would report the wrong verdict.
    # They NEVER substitute for the live § 7 run: a green job here proves no
    # more than the reducer is self-consistent, and § 7's gates still have to be
    # observed against the real stack before M4 is called done
    # (12-test-strategy.md: a mocked green test is never evidence).
    # No actions/setup-python: nothing in this repository pins one, and the
    # runner's system python3 is enough for stdlib unittest, so this job adds no
    # new dependency. The YAML-aware tests parse through e2e/m4/yamlmini.py
    # (stdlib subset) precisely because that python3 has no PyYAML, so nothing
    # silently skips: a skipped test proves nothing, and a file whose unittest
    # summary reports "skipped=" fails this job.
    steps:
      - uses: actions/checkout@v7
      # Syntax-check the driver first (the tests import it), then run every
      # pure-logic test; a non-zero exit or any reported skip fails the job.
      - name: gate logic tests
        run: |
          set -euo pipefail
          python3 -m py_compile e2e/m4/e2e_m4_exit.py
          for t in e2e/m4/test_*.py; do
            out=$(python3 "$t" 2>&1) || { echo "$out"; exit 1; }
            echo "$out"
            if printf '%s\n' "$out" | grep -q 'skipped='; then
              echo "::error::$t reported skips — every logic test must run"
              exit 1
            fi
          done

  image-main:
    name: image (main)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [go, audit]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # .goreleaser.yaml before.hooks run pnpm to build the embedded ui/dist
      # (ADR-0007), so this job needs the same pinned Node/pnpm setup as the
      # ui job before GoReleaser runs.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.0
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      # The image is built for linux/amd64 and linux/arm64 in one snapshot run,
      # so the arm64 layers need qemu user emulation.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Snapshot build: GoReleaser compiles both architectures and builds (but
      # never pushes) the per-platform images, tagged
      # ghcr.io/dbirks/communication:main-linux-{amd64,arm64}.
      - name: Build snapshot image
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.18.3
          args: release --snapshot --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Push the arch images, then compose the multi-arch manifests ADR-0004
      # promises for the main branch: :main and :sha-<short sha>.
      - name: Publish main and sha tags
        run: |
          set -euo pipefail
          repo=ghcr.io/dbirks/communication
          short="$(git rev-parse --short=7 HEAD)"
          docker push "${repo}:main-linux-amd64"
          docker push "${repo}:main-linux-arm64"
          docker buildx imagetools create \
            -t "${repo}:main" \
            "${repo}:main-linux-amd64" "${repo}:main-linux-arm64"
          docker buildx imagetools create \
            -t "${repo}:sha-${short}" \
            "${repo}:main-linux-amd64" "${repo}:main-linux-arm64"

  # ADR-0028: the execution worker ships its own image, built from
  # worker/Dockerfile (ADR-0007). The serve image above is not enough to run a
  # worker — this image also carries the Node runtime, the pinned ACP adapters
  # and the nono/apm binaries a unit needs before it can launch anything — so a
  # deployment (compose, the home cluster) needs both published.
  # amd64 ONLY, deliberately: worker/Dockerfile's executionbin stage downloads
  # x86_64 tarballs by name (nono-vX-x86_64-unknown-linux-gnu.tar.gz and
  # apm-linux-x86_64.tar.gz, both sha256-pinned to the exact builds the
  # docs/compatibility matrices were observed against). An arm64 layer would
  # need per-arch pins plus an arm64 probe run first, and AGENTS.md forbids
  # claiming a sandbox/adapter capability without a real test showing it — so
  # this job builds the one architecture that has evidence rather than a
  # manifest that would pretend otherwise. AGENTS.md also rules out a new
  # third-party action here: build+push is plain buildx shell, no
  # docker/metadata-action, and the sha tag is git's own short rev.
  worker-image:
    name: worker image (main)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [go, audit]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The GHA layer cache keeps the ~1.1 GB of unchanged lower layers (base
      # node image, adapter npm installs, nono/apm downloads) from being rebuilt
      # on every push to main. mode=max exports intermediate stages too, which
      # is what lets a Go-only change reuse the executionbin/nodebase layers.
      - name: Build and push worker image
        run: |
          set -euo pipefail
          repo=ghcr.io/dbirks/communication-worker
          short="$(git rev-parse --short=7 HEAD)"
          docker buildx build \
            --platform linux/amd64 \
            -f worker/Dockerfile \
            --cache-from=type=gha \
            --cache-to=type=gha,mode=max \
            --push \
            -t "${repo}:main" \
            -t "${repo}:sha-${short}" \
            .
