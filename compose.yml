# M1 dev/test stack for Communication — NOT a production deployment.
#
# Brings up the whole milestone M1 topology with one command:
#
#     docker compose -p communication up --build
#
# Topology (11-build-roadmap.md M1 exit, ADR-0012, ADR-0013):
#   lb       caddy, round-robin over the two API replicas  -> http://localhost:18080
#   api-a/b  two stateless `communication serve` replicas  -> 127.0.0.1:18081 / :18082
#   migrate  one-shot `communication migrate up`           -> completes before the APIs start
#   oidc     mock-oauth2-server (dev IdP, no committed credentials) -> 127.0.0.1:18090
#   postgres authoritative store (ADR-0013), named volume
#   worker   one `communication worker`: registers, heartbeats, drains on
#            SIGTERM; claims no work yet (M2) and publishes no ports
#
# M3 adds the surfaces the workspace/secret/artifact milestone needs (ADR-0017
# volume identity, ADR-0018 envelope encryption, ADR-0020 artifacts):
#   keyring-init  one-shot that generates the dev master key ONCE into a named
#                 volume (`masterkeys`), mounted read-only by serve+worker
#   repos         project mirror root, beside `workspaces` on the worker
#   artifacts     artifact bytes: rw on the worker, READ-ONLY on both APIs
#   seaweedfs     optional S3-compatible conformance backend (profile `s3`)
#   masterkeys    the envelope-encryption keyring, outside the database
# No secret material is committed anywhere: the keyring is generated at first
# start, published by no port, and named by no value any log line can print.
#
# Port choice: 18080-18090 are used instead of the documented 8080/8090 because
# this lab host already runs a model gateway on 8080/8081/8090; every published
# port is bound to 127.0.0.1 so nothing is exposed on the machine's network.
name: communication

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: communication
      POSTGRES_DB: communication
      # Dev-only: trust removes the need for a committed password (AGENTS.md
      # forbids credentials in the repo). It is safe only because this service
      # publishes NO ports — it is reachable from the compose network alone,
      # never from the host (the host already runs a lab Postgres on 55432 and
      # an unauthenticated trust database must not join the routable network).
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      # Postgres 18 images move the data directory under the cluster root
      # (/var/lib/postgresql/18/docker), so the mount has to be the parent or
      # the entrypoint refuses to start with "unused mount/volume".
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U communication"]
      interval: 5s
      timeout: 3s
      retries: 20

  oidc:
    image: ghcr.io/navikt/mock-oauth2-server:6.0.7
    environment:
      JSON_CONFIG_PATH: /config/oidc-dev.json
    volumes:
      - ./api/oidc-dev.json:/config/oidc-dev.json:ro
    ports:
      - "127.0.0.1:18090:8080"

  # One-shot keyring init (ADR-0018 D2.2): the master key that unwraps a data
  # key must not live in the database, in an environment variable, or in the
  # repo — a pg_dump has to be inert and a `docker inspect` has to be inert too.
  # So it is a file in a named volume, generated on first start and reused
  # after, and every consumer mounts the volume read-only.
  #
  # Deliberately reuses an image the stack already pulls (postgres:18.6 has a
  # shell) rather than adding a busybox/alpine dependency for six lines of sh.
  # It never prints the key: `od` writes it straight to the file, so the
  # container log cannot become the leak that the whole design avoids.
  keyring-init:
    image: postgres:18.6
    entrypoint: ["sh", "-ec"]
    command:
      - |
        umask 077
        f=/keyring/master-key-v1
        if [ ! -s "$$f" ]; then
          head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n' > "$$f.tmp"
          mv "$$f.tmp" "$$f"
          echo "keyring: generated master-key-v1"
        else
          echo "keyring: master-key-v1 already present"
        fi
    volumes:
      - masterkeys:/keyring
    restart: "no"

  # One-shot migrator: the API replicas never run migrations themselves
  # (ADR-0013), they only refuse readiness until the schema is current.
  migrate:
    image: communication:dev
    build:
      context: .
      dockerfile: api/Dockerfile
    command: ["migrate", "up"]
    environment:
      COMMUNICATION_DATABASE_URL: postgres://communication@postgres:5432/communication?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
      keyring-init:
        condition: service_completed_successfully
    restart: "no"

  api-a:
    image: communication:dev
    # The image is produced by the `migrate` build above; never pull it.
    pull_policy: never
    command: ["serve"]
    environment:
      COMMUNICATION_DATABASE_URL: postgres://communication@postgres:5432/communication?sslmode=disable
      COMMUNICATION_LISTEN_ADDR: ":8080"
      COMMUNICATION_PUBLIC_URL: http://localhost:18080
      COMMUNICATION_REPLICA_NAME: api-a
      COMMUNICATION_OIDC_ISSUER: http://oidc:8080/default
      COMMUNICATION_OIDC_BROWSER_ISSUER: http://localhost:18090/default
      COMMUNICATION_OIDC_CLIENT_ID: communication-dev
      COMMUNICATION_COOKIE_SECURE: "false"
      COMMUNICATION_BOOTSTRAP_ADMIN_SUBJECTS: admin
      # M3: the artifact backend reads bytes it never wrote (the worker writes
      # them), so the mount is read-only here, and the keyring is a file path,
      # never a key in an env var (ADR-0018 D2.2).
      COMMUNICATION_ARTIFACT_ROOT: /artifacts
      COMMUNICATION_ARTIFACT_BACKEND: local
      COMMUNICATION_SECRET_KEYRING: /keyring
      # Only read when COMMUNICATION_ARTIFACT_BACKEND=s3, which the optional
      # `s3` profile exists to make reachable (ADR-0020 D7). Default stays
      # `local`: the S3 backend is a contract in M3, not an implementation.
      COMMUNICATION_ARTIFACT_S3_ENDPOINT: http://seaweedfs:8333
      COMMUNICATION_ARTIFACT_S3_BUCKET: communication-artifacts
    volumes:
      - artifacts:/artifacts:ro
      - masterkeys:/keyring:ro
    ports:
      - "127.0.0.1:18081:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      oidc:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/v1/system/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  api-b:
    image: communication:dev
    pull_policy: never
    command: ["serve"]
    environment:
      COMMUNICATION_DATABASE_URL: postgres://communication@postgres:5432/communication?sslmode=disable
      COMMUNICATION_LISTEN_ADDR: ":8080"
      COMMUNICATION_PUBLIC_URL: http://localhost:18080
      COMMUNICATION_REPLICA_NAME: api-b
      COMMUNICATION_OIDC_ISSUER: http://oidc:8080/default
      COMMUNICATION_OIDC_BROWSER_ISSUER: http://localhost:18090/default
      COMMUNICATION_OIDC_CLIENT_ID: communication-dev
      COMMUNICATION_COOKIE_SECURE: "false"
      COMMUNICATION_BOOTSTRAP_ADMIN_SUBJECTS: admin
      COMMUNICATION_ARTIFACT_ROOT: /artifacts
      COMMUNICATION_ARTIFACT_BACKEND: local
      COMMUNICATION_SECRET_KEYRING: /keyring
      COMMUNICATION_ARTIFACT_S3_ENDPOINT: http://seaweedfs:8333
      COMMUNICATION_ARTIFACT_S3_BUCKET: communication-artifacts
    volumes:
      - artifacts:/artifacts:ro
      - masterkeys:/keyring:ro
    ports:
      - "127.0.0.1:18082:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      oidc:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/v1/system/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  lb:
    image: caddy:2.11.7-alpine
    volumes:
      - ./api/Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "127.0.0.1:18080:80"
    depends_on:
      api-a:
        condition: service_healthy
      api-b:
        condition: service_healthy

  # Execution worker: registers, heartbeats and drains (02-system-architecture.md,
  # D-002). Separate process from the API on purpose — independent rollout and
  # lifetime — and it needs no inbound port, only the database. From M2 it
  # claims turns and drives real agent processes, so it uses its own image
  # (worker/Dockerfile, ADR-0007): the only service carrying Node and the
  # pinned agent adapters.
  worker:
    image: communication-worker:dev
    build:
      context: .
      dockerfile: worker/Dockerfile
    command: ["worker"]
    environment:
      COMMUNICATION_DATABASE_URL: postgres://communication@postgres:5432/communication?sslmode=disable
      COMMUNICATION_WORKER_NAME: worker-1
      COMMUNICATION_WORKER_HEARTBEAT: "10s"
      COMMUNICATION_WORKSPACE_ROOT: /workspaces
      # ADR-0017 D1: mirrors live *beside* workspaces, not inside them, and
      # ADR-0017 D2's volume identity is now measured per root — two roots, two
      # identities, because probe V5b showed /workspaces and /repos can share a
      # device number and differ in everything else.
      COMMUNICATION_REPOS_ROOT: /repos
      COMMUNICATION_ARTIFACT_ROOT: /artifacts
      COMMUNICATION_ARTIFACT_BACKEND: local
      COMMUNICATION_ARTIFACT_S3_ENDPOINT: http://seaweedfs:8333
      COMMUNICATION_ARTIFACT_S3_BUCKET: communication-artifacts
      COMMUNICATION_SECRET_KEYRING: /keyring
      # ADR-0019's configured mode. `required` refuses to launch anything it
      # cannot verify; the only honest values here are required/permissive-dev/
      # disabled, and a `required` worker that cannot prove Landlock fails
      # visibly rather than falling back (ADR-0019 D6).
      COMMUNICATION_SANDBOX_ENFORCEMENT: required
      # nono's own HOME, and the directory its profile files are written to.
      # Both are *siblings* of the two storage roots rather than children of
      # either, and that is a correctness requirement rather than tidiness: nono
      # derives its protected state root from HOME and thereafter permanently
      # refuses every grant that overlaps it (probe C-H1), so a launcher home
      # under /workspaces would poison every workspace this worker ever creates.
      COMMUNICATION_SANDBOX_HOME: /sandbox-home
      COMMUNICATION_SANDBOX_POLICY_DIR: /sandbox-policy
      COMMUNICATION_SANDBOX_SELFTEST_DIR: /sandbox-selftest
      # The commit identity a sandboxed agent gets. It is required in `required`
      # mode: GIT_CONFIG_NOSYSTEM is set and the agent's HOME is its own tree, so
      # there is no global config to inherit and an unset identity makes the
      # agent's own `git commit` fail mid-turn with "Please tell me who you are".
      COMMUNICATION_AGENT_GIT_NAME: Communication Worker
      COMMUNICATION_AGENT_GIT_EMAIL: worker@communication.invalid
    volumes:
      # The artifact volume is rw here and ro on both API replicas: one writer,
      # many readers, so a replica cannot half-write what another serves
      # (ADR-0020 D2).
      - workspaces:/workspaces
      - repos:/repos
      - artifacts:/artifacts
      # Not named volumes: these two hold nothing that must survive a worker
      # restart. The launcher home holds nono's state and the policy dir holds
      # files this binary rewrites from code at startup, so an anonymous volume
      # would only risk *keeping* a policy a newer binary no longer matches.
      - sandbox-home:/sandbox-home
      - sandbox-policy:/sandbox-policy
      - sandbox-selftest:/sandbox-selftest
      - masterkeys:/keyring:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    # Heartbeat is 10s and the worker's own drain deadline is 15s, so give it
    # room to write `offline` before docker sends SIGKILL. Under M2 that room
    # also covers writing an honest interrupted state for the in-flight turn.
    stop_grace_period: 25s

  # Optional S3-compatible object backend for the artifact store (profile `s3`).
  # This exists to run ADR-0020 D7's conformance contract against a real S3
  # speaker without spending money or adding a service to the default stack:
  # `docker compose --profile s3 up` brings it, plain `up` does not see it.
  #
  # Pinned to an exact tag (SeaweedFS is Apache-2.0; the S3 gateway runs in one
  # process, no bucket provisioning step). The filer is enabled because the S3
  # API needs it as the namespace backend.
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    profiles: [s3]
    command:
      - server
      - -s3
      - -s3.port=8333
      - -dir=/data
      - -master.volumeSizeLimitMB=64
    volumes:
      - seaweedfs:/data
    # No published ports: like postgres, this is reachable from the compose
    # network only. Nothing on this lab host needs to talk S3 from outside.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: "no"

volumes:
  pgdata:
  workspaces:
  # Project mirrors (ADR-0017 D1). Separate from `workspaces` because a mirror
  # outlives every worktree derived from it and the two are swept differently.
  repos:
  # nono's own HOME and materialized policy (ADR-0019 D1). Declared volumes
  # rather than bind mounts so the stack needs no host-path assumptions.
  sandbox-home:
  sandbox-policy:
  # The startup enforcement self-test's scratch (ADR-0019 D6). Its two
  # directories exist for the duration of one nono exec and are removed by the test
  # itself; the volume's only job is to keep them off the two storage roots, because
  # a grant that overlaps nono's state root is refused permanently (probe C-H1).
  sandbox-selftest:
  # Artifact bytes (ADR-0020 D2): never in a database row.
  artifacts:
  # Envelope-encryption master key, generated by keyring-init (ADR-0018 D2.2).
  # Deleting this volume makes every stored secret version undecryptable — that
  # is the point, not an accident to discover later.
  masterkeys:
  # SeaweedFS data (only used under the `s3` profile).
  seaweedfs:
