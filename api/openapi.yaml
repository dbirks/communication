openapi: 3.1.0
info:
  title: Communication API
  version: 0.4.0-m4
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  description: |
    HTTP contract for the Communication control plane, milestones **M1** (log in,
    create a project, add two repositories, see consistent state across two API
    replicas), **M2** (start an agent conversation against a project, watch it
    live, take control, return it, restart the API without losing the transcript)
    and **M3** (run workspaces on per-project mirrors, secret references with
    envelope encryption, sandboxed agent launch, artifacts and a cookie-free
    HTML preview). Authority for behaviour is
    `communication-spec/09-api-events-data.md`, `docs/m3-contract.md` § 2, the M1
    design contract, ADR-0016 (conversations, control and turn leases) and
    ADR-0017..0020 (M3); this document is the shared freeze point that the Go
    handlers (`internal/api`), the execution worker (`internal/worker`,
    `internal/agent/acp`) and the React UI (`ui/`) are all written against.

    Conventions (09):

    * All resources live under `/api/v1`, except the browser login flow under `/auth`.
    * JSON bodies; identifiers are Postgres `uuid` values (`uuidv7()`) exposed as
      strings; timestamps are RFC 3339 in UTC.
    * Errors are `application/problem+json` (`{type, title, status, detail}`).
    * A project-scoped route returns **404**, not 403, to a caller who is not a
      member of that project, so that existence is not leaked to other tenants.
      A denied attempt writes an `audit_events` row with outcome `denied`.
    * Mutations (`POST`/`PUT`/`DELETE`) require the session cookie **and** the
      `X-CSRF-Token` header; a missing or wrong token is `403`. If an `Origin`
      header is present it must match `COMMUNICATION_PUBLIC_URL`'s origin or the
      request's own scheme+host.
    * Every state change writes authoritative state, one `domain_events` row and
      one `outbox` row in a single SQL transaction, so the SSE stream below is a
      faithful, replayable view of what any replica committed.

    M2 conventions, all pinned by ADR-0016:

    * A conversation is durable and project-scoped; the agent process is not.
      `GET /api/v1/conversations/{conversationId}` is the only place a browser
      learns who holds control and at which `version`.
    * Exactly one controller holds a conversation at a time (`01` invariant 2).
      Control mutates only by compare-and-swap against `conversation_control.version`:
      a stale `version` is `409` carrying the current state, never a silent overwrite.
    * Prompting, taking control, cancelling and answering a permission prompt are
      `contributor`-and-controller-only; watching is any project member.
    * The transcript is the same `domain_events` journal the project stream uses,
      read through `conversation_id`, so replay and gap-safety behave identically
      (ADR-0014 §9) and an API restart cannot lose transcript rows.
    * Turn leases, fencing tokens and worker ids are internal. They are persisted
      and asserted server-side, and deliberately never appear in a browser-facing
      response body.

    M3 conventions, all pinned by ADR-0017..0020 and `docs/m3-contract.md` § 2:

    * **No route returns a secret value.** Not "masked", not a "last-4" hint, not
      an admin override. `value` is write-only on `POST /secrets` and
      `POST /secrets/{secretId}/versions`, and a `PUT` whose body contains `value`
      is a `400` — rotation is a different verb. `secret_versions.ciphertext` has
      no read path from this layer at all (no store method exposes it to
      `internal/api`).
    * **No route returns an absolute host path.** `workspaces.root_path`,
      `workspace_repos.checkout_path`/`mirror_path`/`admin_dir` and
      `artifacts.storage_key` are worker-side topology; the browser learns ids,
      refs, digests and *roles* (`m3-contract` § 2's rule, with the
      `X-Communication-Replica` header as the precedent for what a browser may
      learn about infrastructure).
    * **Artifacts are immutable.** There is no `PUT /api/v1/artifacts/{id}`, and
      `GET .../content` streams `text/html` as `text/plain` with
      `Content-Disposition: attachment`. Executing artifact script is only ever
      the preview origin's job — and that origin is a different *hostname*
      (`http://preview.localhost:18084/preview/{token}`), not a path under
      `/api/v1`, because cookies are host-scoped (ADR-0020 D6). It is documented
      below as an external URL template, not as an operation of this API.
    * Workspace inspection reads database rows the worker wrote. There is no
      worker-service surface here: `09` forbids the browser API reaching into
      worker internals, so `GET /api/v1/workspaces/{workspaceId}/repos/{repositoryId}/status`
      answers from `workspace_repos`, never by shelling into a worker.
    * Sandbox state is *reported*, never implied: `verified: false` and
      `network_enforced: false` are answers this API is required to give
      (`05`'s labelled-run rule, ADR-0019 D3).

    M4 conventions, all pinned by ADR-0021..0024 and `docs/m4-contract.md` § 2/§ 3:

    * **Revisions are immutable.** There is no `PUT`/`PATCH` anywhere under
      `/api/v1/revisions`; a run pins `pipeline_revision_id` plus both digests
      (`revision_digest` over the canonical document, `plan_digest` over the
      compiled plan) at creation, so a mid-run library edit is unrepresentable
      (ADR-0002, `12` case 11). The only revision mutation is `deprecate`, and
      it touches no existing run.
    * **Definitions are org-scoped, runs are project-scoped.** Pipeline,
      draft, revision, attempt and approval routes resolve through their own
      organization or project membership: a resource outside the caller's
      tenant is `404`, never `403`, so existence is not leaked across tenants.
      A published revision digest that exists only in another organization is
      `404` here.
    * **CAS everywhere a race is possible.** Draft replace, validate-after-edit,
      publish, approval decision and assignment update all carry a `version`
      the caller last read; a stale version is `409` carrying the winner
      (`stale_draft_version`, `draft_changed_since_validation`,
      `approval_already_decided`), never a silent overwrite.
    * **`:action` spelling is path segments.** `09`'s `:pause`/`:cancel`/
      `:retry` cannot be registered on Go's `http.ServeMux` (ADR-0014 pins
      method patterns), so M4 ships `/runs/{id}/pause` style actions — the
      spelling M2 already shipped. Recorded as contract deviation D1, not a
      silent re-reading of `09`.
    * **Placement is a boolean, not an infra leak.** `GET /runs/{runId}`
      reports affinity as `placement: {scheduled, reason}`; `worker_id`,
      `fencing_token` and `lease_expires_at` never appear in any attempt or run
      body (ADR-0016 § 8, unchanged by M4).
    * **Validation is a public vocabulary.** `POST /drafts/{id}/validate`
      answers the § 2.2 body with ordered `loader` → `schema` → `compiler`
      errors, machine-readable locations and stable codes (adding a code is
      additive, renaming one is not). The served schema at
      `GET /api/v1/schemas/pipeline-v1alpha1` is the UI's only copy, so no
      editor can drift from the compiler (ADR-0021 § 7).

    This is the M4 slice of a larger surface (assistant and GitOps sync are
    later milestones) and is frozen after the first vertical slice (09).
servers:
  - url: http://localhost:8080
tags:
  - name: system
    description: Liveness, readiness and replica identity. Unauthenticated.
  - name: auth
    description: Browser OIDC login flow (Authorization Code + PKCE). Unauthenticated.
  - name: identity
    description: The signed-in caller and the organization's user directory.
  - name: projects
    description: Projects, the unit of membership and authorization.
  - name: repositories
    description: Git repositories attached to a project.
  - name: members
    description: Project memberships and roles.
  - name: profiles
    description: >-
      Agent profiles: what harness a conversation may launch. Read-only in M2;
      two are seeded (Claude Code, Codex) and profile editing/publishing is a
      later milestone.
  - name: conversations
    description: >-
      Shared agent conversations: transcript, the single-controller lock, turns
      and cancellation.
  - name: permissions
    description: >-
      ACP permission prompts surfaced to the current controller for a decision.
  - name: events
    description: Durable journal streamed to the browser over SSE.
  - name: workers
    description: Execution workers registered with the control plane.
  - name: secrets
    description: >
      Secret references (`SecretRef`): metadata and policy here, values
      nowhere. ADR-0018, `05` § "Secret handling".
  - name: workspaces
    description: >
      Run/conversation workspaces and their per-repository git topology, as
      recorded by the worker (ADR-0017). Read-only for a browser.
  - name: sandbox
    description: >
      What enforcement a launched unit actually ran under, and what the fleet
      can prove about its sandbox (ADR-0019).
  - name: artifacts
    description: >
      Typed artifacts with metadata, controlled bytes, and token-minted preview
      (ADR-0020). Artifact rows are immutable.
  - name: pipelines
    description: >
      Pipeline definitions, mutable drafts, immutable published revisions and
      the served pipeline schema (ADR-0021, `docs/m4-contract.md` § 2).
  - name: assignments
    description: >
      Project-to-pipeline assignments: the pinned revision plus the run
      ceilings a project executes under (ADR-0023 § 5).
  - name: schedules
    description: >
      "When to run": cron schedules owned by a project assignment, firing its
      pinned revision with fixed inputs (ADR-0032).
  - name: runs
    description: >
      Runs, node executions, attempts, run trees and checkpoints — the M4
      execution surface (ADR-0023). Control-plane state; workers own attempts
      through leases, never through this API.
  - name: approvals
    description: >
      Durable pipeline gates (`approval_requests`): decided through the API by
      designated approvers at decision time (ADR-0023 § 9, `12` case 9). Not
      the ACP permission prompts of M2.
paths:
  /api/v1/system/health:
    get:
      operationId: getHealth
      tags: [system]
      summary: Liveness and replica identity
      description: |
        Never touches the database, so it stays green while readiness is red.
        The response also carries the `X-Communication-Replica` header, which every
        response from `serve` sets; the UI's `/ops` page uses it to prove that two
        API replicas are serving the same state behind the round-robin load balancer.
      security: []
      responses:
        "200":
          description: Process is alive.
          headers:
            X-Communication-Replica:
              $ref: "#/components/headers/XCommunicationReplica"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              example:
                status: ok
                replica: replica-a
                version: 0.1.0-m1
  /api/v1/system/readiness:
    get:
      operationId: getReadiness
      tags: [system]
      summary: Database and schema readiness
      description: |
        `200` when the replica can reach Postgres and its migration version is at
        least the version the binary expects; `503` otherwise. A load balancer
        should stop sending traffic to a replica that returns `503`.
      security: []
      responses:
        "200":
          description: Ready to serve.
          headers:
            X-Communication-Replica:
              $ref: "#/components/headers/XCommunicationReplica"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
              example:
                status: ready
                schema_version: 1
                expected_schema_version: 1
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /auth/login:
    get:
      operationId: login
      tags: [auth]
      summary: Start OIDC login
      description: |
        Redirects the browser to the configured identity provider using
        Authorization Code + PKCE (`S256`) with `state` and `nonce`, requesting
        the `openid profile email` scopes.

        The login state (`state`, `code_verifier`, `nonce`, `return_to`) is stored
        in Postgres, not in the browser or in process memory, so a login started on
        replica A may complete on replica B.

        `return_to` must be a same-origin relative path (it must start with `/` and
        must not start with `//`); anything else is replaced with `/`.

        The redirect URI registered with the provider is
        `COMMUNICATION_PUBLIC_URL` + `/auth/callback`. When
        `COMMUNICATION_OIDC_BROWSER_ISSUER` is set, only the issuer prefix of the
        discovered `authorization_endpoint` is rewritten for this browser redirect.
      security: []
      parameters:
        - $ref: "#/components/parameters/ReturnTo"
      responses:
        "302":
          description: Redirect to the identity provider's authorization endpoint.
          headers:
            X-Communication-Replica:
              $ref: "#/components/headers/XCommunicationReplica"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /auth/callback:
    get:
      operationId: authCallback
      tags: [auth]
      summary: Complete OIDC login
      description: |
        Exchange `code` for tokens and establish a session:

        1. Look up `state` in `oidc_login_states`; it must be unused and at most
           10 minutes old, and is consumed in the same transaction (single use).
        2. Exchange the code (verifying `code_verifier`), then verify the ID token
           issuer, audience and `nonce`.
        3. Upsert the user by `(issuer, subject)`. Display name is the first of
           `name`, `preferred_username`, `subject`; `email` is optional. Subjects
           listed in `COMMUNICATION_BOOTSTRAP_ADMIN_SUBJECTS` become org admins.
        4. Create a session: random 32-byte token stored only as its SHA-256 in
           `sessions.token_hash`, plus a fresh `csrf_token`; set the
           `communication_session` cookie (HttpOnly, SameSite=Lax, Path=/,
           `Secure` per `COMMUNICATION_COOKIE_SECURE`, 12 h).
        5. `302` to the stored `return_to`.

        Any failure in steps 1–3 is `401` and creates no session; the UI sends the
        user back to `/login`.
      security: []
      parameters:
        - name: code
          in: query
          required: true
          description: Authorization code from the identity provider.
          schema:
            type: string
        - name: state
          in: query
          required: true
          description: Opaque anti-CSRF state generated by `/auth/login`.
          schema:
            type: string
      responses:
        "302":
          description: >
            Login complete; redirects to the original `return_to` path. Sets the
            `communication_session` cookie.
          headers:
            X-Communication-Replica:
              $ref: "#/components/headers/XCommunicationReplica"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: End the current session
      description: |
        Deletes the session row and clears the `communication_session` cookie.

        `POST /auth/logout` is a mutation: when a session cookie is present the
        server applies the same `X-CSRF-Token` (and `Origin`) check as `/api/v1`
        mutations, rejecting failures with `403`. With no session there is nothing
        to check, and the call is an idempotent `204`.
      security: []
      responses:
        "204":
          description: Session deleted and cookie cleared.
          headers:
            X-Communication-Replica:
              $ref: "#/components/headers/XCommunicationReplica"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/me:
    get:
      operationId: getMe
      tags: [identity]
      summary: Who am I
      description: |
        The signed-in user, their organization, and the CSRF token the UI must
        echo in `X-CSRF-Token` on every mutation. This is the UI's startup
        bootstrap and its 401 signal to redirect to `/login`.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Current principal.
          headers:
            X-Communication-Replica:
              $ref: "#/components/headers/XCommunicationReplica"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/users:
    get:
      operationId: listUsers
      tags: [identity]
      summary: List organization users
      description: >
        Users of the caller's organization, in `display_name` order. Used by the
        add-member picker. M1 has no pagination on this route; everyone in the
        organization is returned.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Organization users.
          headers:
            X-Communication-Replica:
              $ref: "#/components/headers/XCommunicationReplica"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserList"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List projects the caller can see
      description: |
        Projects in the caller's organization where the caller holds a membership;
        organization admins see every project in the organization. The permission
        predicate is evaluated server-side, never from a client-supplied header.
        Ordered by `created_at` descending. M1 has no pagination.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Visible projects.
          headers:
            X-Communication-Replica:
              $ref: "#/components/headers/XCommunicationReplica"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a project
      description: |
        Creates the project, makes the creator a `maintainer`, and appends the
        `project.created` event — all in one transaction. `slug` is derived from
        `name` when absent: lowercased, non-`[a-z0-9-]` runs collapsed to `-`,
        trimmed of leading/trailing `-`.
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectCreate"
      responses:
        "201":
          description: Project created.
          headers:
            X-Communication-Replica:
              $ref: "#/components/headers/XCommunicationReplica"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /api/v1/projects/{projectId}:
    get:
      operationId: getProject
      tags: [projects]
      summary: Read one project
      description: |
        Returns the project with the caller's role in it. A caller who is not a
        member (and not an organization admin) gets `404`, not `403`, so project
        existence is not leaked across tenants.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: The project.
          headers:
            X-Communication-Replica:
              $ref: "#/components/headers/XCommunicationReplica"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/projects/{projectId}/repos:
    get:
      operationId: listRepositories
      tags: [repositories]
      summary: List a project's repositories
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Repositories ordered by `name`.
          headers:
            X-Communication-Replica:
              $ref: "#/components/headers/XCommunicationReplica"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepositoryList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: addRepository
      tags: [repositories]
      summary: Add a repository to a project
      description: |
        Maintainer only; contributors and viewers get `403`. Appends the
        `repository.added` event in the same transaction as the insert.
        Duplicate `name` within the project is `409`.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepositoryCreate"
      responses:
        "201":
          description: Repository added.
          headers:
            X-Communication-Replica:
              $ref: "#/components/headers/XCommunicationReplica"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Repository"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /api/v1/projects/{projectId}/repos/{repositoryId}/issues:
    get:
      operationId: listRepositoryIssues
      tags: [repositories]
      summary: List GitHub issues for one repository (read-only, anonymous upstream)
      description: >
        Answers "what is in the tracker right now" so a run can be started
        from an issue (ADR-0031, wishlist W3's read half). The adapter calls
        `GET https://api.github.com/repos/{owner}/{repo}/issues` with no
        token, so only public repositories answer; `git_url` is parsed into
        `owner/repo` and pull requests are filtered out. Nothing is stored —
        GitHub owns the issue data (`07`), and this route is not a trigger:
        webhooks/invocations and the `integration.query` node kind need the
        M6 tables and dedupe. `viewer` or above; bodies are truncated to
        4000 bytes with `body_truncated` saying so. A non-GitHub remote is
        `422 not_a_github_repository`; upstream failures are `502` with a
        `github_repository_not_found`, `github_rate_limited` or
        `github_upstream_error` code.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/RepositoryId"
        - name: state
          in: query
          required: false
          description: GitHub issue state filter; defaults to `open`.
          schema:
            type: string
            enum: [open, closed, all]
            default: open
        - name: label
          in: query
          required: false
          description: GitHub label name to filter by (exact match, upstream semantics).
          schema:
            type: string
            maxLength: 100
      responses:
        "200":
          description: Issues as GitHub answered moments ago; never cached (`no-store`).
          headers:
            X-Communication-Replica:
              $ref: "#/components/headers/XCommunicationReplica"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitHubIssueList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: >
            `state` is not one of open/closed/all, or the repository's
            `git_url` is not a GitHub remote (`code: not_a_github_repository`).
          headers:
            X-Communication-Replica:
              $ref: "#/components/headers/XCommunicationReplica"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "502":
          description: >
            GitHub refused or failed the anonymous read: an upstream `404`
            (private or missing repository) becomes
            `github_repository_not_found`, a spent anonymous budget becomes
            `github_rate_limited`, anything else (including the 10 s
            timeout) becomes `github_upstream_error`.
          headers:
            X-Communication-Replica:
              $ref: "#/components/headers/XCommunicationReplica"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/projects/{projectId}/members:
    get:
      operationId: listMembers
      tags: [members]
      summary: List a project's members
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Members ordered by `display_name`.
          headers:
            X-Communication-Replica:
              $ref: "#/components/headers/XCommunicationReplica"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/projects/{projectId}/members/{userId}:
    put:
      operationId: putMember
      tags: [members]
      summary: Add or change a member's role
      description: |
        Maintainer only; upserts the `(projectId, userId)` membership with the
        given role and appends the `project.member.updated` event. The target user
        must belong to the same organization, otherwise `404`. In M1 a membership
        is never removed — the only roles settable here are the three below.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberPut"
      responses:
        "200":
          description: The resulting membership.
          headers:
            X-Communication-Replica:
              $ref: "#/components/headers/XCommunicationReplica"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /api/v1/projects/{projectId}/events:
    get:
      operationId: streamProjectEvents
      tags: [events]
      summary: Stream a project's durable events (SSE)
      description: |
        `text/event-stream` of the project's rows from the `domain_events` journal.
        One frame per event:

        ```text
        id: <global_seq>
        event: <type>
        data: <event envelope JSON, one line>
        \n
        ```

        * `id:` is the durable `global_seq`, so the browser's automatic reconnect
          sends it back as the `Last-Event-ID` header.
        * `event:` is the envelope `type` (`project.created`,
          `project.member.updated`, `repository.added` in M1).

        M3 adds the workspace, sandbox, secret and artifact vocabulary below
        (`docs/m3-contract.md` § 3, ADR-0017..0020). These are project-scoped and
        arrive here; the turn-scoped ones among them also appear on
        `GET /api/v1/conversations/{conversationId}/events`, and until the envelope
        schema gains an optional `workspace_id` member (a schema-versioned change),
        `workspace_id` lives **inside** `payload` while the journal's id columns
        stay as ADR-0016 left them:

        | `type` | `payload` members |
        |---|---|
        | `workspace.prepared` | `workspace_id`, `project_id`, `scope_kind`, `conversation_id`, `run_id`, `worker_id`, `volume_id`, `workspace_mode`, `repos`, `base_commits`, `policy_digest` |
        | `workspace.committed` | `workspace_id`, `project_id`, `repository_id`, `run_ref`, `head_commit` |
        | `workspace.quarantined` | `workspace_id`, `project_id`, `reason` |
        | `workspace.released` | `workspace_id`, `project_id`, `repos_pruned` |
        | `workspace.recovery_lost` | `workspace_id`, `project_id`, `expected_volume_id`, `found_volume_id`, `reason` |
        | `sandbox.verified` | `project_id`, `turn_id`, `workspace_id`, `worker_id`, `policy_digest`, `backend`, `backend_version`, `af_unix_mediation`, `network_enforced`, `grants`, `commit_granted`, `verified` |
        | `sandbox.enforcement_failed` | `project_id`, `turn_id`, `workspace_id`, `worker_id`, `stage`, `reason`, `backend`, `backend_version`, `policy_digest`, `verified`, `child_started`, `detail` |
        | `secret.created` | `secret_id`, `project_id`, `slug`, `scope`, `purpose`, `delivery_mode`, `version`, `allowed_agent_profile_ids` |
        | `secret.version.added` | `secret_id`, `project_id`, `version`, `key_id`, `previous_version` |
        | `secret.policy.updated` | `secret_id`, `project_id`, `before`, `after` |
        | `secret.revoked` | `secret_id`, `project_id`, `versions`, `revoked_at`, `revoked_by` |
        | `secret.materialized` | `secret_id`, `project_id`, `slug`, `version`, `delivery_mode`, `repository_name`, `relative_path`, `env_name`, `lifecycle`, `mode`, `workspace_id`, `turn_id`, `policy_digest` |
        | `secret.removed` | `secret_id`, `project_id`, `target`, `workspace_id`, `turn_id`, `cleaned_by` |
        | `secret.materialization_failed` | `secret_id`, `project_id`, `slug`, `delivery_mode`, `target`, `reason`, `workspace_id`, `turn_id`, `child_started` |
        | `artifact.created` | `artifact_id`, `project_id`, `name`, `kind`, `media_type`, `sha256`, `size_bytes`, `sensitivity`, `redaction_count`, `workspace_id`, `turn_id` |
        | `artifact.deleted` | `artifact_id`, `project_id`, `reason` |
        | `repository.mirror_updated` | `project_id`, `repository_id`, `worker_id`, `mirror_kind`, `from_commit`, `to_commit`, `fetch_duration_ms` |

        No payload below carries a secret value, a `.env` body, an absolute host
        path or a prompt — structurally, not by convention: the member sets above
        are pinned against the Go structs in `internal/events/events.go` by
        `TestM3PayloadFieldNames`, and
        `TestM3PayloadsCarryNoSecretValuesOrHostPaths` refuses a member named
        `value`, `ciphertext`, `env_body`, `prompt`, `root_path`, `mirror_path`,
        `admin_dir`, `checkout_path`, `storage_key` or any other `*_path` but
        `relative_path`. `secret.version.added` therefore has **no**
        `content_sha256`: that digest exists to recognise a retried write, and the
        journal is readable by every project member, so publishing it would hand
        them an offline guessing oracle for a low-entropy secret (contract
        deviation D15).

        Enumerated values, spelled exactly: `workspace.quarantined`'s `reason` is
        `secret_left_behind`, `exclusion_failed` or `worktree_unusable`;
        `workspace.recovery_lost`'s is `volume_changed`, `path_missing` or
        `different_worker`; `sandbox.enforcement_failed`'s `stage` is `probe`,
        `profile`, `policy_assert`, `grant_assert`, `exec` or `runtime` and its
        `reason` is ADR-0019 D6's enum (`binary_missing`, `landlock_unavailable`,
        `fs_unverified`, `tcp_unverified`, `af_unix_not_mediated`,
        `profile_invalid`, `grant_mismatch`, `temp_path_grant`, `cwd_not_granted`,
        `policy_delegation_refused`, `deny_unsupported`, `egress_check_failed`);
        `secret.materialization_failed`'s `reason` is `path_escape`,
        `absolute_path`, `bad_shape`, `tracked_target`, `exists`, `symlink_parent`,
        `keyring_unreadable`, `revoked_version`, `broker_unsupported` or
        `mirror_writable`; `secret.removed`'s `cleaned_by` is `worker`,
        `reconciler` or `startup_sweep`; `artifact.deleted`'s `reason` is `expired`,
        `swept` or `retention`; `repository.mirror_updated`'s `mirror_kind` is
        `created` or `fetched`.

        `repos` is an array of `{repository_id, name, run_ref}` objects (no paths),
        `base_commits` maps repository name to the commit the worktree was created
        at, `grants` is an array of `{role, access}` objects naming ADR-0017 D4's
        grant roles (`workspace_repo`, `workspace_scratch`, `workspace_home`,
        `mirror_read`, `mirror_objects`, `mirror_run_refs`, `mirror_run_logs`,
        `mirror_admin_dir`, `harness_credentials`; access is `ro` or `rw`), and
        `before`/`after` in `secret.policy.updated` are `{purpose, audit_policy,
        allowed_agent_profile_ids}` objects. `volume_id` is always
        `sha256:<64 hex>` — the identity of a storage root, derived from
        `(st_dev, st_ino, root path)` and never from `st_dev` alone (probe V3).
        * `data:` is the event envelope, validated by
          `api/schemas/event-envelope.schema.json` (see `EventEnvelope`).

        Behaviour: on connect the replica replays every event with `global_seq`
        greater than the resume cursor, then follows new ones. It subscribes with
        `LISTEN communication_events` (the journal's `AFTER INSERT` trigger emits
        `pg_notify` of `global_seq`) purely as a wake-up, and always re-queries by
        sequence — so a notification delivered by another replica, or none at all,
        cannot cause gaps or duplicates. Because `global_seq` is consumed at insert
        time while commits may land out of that order, a row can be held back until
        the transaction holding the next-lower sequence has settled: delivery is
        gap-free and duplicate-free, but never promised instantaneous (ADR-0014 §9).
        A `: heartbeat` comment line is written
        every 15 seconds to keep proxies from closing the stream. When both
        `Last-Event-ID` and `after` are supplied, the header wins (it is what the
        browser set automatically). The stream is scoped to this project and
        to the caller's permission — a non-member gets `404` and no events.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/LastEventId"
        - $ref: "#/components/parameters/After"
      responses:
        "200":
          description: >
            An open `text/event-stream`. Frames are event envelopes; the stream
            does not terminate on its own.
          headers:
            X-Communication-Replica:
              $ref: "#/components/headers/XCommunicationReplica"
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/EventEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /api/v1/workers:
    get:
      operationId: listWorkers
      tags: [workers]
      summary: List registered workers
      description: |
        Workers registered with the control plane, ordered by `name`. M1 workers are
        read-only here (the UI's `/ops` page); registration itself happens through
        the database, not this API.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Workers.
          headers:
            X-Communication-Replica:
              $ref: "#/components/headers/XCommunicationReplica"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerList"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/agent-profiles:
    get:
      operationId: listAgentProfiles
      tags: [profiles]
      summary: List the agent profiles this organization may launch
      description: >
        Agent profiles in `name` order (there is no `display_name` column —
        `name` is the display text, unique per organization). M2 seeds exactly two in
        the `default` organization — "Claude Code" (launcher `claude`) and
        "Codex" (launcher `codex`) — both with `permission_mode: ask`, because
        no launcher has a verified enforced sandbox yet
        (`04-agent-runtime.md`: auto-approving ACP prompts is not a substitute
        for sandbox isolation). A profile is a launch descriptor, not a
        capability claim: whether a launcher actually works here is answered by
        `docs/compatibility/ACP.md` and `communication doctor --acp`, never by
        this route returning a row. Profiles carry no `version`/`updated_at`
        optimistic token (ADR-0030): the only writable fields are the three APM
        columns, they are written as one triple, and a lost race between two
        writers is therefore unobservable in the row. Creating and patching a
        profile are `POST`/`PATCH` below; the listing stays available to every
        member of the organization.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: >
            The caller's organization's profiles, ordered by `name`.
          headers:
            X-Communication-Replica:
              $ref: "#/components/headers/XCommunicationReplica"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentProfileList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createAgentProfile
      tags: [profiles]
      summary: Create an agent profile
      description: >
        A launch descriptor: a name unique in the organization plus the launcher
        it drives. `permission_mode` is **not** a field here — `ask` is the
        column default and the only mode an unverified launcher may have, because
        auto-approving ACP permission prompts is not a substitute for sandbox
        isolation (`04-agent-runtime.md` "Permission policy", ADR-0009);
        `preapproved_within_sandbox` needs sandbox evidence for that launcher in
        `docs/compatibility/`, not a request body.

        A new profile stages **no** APM package: the triple is NULL until an
        operator records a digest with `PATCH` below, so a profile can never be
        created in the unverifiable state probe A5b describes.

        Organization library role — the same fail-closed predicate that governs
        publishing the shared pipeline library (ADR-0030). A member without it
        gets `403` (the organization's profiles are list-visible, so role is not
        existence information here); a duplicate name is `409`.
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentProfileCreate"
      responses:
        "201":
          description: The created profile, with no APM pin.
          headers:
            X-Communication-Replica:
              $ref: "#/components/headers/XCommunicationReplica"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/AgentProfileAPMProblem"
  /api/v1/agent-profiles/{profileId}:
    patch:
      operationId: patchAgentProfile
      tags: [profiles]
      summary: Set or clear a profile's APM package pin
      description: >
        The **only** writable fields are `apm_package_ref`, `apm_target` and
        `apm_lock_digest`, and they move as one triple: either all three carry a
        value or all three are absent/empty (clearing the pin). Any partial
        triple is `422` with code `apm_pin_incomplete`.

        Why the triple is atomic: `internal/agent/apm` stages a launch with
        `apm install --frozen --target <t>` and then refuses when
        `sha256(apm.lock.yaml)` differs from `apm_lock_digest`. Probe A5 showed
        `--frozen` proves the lockfile's *presence*, not its bytes — a mutated
        upstream still installed cleanly — and A5b showed the digest moves
        exactly when content moves. A ref recorded **without** a digest would
        therefore stage whatever the ref points at today, unverified; the worker
        refuses that state outright, so writing it through the API would turn an
        immediate, named refusal into a launch failure for somebody else's
        conversation. `docs/compatibility/APM.md` ("Git-tag sources") proves the
        pin holds: the lock records `resolved_commit`, and `--frozen` replays
        that commit offline, so a moved tag cannot change staged content under a
        recorded digest.

        **APM staging is not isolation** (`04-agent-runtime.md`): the staged
        trees are excluded from checkpoints because the worker wrote them before
        the grant set existed, not because a package was audited. Recording a
        digest makes the content *identifiable*; it asserts nothing about what
        the content does.

        Library role (ADR-0030). A profile of another organization is `404`.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: "#/components/parameters/ProfileId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentProfileAPMPatch"
      responses:
        "200":
          description: The profile as it now stands.
          headers:
            X-Communication-Replica:
              $ref: "#/components/headers/XCommunicationReplica"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/AgentProfileAPMProblem"
  /api/v1/projects/{projectId}/conversations:
    get:
      operationId: listConversations
      tags: [conversations]
      summary: List a project's conversations
      description: >
        Newest first (`created_at` descending). Visibility is project
        membership: a caller who is not a member — and is not an organization
        admin — gets `404`, the same answer every other project-scoped route
        gives, and no list. M2 has no pagination; the list is capped at 100
        items ordered by `created_at DESC, id DESC`.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Conversations in this project.
          headers:
            X-Communication-Replica:
              $ref: "#/components/headers/XCommunicationReplica"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationSummaryList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createConversation
      tags: [conversations]
      summary: Start a conversation against a project
      description: >
        Creates the conversation, its controller row (caller becomes the
        controller, `version` 1) and — when `prompt` is present — its first
        queued turn, all in one transaction, and appends
        `conversation.created` (plus `conversation.message.user` when a prompt
        was supplied). Nothing is launched here: a worker claims the turn,
        starts the agent and attaches a session (ADR-0016).

        `agent_profile_id` must be a profile of the caller's organization
        (`422` otherwise). `contributor` or `maintainer` required; a `viewer`
        gets `403`. M2 does not honour `Idempotency-Key`, so a retried create
        makes a second conversation (ADR-0014 §Consequences).
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConversationCreate"
      responses:
        "201":
          description: Conversation created; the caller holds control.
          headers:
            X-Communication-Replica:
              $ref: "#/components/headers/XCommunicationReplica"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /api/v1/conversations/{conversationId}:
    get:
      operationId: getConversation
      tags: [conversations]
      summary: Read one conversation, its controller and its agent session
      description: >
        The conversation, its control row (`control.kind`, `control.user_id`,
        `control.version`) and — when an agent instance is attached — the ACP
        session binding with the capabilities the agent actually reported.
        `control.version` is the token the UI must send to `take-control` and
        `return-control`; it changes on every control mutation, so this is the
        read that makes a control race visible before the user loses it.

        `404` for a conversation the caller cannot see (not a member of its
        project and not an organization admin), never `403`.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      responses:
        "200":
          description: The conversation.
          headers:
            X-Communication-Replica:
              $ref: "#/components/headers/XCommunicationReplica"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/conversations/{conversationId}/messages:
    post:
      operationId: postConversationMessage
      tags: [conversations]
      summary: Prompt the agent (controller only)
      description: >
        Enqueues a turn carrying `prompt` and appends `conversation.message.user`
        in the same transaction. The turn is `queued`; a worker claims it, sends
        it over ACP and streams the answer back as `conversation.message.agent`
        events — this call does not wait for the agent, and the reply arrives on
        `GET /api/v1/conversations/{conversationId}/events`, not here.

        Controller only, and at most one unfinished turn per conversation
        (`01` invariant 2, `06` "Do not send competing prompts to a running
        turn"):

        * caller is not the current controller -> `409` whose problem detail
          carries the current `control`.
        * a turn is already `queued`, `leased` or `running` -> `409`
          whose problem detail carries that `active_turn`.

        `contributor` or `maintainer` role is still required (`403` for a
        `viewer`), and the CSRF/origin rules of every mutation apply.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConversationMessageCreate"
      responses:
        "202":
          description: >
            Turn queued. `Location` points at the conversation; the prompt text
            is durable from this response on.
          headers:
            X-Communication-Replica:
              $ref: "#/components/headers/XCommunicationReplica"
            Location:
              description: >
                `/api/v1/conversations/{conversationId}` of the conversation
                this turn belongs to.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationTurn"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ConversationConflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /api/v1/conversations/{conversationId}/events:
    get:
      operationId: streamConversationEvents
      tags: [events, conversations]
      summary: Stream one conversation's transcript and state (SSE)
      description: >
        `text/event-stream` of this conversation's rows from the
        `domain_events` journal — the transcript *is* the journal, scoped by
        `conversation_id`, so an API replica restarting (or the browser
        disconnecting) loses nothing that was committed. Framing, resume,
        gap-safety and the 15 s heartbeat are identical to
        `GET /api/v1/projects/{projectId}/events` (ADR-0014 §5, §9):
        `id: <global_seq>`, `event: <type>`, `data: <envelope JSON>`, replayed
        from `Last-Event-ID` or `?after=`.

        Rows are selected by `conversation_id`, and the resume cursor is
        resolved *through* that scope, so a cursor copied from another
        conversation replays nothing it should not. Every event also carries
        `project_id`, so the project stream remains a superset of this one.
        Authorization is the owning project's membership, checked at connect
        time and again before each delivery and heartbeat: a removed member
        stops receiving events (`06` edge case) and a non-member gets `404`.

        M2 event types on this stream, and the `payload` members of each (the
        envelope itself is `EventEnvelope`; payloads never carry secrets, and
        tool input/output are bounded previews the worker truncated, flagged by
        `truncated`):

        | `type` | `payload` members |
        |---|---|
        | `conversation.created` | `conversation_id`, `project_id`, `title`, `agent_profile_id`, `agent_profile_name`, `launcher_id`, `controller_user_id`, `control_version` |
        | `conversation.message.user` | `conversation_id`, `turn_id`, `submitted_by`, `text` |
        | `conversation.message.agent` | `conversation_id`, `turn_id`, `chunk_seq`, `text`, `truncated`, `final` |
        | `conversation.thought` | `conversation_id`, `turn_id`, `chunk_seq`, `text`, `truncated` |
        | `conversation.tool.call` | `conversation_id`, `turn_id`, `tool_call_id`, `title`, `kind`, `status`, `input_preview`, `truncated` |
        | `conversation.tool.update` | `conversation_id`, `turn_id`, `tool_call_id`, `status`, `title`, `output_preview`, `truncated`, `update_seq` |
        | `conversation.permission.requested` | `conversation_id`, `turn_id`, `permission_request_id`, `tool_call_id`, `title`, `kind`, `options`, `deadline_at` |
        | `conversation.permission.decided` | `conversation_id`, `turn_id`, `permission_request_id`, `status`, `decision_option_id`, `decided_by` |
        | `conversation.turn.started` | `conversation_id`, `turn_id`, `worker_id`, `fencing_token`, `binding_id`, `acp_session_id`, `session_origin` |
        | `conversation.turn.completed` | `conversation_id`, `turn_id`, `worker_id`, `fencing_token`, `stop_reason` |
        | `conversation.turn.cancelled` | `conversation_id`, `turn_id`, `worker_id`, `fencing_token`, `stop_reason`, `requested_by` |
        | `conversation.turn.failed` | `conversation_id`, `turn_id`, `worker_id`, `fencing_token`, `stop_reason`, `message` |
        | `conversation.turn.interrupted` | `conversation_id`, `turn_id`, `worker_id`, `fencing_token`, `reason` |
        | `conversation.control.transferred` | `conversation_id`, `turn_id`, `from_kind`, `from_user_id`, `to_kind`, `to_user_id`, `reason`, `control_version` |
        | `agent.session.connected` | `conversation_id`, `binding_id`, `worker_id`, `acp_session_id`, `protocol_version`, `launcher_id`, `launcher_version`, `session_origin`, `agent_capabilities` |
        | `agent.session.disconnected` | `conversation_id`, `binding_id`, `worker_id`, `acp_session_id`, `reason` |

        Enumerated values, spelled exactly: `permission.decided`'s `status` is
        `decided`, `expired` or `cancelled`; `turn.interrupted`'s `reason` is
        `lease_expired`, `worker_gone` or `shutdown` (it always has a reason and
        never a `stop_reason` — nothing reported one); `control.transferred`'s
        `reason` is `taken`, `returned` or `lost_lease`; `session_origin` on
        `agent.session.connected` (and on session bindings) is `new` or
        `resumed`; on `conversation.turn.started` it is `new`, `resumed` or
        `reused`, describing how *this turn* met its session — `new`/`resumed`
        when the session was created/restored for this turn (matching that
        binding's `agent.session.connected`), `reused` when the worker kept the
        previous turn's live process; controller `kind` is `human`, `run_attempt`
        or `none`.

        `options` is an array of `{option_id, label, kind}` objects as the agent
        offered them (`kind` = the observed ACP option kind, e.g. `allow_once`);
        `agent.session.connected`'s `agent_capabilities` is the agent's own
        capability object, verbatim.

        `conversation.message.agent` is the worker's coalesced, readable chunk
        (`09` "worker may batch/coalesce to reduce DB costs, while preserving
        readable transcript order"), not a token stream: `chunk_seq` orders
        chunks within a turn and `final` marks the last one. The Go structs for
        these payloads are in `internal/events/events.go` — the control plane
        and the worker emit them from the same package, so a shape cannot drift
        between writer and reader.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ConversationId"
        - $ref: "#/components/parameters/LastEventId"
        - $ref: "#/components/parameters/After"
      responses:
        "200":
          description: >
            An open `text/event-stream` of conversation event envelopes; the
            stream does not terminate on its own.
          headers:
            X-Communication-Replica:
              $ref: "#/components/headers/XCommunicationReplica"
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/EventEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /api/v1/conversations/{conversationId}/take-control:
    post:
      operationId: takeConversationControl
      tags: [conversations]
      summary: Take the controller lock (compare-and-swap)
      description: >
        The only way a second human starts driving a session, and it is
        optimistic concurrency, not a claim (ADR-0016, `06` "Human takeover
        sequence"):

        1. `version` must equal `conversation_control.version` as the caller
           last read it. A mismatch is `409` carrying the current `control` —
           exactly one of two simultaneous callers wins, the loser sees who won
           (`06` edge case).
        2. If a turn is `leased` or `running`, its `cancel_requested_at` is set
           in the same transaction: the worker sends ACP `session/cancel` and
           closes the turn with `conversation.turn.cancelled`. Control transfers
           immediately; the turn finishes when the harness acknowledges, so the
           new controller must not send a prompt until it sees the terminal turn
           event (`06`: "Do not send competing prompts to a running turn").
        3. Control becomes the caller atomically, `version` increments, and
           `conversation.control.transferred` is appended with `{from_kind,
           from_user_id, to_kind, to_user_id, reason: "taken"}`.

        Taking control while already the controller is an idempotent `200`:
        no `version` increment, no event. Caller must be a project `contributor`
        or `maintainer` (`403` for a `viewer`); an outsider gets `404`.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ControlVersionRequest"
      responses:
        "200":
          description: >
            Caller holds control; the body carries the new `control.version`.
          headers:
            X-Communication-Replica:
              $ref: "#/components/headers/XCommunicationReplica"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ConversationConflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /api/v1/conversations/{conversationId}/return-control:
    post:
      operationId: returnConversationControl
      tags: [conversations]
      summary: Return the controller lock to the previous controller
      description: >
        Releases the caller's lock. Control goes to `control.previous_user_id`
        when that user is still a project contributor or maintainer; otherwise
        it goes to `none`, and any contributor can take it afterwards. A
        running turn is **not** cancelled by returning control — the agent keeps
        working under whoever holds the lock, and only `cancel` stops it.

        Same CAS rules as `take-control`: `version` must match, a stale
        `version` is `409` with the current `control`, and the transition emits
        `conversation.control.transferred` with `reason: "returned"`. Only the
        current controller may return it (`409` otherwise, so a UI cannot
        release a lock it never held).
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ControlVersionRequest"
      responses:
        "200":
          description: Control released; body carries the new `control.version`.
          headers:
            X-Communication-Replica:
              $ref: "#/components/headers/XCommunicationReplica"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ConversationConflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /api/v1/conversations/{conversationId}/cancel:
    post:
      operationId: cancelConversationTurn
      tags: [conversations]
      summary: Ask the agent to stop the current turn (controller only)
      description: >
        Sets `cancel_requested_at` on the conversation's active `leased` or
        `running` turn and returns `202` immediately; the worker sends ACP
        `session/cancel` and the turn ends with `conversation.turn.cancelled`
        (or `interrupted`, if the worker never gets to report it — the API does
        not pretend otherwise). Cancellation is a *request*: this response is
        not proof that the agent stopped, and the turn stays non-terminal until
        somebody with a valid fencing token says otherwise.

        Controller only (`409` with the current `control` otherwise); no active
        turn is `409` with `type:
        https://communication.dev/errors/no-active-turn`. A `queued` turn has
        not started, so cancelling it *is* terminal: it goes straight to
        `cancelled` with `conversation.turn.cancelled` appended by this call.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      responses:
        "202":
          description: >
            Cancellation requested on the active turn (or the queued turn was
            cancelled outright). The turn is reported as it stands after this
            request.
          headers:
            X-Communication-Replica:
              $ref: "#/components/headers/XCommunicationReplica"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationTurn"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ConversationConflict"
  /api/v1/conversations/{conversationId}/permissions/{requestId}:
    post:
      operationId: decideConversationPermission
      tags: [permissions, conversations]
      summary: Answer a permission prompt (controller only)
      description: >
        Answers the prompt whose id is `requestId` — the id from
        `conversation.permission.requested`'s `permission_request_id` (the
        `permission_requests` row id), *not* the ACP JSON-RPC id. `option_id`
        must be one of the prompt's offered `options`; anything else is `422`
        (a client may not invent a permission the agent did not offer).

        The answer is durable before it is live: the row moves to `decided` and
        `conversation.permission.decided` is appended in one transaction, and
        the worker — which owns the ACP connection and is the only process that
        can answer the harness — reads the decision and replies. A prompt that
        is already `decided` is `409` (no double-spend); one that expired or was
        cancelled with its turn is `409` too, and `404` never leaks a prompt of
        another project.

        Controller only (`409` with the current `control` otherwise),
        `contributor`+ and CSRF as everywhere. The default remains `ask`: no M2
        profile pre-approves anything (`04` "Permission policy").
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: "#/components/parameters/ConversationId"
        - $ref: "#/components/parameters/PermissionRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PermissionDecision"
      responses:
        "200":
          description: Decision recorded and queued for the worker.
          headers:
            X-Communication-Replica:
              $ref: "#/components/headers/XCommunicationReplica"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermissionRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ConversationConflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  # ------------------------------------------------------- M3: secrets ----
  #
  # The whole surface is metadata. There is no route below that can return a
  # value, and no request body below (except create/rotate) accepts one.
  /api/v1/projects/{projectId}/secrets:
    get:
      operationId: listProjectSecrets
      tags: [secrets]
      summary: List a project's secret references (metadata only)
      description: >
        `secret_metadata` rows the project can see, ordered by `slug`. Never a
        value, never a version list beyond `current_version`, never
        `content_sha256` (it is a retry-comparison digest of a low-entropy
        secret: publishing it would be an offline guessing oracle for every
        project viewer — ADR-0018 names it "never API-exposed", and this is an
        API). `viewer` or above; a non-member gets `404`.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Secret references.
          headers:
            X-Communication-Replica:
              $ref: "#/components/headers/XCommunicationReplica"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecretList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createProjectSecret
      tags: [secrets]
      summary: Create a secret reference and its first version
      description: >
        Creates `secret_metadata` plus `secret_versions` v1 in one transaction
        and appends `secret.created`. `maintainer` or above.

        `value` is write-only: it is encrypted (AES-256-GCM under a data key
        derived from a master key held **outside** this database, ADR-0018 D2),
        stored, and then appears in no response, no event, no log and no
        audit detail. The response body is the metadata row — the caller cannot
        read back what it just wrote, which is the property `12` case 15 asserts.

        `allowed_agent_profile_ids` is an allowlist, and **empty means denied to
        every profile** (`ADR-0018` D3): a secret nobody granted is a secret no
        agent sees, not a secret every agent in the project sees.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SecretCreate"
      responses:
        "201":
          description: Secret created; `current_version` is 1.
          headers:
            X-Communication-Replica:
              $ref: "#/components/headers/XCommunicationReplica"
            Location:
              description: >
                `/api/v1/projects/{projectId}/secrets/{secretId}` for the new row.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Secret"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /api/v1/projects/{projectId}/secrets/{secretId}:
    put:
      operationId: updateProjectSecret
      tags: [secrets]
      summary: Update a secret's metadata and policy (never its value)
      description: >
        Replaces `purpose`, the allowlists and `audit_policy`, and appends
        `secret.policy.updated` carrying the before/after policy. `slug`,
        `scope`, `delivery_mode` and `current_version` are not editable here: a
        slug is what a mount names, and a version only moves by appending one.

        A body containing `value` is a **`400`**, not a silent ignore — "I meant
        to rotate" and "I meant to rename" must not be the same request. Rotation
        is `POST /secrets/{secretId}/versions`.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/SecretId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SecretUpdate"
      responses:
        "200":
          description: Updated metadata.
          headers:
            X-Communication-Replica:
              $ref: "#/components/headers/XCommunicationReplica"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Secret"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /api/v1/projects/{projectId}/secrets/{secretId}/versions:
    post:
      operationId: addProjectSecretVersion
      tags: [secrets]
      summary: Append an immutable secret version (rotation)
      description: >
        Appends `secret_versions` N+1, bumps `current_version`, sets `rotated_at`
        and appends `secret.version.added`. Old versions are **never** replaced or
        deleted: a unit that pinned version 3 decrypts version 3 for as long as it
        lives, which is what makes rotation mid-turn safe (`ADR-0018` D2).
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/SecretId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SecretVersionCreate"
      responses:
        "201":
          description: Version appended.
          headers:
            X-Communication-Replica:
              $ref: "#/components/headers/XCommunicationReplica"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecretVersionInfo"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/projects/{projectId}/secrets/{secretId}:revoke:
    post:
      operationId: revokeProjectSecret
      tags: [secrets]
      summary: Revoke a secret and every one of its versions
      description: >
        Sets `revoked_at` on the metadata row and on every version, then appends
        `secret.revoked`. From that moment the worker refuses to materialize it
        (`ADR-0018` D2.4) — a unit already running keeps whatever it was launched
        with, because nothing here can take a file back out of a process's memory.
        Revocation is not deletion: `06` asks for an auditable history, and a
        revoked row still shows who could have had it.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/SecretId"
      responses:
        "200":
          description: Revoked; `revoked_at` is set.
          headers:
            X-Communication-Replica:
              $ref: "#/components/headers/XCommunicationReplica"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Secret"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/projects/{projectId}/secrets/{secretId}/materializations:
    get:
      operationId: listProjectSecretMaterializations
      tags: [secrets]
      summary: Which unit had this secret, where, and when it was cleaned up
      description: >
        The audit view over `secret_materializations` — proof that a value was
        present only during the unit authorized to have it. Metadata only: the
        target is a relative path or an env name, never a value, and a row with
        `cleaned_at` null is a live finding (the startup sweep exists to close
        exactly those rows). `maintainer` or above; `viewer` cannot read another
        team's materialization map, which is itself a disclosure surface.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/SecretId"
      responses:
        "200":
          description: Materialization records, newest first.
          headers:
            X-Communication-Replica:
              $ref: "#/components/headers/XCommunicationReplica"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecretMaterializationList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  # --------------------------------------------- M3: secret mount points ---
  /api/v1/projects/{projectId}/secret-mounts:
    get:
      operationId: listProjectSecretMounts
      tags: [secrets]
      summary: List declared secret placements
      description: >
        `secret_mounts` rows — the declarations `05`'s YAML writes
        (`examples/secret-mounts.yaml`): which secret, delivered how, into which
        repository at which relative path, for how long. `viewer` or above: a
        mount's *placement* is not sensitive, its value is, and the value is not
        here.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Placements.
          headers:
            X-Communication-Replica:
              $ref: "#/components/headers/XCommunicationReplica"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecretMountList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createProjectSecretMount
      tags: [secrets]
      summary: Declare where a secret is placed
      description: >
        Validates against the same rules the `mounts_shape` CHECK enforces
        (`env` needs `env_name` and no path; `env_file` needs a repository of
        **this project** and a relative path with no `..`, no leading `/` and no
        empty segment), and against the filesystem only later, at materialization
        time — "relative to what" has no answer until a workspace exists.
        `integration_broker` is refused here with `422` until it is implemented
        (`ADR-0018` clause 8), so a declaration can never silently degrade to env
        delivery. `maintainer` or above.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SecretMountCreate"
      responses:
        "201":
          description: Placement declared.
          headers:
            X-Communication-Replica:
              $ref: "#/components/headers/XCommunicationReplica"
            Location:
              description: >
                `/api/v1/projects/{projectId}/secret-mounts/{mountId}`.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecretMount"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /api/v1/projects/{projectId}/secret-mounts/{mountId}:
    delete:
      operationId: deleteProjectSecretMount
      tags: [secrets]
      summary: Remove a placement declaration
      description: >
        Stops the mount being honored on the *next* launch. It does not revoke the
        secret — those are different mistakes, and conflating them means a typo in
        a path costs a rotation. A unit already running keeps what it was given.
        `maintainer` or above.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/SecretMountId"
      responses:
        "204":
          description: Declaration removed.
          headers:
            X-Communication-Replica:
              $ref: "#/components/headers/XCommunicationReplica"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  # -------------------------------------------- M3: workspaces (read-only) ---
  #
  # A browser learns which scopes have work, on which worker and volume, at which
  # refs. It never learns a path: root_path, checkout_path, mirror_path and
  # admin_dir are worker-side topology and exist in this database only so the
  # worker's policy can be derived from recorded facts (ADR-0017 D4).
  /api/v1/projects/{projectId}/workspaces:
    get:
      operationId: listProjectWorkspaces
      tags: [workspaces]
      summary: List a project's live and recent workspaces
      description: >
        Live (`preparing`, `ready`, `quarantined`) first, then recent history,
        newest first. `volume_id` is included because case 20 is a question about
        the *disk*: "this workspace was created on a volume this worker can no
        longer see" is only answerable if the client can watch the two ids
        disagree. `repos[]` carries `run_ref`, `base_commit` and `head_commit`
        — the git identity of the scope — and `excluded_paths`, the project-scoped
        set that git and the artifact scanner both filter again (ADR-0017 D6).
        `viewer` or above.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Workspaces.
          headers:
            X-Communication-Replica:
              $ref: "#/components/headers/XCommunicationReplica"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/workspaces/{workspaceId}:
    get:
      operationId: getWorkspace
      tags: [workspaces]
      summary: Read one workspace
      description: >
        Same field rules as the list route (`workspace_id`, `worker_id`,
        `volume_id`, refs — no paths), authorized through the workspace's own
        `project_id`. `404` from outside the project, byte-identical to a `404`
        for a random uuid.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: The workspace.
          headers:
            X-Communication-Replica:
              $ref: "#/components/headers/XCommunicationReplica"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/workspaces/{workspaceId}/repos/{repositoryId}/status:
    get:
      operationId: getWorkspaceRepoStatus
      tags: [workspaces]
      summary: Dirty summary and modified-path manifest for one checkout
      description: >
        Answered from `workspace_repos` (`modified_paths`, `head_commit`,
        `excluded_paths`) — the row the worker wrote at the unit boundary, not a
        live `git status`. That distinction is deliberate: `09` forbids the
        browser API becoming a worker-service surface, so this route reads
        database rows and never shells into a worker. `contributor` or above,
        because "what is dirty in the checkout" is work-in-progress information.
        A stale row says so (`recorded_at`), rather than presenting last-turn
        state as current.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/RepositoryId"
      responses:
        "200":
          description: Status as last recorded by the worker.
          headers:
            X-Communication-Replica:
              $ref: "#/components/headers/XCommunicationReplica"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceRepoStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  # ------------------------------------------------- M3: sandbox record ---
  /api/v1/turns/{turnId}/sandbox:
    get:
      operationId: getTurnSandbox
      tags: [sandbox, conversations]
      summary: What enforcement one launched unit actually ran under
      description: >
        The enforcement record for a turn: the stage the chain reached, the reason
        it stopped there, the pinned policy digest, whether `AF_UNIX` was mediated,
        whether egress was enforced, which grant roles the unit got, and whether a
        child was ever exec'd. This is `12-test-strategy` case 13's observable
        answer ("no process started, and you can see why") and `10`'s run-inspector
        need — served from the journal plus `sandbox.verified`, so reading it does
        not require worker logs.

        `network_enforced: false` is an expected value on the `agent-turn` profile
        and is reported rather than hidden (ADR-0019 D3): a real model turn cannot
        run with egress denied, and D-021 stays **Proposed** until allowlisted
        egress is observed through the nono proxy from a real turn.

        Authorized through turn -> conversation -> **project** (`viewer` or above);
        `404` otherwise. `grants[]` names roles, never host paths.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/TurnId"
      responses:
        "200":
          description: The enforcement record.
          headers:
            X-Communication-Replica:
              $ref: "#/components/headers/XCommunicationReplica"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TurnSandbox"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/system/sandbox:
    get:
      operationId: getSystemSandbox
      tags: [sandbox, system]
      summary: Sandbox health of the registered workers
      description: >
        Per worker: backend, version, the enforcement mode it registered with,
        whether it has verified a launch, and its notes — plus the pinned nono
        version and policy digest the deployment ships. Session required, no
        membership check (this matches `GET /api/v1/workers`: an operator has to
        be able to see that enforcement is missing before anyone trusts it).

        When `verified` is false the UI must say so in words that do not imply
        safety: a green check next to `required` on a worker that never verified
        would be a false guarantee (`05`'s first acceptance gate is honest
        reporting, not success).
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Fleet sandbox state.
          headers:
            X-Communication-Replica:
              $ref: "#/components/headers/XCommunicationReplica"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemSandbox"
        "401":
          $ref: "#/components/responses/Unauthorized"
  # ------------------------------------------------- M3: artifacts ------
  /api/v1/projects/{projectId}/artifacts:
    get:
      operationId: listProjectArtifacts
      tags: [artifacts]
      summary: List a project's artifacts, filtered by sensitivity
      description: >
        Metadata, newest first. The sensitivity table (ADR-0020 D3) is enforced
        **in SQL**, not by hiding rows after the fact: a `viewer` never receives a
        `restricted` row, and a `secret` row has no download path in M3 at all for
        anyone — the label exists so the policy can be written against it before
        the mechanism does. `storage_key` is never serialized, and there is no
        `PUT` anywhere under `/artifacts`: artifact rows are immutable and
        content-addressed, so a retry is the same row, not a second copy.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Artifacts the caller's role may see.
          headers:
            X-Communication-Replica:
              $ref: "#/components/headers/XCommunicationReplica"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/artifacts/{artifactId}:
    get:
      operationId: getArtifact
      tags: [artifacts]
      summary: Read one artifact's metadata
      description: >
        Metadata plus `preview_url` when the caller may mint a preview token for
        it. `preview_url` is a *template* until a token is minted
        (`POST /artifacts/{artifactId}/preview-token`), because a URL that embeds
        a token would land in a browser history and a proxy log, and the token is
        the only thing standing between a stored HTML artifact and the session
        cookie of whoever opens it.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ArtifactId"
      responses:
        "200":
          description: Artifact metadata.
          headers:
            X-Communication-Replica:
              $ref: "#/components/headers/XCommunicationReplica"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Artifact"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/artifacts/{artifactId}/content:
    get:
      operationId: getArtifactContent
      tags: [artifacts]
      summary: Stream an artifact's bytes
      description: >
        Streamed from the backend (never a database row). Two header rules are the
        whole point of this route, and both are asserted in
        `12-test-strategy` case 16:

        * `text/html` is served as `text/plain; charset=utf-8` with
          `Content-Disposition: attachment`, so navigating to this URL cannot run
          the artifact's script in the app's origin.
        * `X-Content-Type-Options: nosniff` always, and no `Cache-Control` that
          would let a redacted artifact outlive its row.

        Executing artifact HTML is only ever the preview origin's job —
        `http://preview.localhost:18084/preview/{token}` behind a host gate on the
        same binary (ADR-0020 D6). It is deliberately **not** an operation of this
        API: a path under `/api/v1` would share the app's cookie scope, and a
        hostname difference is what removes the cookie (a port would not).

        Role gate: `contributor` for `standard`/`internal`, `maintainer` for
        `restricted`, nothing for `secret`.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ArtifactId"
      responses:
        "200":
          description: >
            The bytes. `Content-Type` is the artifact's `media_type`, except for
            `text/html`, which is downgraded as described above.
          headers:
            X-Communication-Replica:
              $ref: "#/components/headers/XCommunicationReplica"
            Content-Disposition:
              description: >
                `attachment` for `text/html`; absent otherwise.
              schema:
                type: string
            X-Content-Type-Options:
              description: "`nosniff`, always."
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/artifacts/{artifactId}/preview-token:
    post:
      operationId: createArtifactPreviewToken
      tags: [artifacts]
      summary: Mint a single-artifact preview token
      description: >
        An HMAC'd, single-artifact, digest-bound, short-TTL token (ADR-0020 D5),
        exchanged for a URL on the preview origin. Minting is an **access** and is
        audited as one, even though the token is what later authorizes the fetch:
        `06` wants the record to name who looked, not only who was allowed to.
        `contributor` or above, for `standard` and `internal` sensitivity only.
        An expired token is `401` on the preview origin; a token re-signed for a
        different artifact id is refused there too, and this route never reissues
        one silently.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: "#/components/parameters/ArtifactId"
      responses:
        "200":
          description: A token and the URL that consumes it.
          headers:
            X-Communication-Replica:
              $ref: "#/components/headers/XCommunicationReplica"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreviewToken"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  # ============================================================ M4: surface ==
  #
  # The 37 routes of docs/m4-contract.md § 2.1: 16 definition/draft/revision/
  # schema, 4 assignment, 13 run/attempt/node including the run SSE stream,
  # 3 approval, 1 ops. Conventions are unchanged from M1..M3 (ADR-0014);
  # the M4-specific rules are in the info.description. No route below
  # serializes a fencing token, a lease deadline, a `worker_id` beyond what M3
  # already exposes, an absolute workspace path, or a secret value (§ 2's
  # non-negotiables), and none is a worker-service surface (`09`).
  # ------------------------------------------------- M4: pipelines ----------
  /api/v1/pipelines:
    get:
      operationId: listPipelines
      tags: [pipelines]
      summary: List the organization's pipeline library
      description: >
        Pipeline definitions with their revision roll-up, ordered by `slug`.
        Organization member or above; the list carries no documents, so no
        library content leaks before membership is checked. M4 has no
        pagination (same ordered-list idiom as the other lists).
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Pipelines.
          headers:
            X-Communication-Replica:
              $ref: "#/components/headers/XCommunicationReplica"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PipelineList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createPipeline
      tags: [pipelines]
      summary: Create a pipeline definition (no revision, no run)
      description: >
        Creates the *logical* definition only — the mutable-draft → immutable-
        revision lifecycle starts at `POST /pipelines/{pipelineId}/drafts`.
        Requires the library role (`01` "Publish shared pipeline revision").
        `{slug, display_name, description}`; `slug` matches
        `^[a-z][a-z0-9.-]{0,127}$` and is unique in the organization (duplicate
        is `409`). Appends `pipeline.created` in the creating transaction.
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PipelineCreate"
      responses:
        "201":
          description: Definition created.
          headers:
            X-Communication-Replica:
              $ref: "#/components/headers/XCommunicationReplica"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pipeline"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /api/v1/pipelines/{pipelineId}:
    get:
      operationId: getPipeline
      tags: [pipelines]
      summary: Read one definition with its revision summaries
      description: >
        The definition plus `revisions[]` summaries (never document bodies —
        that content arrives through `GET /revisions/{digestOrId}`). A pipeline
        of another organization is `404`, not `403`. Organization member+.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/PipelineId"
      responses:
        "200":
          description: The definition.
          headers:
            X-Communication-Replica:
              $ref: "#/components/headers/XCommunicationReplica"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pipeline"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updatePipeline
      tags: [pipelines]
      summary: Rename, describe or archive a definition
      description: >
        Metadata only — this route *cannot* touch a revision, a draft or a run
        (ADR-0002: published revisions are immutable; existing runs keep their
        pinned revision). `archived: true` hides the pipeline from new
        assignments; it does not cancel running ones. Library role.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: "#/components/parameters/PipelineId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PipelineUpdate"
      responses:
        "200":
          description: Updated definition.
          headers:
            X-Communication-Replica:
              $ref: "#/components/headers/XCommunicationReplica"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pipeline"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /api/v1/pipelines/{pipelineId}/revisions:
    get:
      operationId: listPipelineRevisions
      tags: [pipelines]
      summary: List a pipeline's immutable revisions (summaries)
      description: >
        Newest revision first. The summary carries the identity and both
        digests — `revision_number`, `version_label`, `revision_digest`,
        `plan_digest`, `digest_scope`, `published_at`, `published_by`,
        `status` — and **never** the document body: the body is a
        `GET /revisions/{digestOrId}` fetch. Organization member+.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/PipelineId"
      responses:
        "200":
          description: Revision summaries.
          headers:
            X-Communication-Replica:
              $ref: "#/components/headers/XCommunicationReplica"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PipelineRevisionSummaryList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/pipelines/{pipelineId}/drafts:
    get:
      operationId: listPipelineDrafts
      tags: [pipelines]
      summary: List a pipeline's drafts
      description: >
        `id`, `status`, `version`, `updated_at`, `edited_by` per row, newest
        `updated_at` first (`pipeline_drafts_pipeline_idx`). Drafts are the only
        mutable pipeline objects, so the list is where an editor finds its way
        back to uncommitted work. Organization member+.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/PipelineId"
      responses:
        "200":
          description: Draft summaries.
          headers:
            X-Communication-Replica:
              $ref: "#/components/headers/XCommunicationReplica"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DraftSummaryList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createPipelineDraft
      tags: [pipelines]
      summary: Start a draft from a document or by cloning a revision
      description: >
        Exactly one of `document_yaml` (a new document; `source_kind` becomes
        `manual` or `yaml_import`) or `from_revision_id` (clone: the revision's
        canonical document seeds the draft). Either way the server records
        `source_sha256` over the bytes it received — the same hash the next
        `validate`/`publish` compares against, which is what makes
        `draft_changed_since_validation` a fact rather than a guess.
        Contributor+.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: "#/components/parameters/PipelineId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DraftCreate"
      responses:
        "201":
          description: "Draft created (`status: draft`)."
          headers:
            X-Communication-Replica:
              $ref: "#/components/headers/XCommunicationReplica"
            Location:
              description: "`/api/v1/drafts/{draftId}` for the new row."
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Draft"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  # ------------------------------------------------- M4: drafts -------------
  /api/v1/drafts/{draftId}:
    get:
      operationId: getDraft
      tags: [pipelines]
      summary: Read a draft with its last validation result
      description: >
        `{document_yaml, ui_layout, status, version, validation}` — `validation`
        is the last `POST /validate` body verbatim, so an editor reload does not
        need to revalidate to show its problems panel. The `metadata.ui` block
        is *served* from here and never participates in a digest (ADR-0021 § 5:
        ui survives a reformat, dies on a structural edit). Contributor+,
        resolved through the draft's pipeline organization.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/DraftId"
      responses:
        "200":
          description: The draft.
          headers:
            X-Communication-Replica:
              $ref: "#/components/headers/XCommunicationReplica"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Draft"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: putDraft
      tags: [pipelines]
      summary: Replace a draft's document (compare-and-swap)
      description: >
        `{document_yaml, version}`. A `version` other than the draft's current
        one is `409` `stale_draft_version` carrying the winner's version — two
        open editor tabs must not silently overwrite each other. The stored
        `metadata.ui` is re-resolved from the new document. Every accepted
        write appends `pipeline.draft.updated` (ids, version and the new
        `source_sha256` — never the body). Document beyond 256 KiB is `422`
        (`document_too_large` is a loader code, and the DB CHECK bounds the
        column). Contributor+.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: "#/components/parameters/DraftId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DraftPut"
      responses:
        "200":
          description: Updated draft; `version` is incremented.
          headers:
            X-Communication-Replica:
              $ref: "#/components/headers/XCommunicationReplica"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Draft"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/DraftConflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
    delete:
      operationId: deleteDraft
      tags: [pipelines]
      summary: Discard an unpublished draft
      description: >
        A draft whose `status` is `published` is `409` — it is the audit trail
        of a live revision, not discardable material. Anything else is removed;
        drafts have no other delete path. Contributor+.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: "#/components/parameters/DraftId"
      responses:
        "204":
          description: Draft discarded.
          headers:
            X-Communication-Replica:
              $ref: "#/components/headers/XCommunicationReplica"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/drafts/{draftId}/validate:
    post:
      operationId: validateDraft
      tags: [pipelines]
      summary: Validate a draft against the schema, loader rules and compiler
      description: >
        The validation contract is `docs/m4-contract.md` § 2.2: the response
        carries `valid`, both digests and `digest_scope` on success, and
        `errors[]` sorted by `(instance_location, schema_location, code,
        message)` otherwise. `source` is `loader`, `schema` or `compiler`, and
        the three sources are **ordered, not merged**: loader rules gate the
        JSON the schema validator sees, schema units convert 1:1
        (`instanceLocation`/`keywordLocation` → snake_case), then the compiler
        names the classes only it can see (duplicate ids, cycles, dangling
        references, secret literals, undeclared CEL fields). Error codes are a
        public contract — the editor's help links and the assistant's fixes
        name them, so adding a code is additive and renaming one is not.
        `secret_literal_detected` is a block, not a warning, and the response
        never quotes an offending value (ADR-0021 Security).
        On success the draft stores the `canonical_document`, both digests, the
        `compiled_plan` and `plan_digest`; the draft's `validation` member (what
        `GET /drafts/{draftId}` echoes) becomes this body. At most 200 errors,
        then `notes` gains `errors_truncated`. Contributor+.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: "#/components/parameters/DraftId"
      responses:
        "200":
          description: >
            The validation body. `valid: true` and `valid: false` are both
            `200`: the verdict is in the body, the status code answers "was the
            document acceptable JSON/YAML at all".
          headers:
            X-Communication-Replica:
              $ref: "#/components/headers/XCommunicationReplica"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidateResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/drafts/{draftId}/publish:
    post:
      operationId: publishDraft
      tags: [pipelines]
      summary: Publish the draft as an immutable revision
      description: >
        Four gates, each with its own `409`/`422` (never a silent revalidate):
        the draft's *current* `validation` must be `valid` at the same
        `source_sha256` (`draft_changed_since_validation`), the carried
        `version` must match (`stale_draft_version`), the caller must hold the
        library role (`403`), and the document must have no unresolved
        `NodeTemplate` reference (`unresolved_node_template`). A not-valid
        draft is `draft_not_valid`.
        Success creates the `pipeline_revisions` row (both digests, the
        regenerated `document_text`, `revision_number` and `version_label`
        unique per pipeline) and flips the draft to `published`, immutable,
        pointing at the revision. A document whose `revision_digest` already
        exists in the organization is `409` `revision_already_published`
        carrying the existing revision id (`UNIQUE (organization_id,
        revision_digest)` — `09`'s rule made structural). Appends
        `pipeline.revision.published`.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: "#/components/parameters/DraftId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DraftPublish"
      responses:
        "201":
          description: The immutable revision.
          headers:
            X-Communication-Replica:
              $ref: "#/components/headers/XCommunicationReplica"
            Location:
              description: "`/api/v1/revisions/{revisionId}` for the new row."
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PipelineRevision"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/DraftConflict"
        "422":
          $ref: "#/components/responses/PublishUnprocessable"
  /api/v1/revisions/{digestOrId}:
    get:
      operationId: getRevision
      tags: [pipelines]
      summary: Resolve a revision by id or revision digest
      description: >
        The path segment is either a revision `uuid` or a `revision_digest`
        (`sha256:<64 hex>`). A digest that exists only in another organization
        is `404`, byte-identical to a nonsense digest — cross-tenant digests
        are not a lookup surface. The record includes `canonical_document` and
        the **regenerated** `document_text` (ADR-0021 § 5: anchors and merge
        keys do not survive canonicalization, so the regenerated text is the
        honest textual form). Organization member+.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RevisionDigestOrId"
      responses:
        "200":
          description: The revision record.
          headers:
            X-Communication-Replica:
              $ref: "#/components/headers/XCommunicationReplica"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PipelineRevision"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/revisions/{revisionId}/document:
    get:
      operationId: getRevisionDocument
      tags: [pipelines]
      summary: The revision's YAML, regenerated from the canonical document
      description: >
        `?format=yaml` is the only supported value (anything else is `422`).
        The bytes are regenerated from `canonical_document`, not replayed from
        what the author typed, so a download-and-republish round trip
        canonicalizes to the same digest. Organization member+.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RevisionId"
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [yaml]
            default: yaml
      responses:
        "200":
          description: The YAML document body.
          headers:
            X-Communication-Replica:
              $ref: "#/components/headers/XCommunicationReplica"
          content:
            text/yaml:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /api/v1/revisions/{revisionId}/deprecate:
    post:
      operationId: deprecateRevision
      tags: [pipelines]
      summary: Deprecate a revision without touching any run
      description: >
        Sets the revision's `status` to `deprecated`. Existing runs keep their
        pinned revision and finish untouched (ADR-0002); assignments keep their
        pin until an explicit re-pin — deprecation is a signal to humans, not
        an execution kill switch. There is no delete path for a revision at
        all. Library role.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: "#/components/parameters/RevisionId"
      responses:
        "200":
          description: "The revision with `status: deprecated`."
          headers:
            X-Communication-Replica:
              $ref: "#/components/headers/XCommunicationReplica"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PipelineRevision"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/schemas/pipeline-v1alpha1:
    get:
      operationId: getPipelineSchema
      tags: [pipelines, system]
      summary: The served pipeline validation schema
      description: >
        `api/schemas/pipeline-v1alpha1.schema.json` verbatim as
        `application/json`, `$id` and all, so the UI never bundles a copy that
        can drift from the compiler's (ADR-0021 § 7). Session required, no
        membership check — the schema is public structure, not tenant content.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The JSON Schema document.
          headers:
            X-Communication-Replica:
              $ref: "#/components/headers/XCommunicationReplica"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ------------------------------------------------ M4: assignments ---------
  /api/v1/projects/{projectId}/assignments:
    get:
      operationId: listProjectAssignments
      tags: [assignments]
      summary: List a project's pipeline assignments
      description: >
        Each assignment with its pinned revision's identity and digests, plus
        the *effective* ceilings after `budget_overrides` — what a run of this
        assignment will actually be bounded by, not the raw columns. Viewer+.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Assignments.
          headers:
            X-Communication-Replica:
              $ref: "#/components/headers/XCommunicationReplica"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssignmentList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createProjectAssignment
      tags: [assignments]
      summary: Assign a pipeline to a project at a pinned revision
      description: >
        `{pipeline_id, pinned_revision_id, max_concurrent_runs,
        budget_overrides}`. One assignment per `(project, pipeline)` — a second
        is `409` (`UNIQUE (project_id, pipeline_id)`); the row is re-pinned
        through `PATCH`, never replaced. A `budget_overrides` value that
        *raises* a ceiling above the pipeline's declared budget is `400`
        `budget_overrides_may_only_lower`: an assignment is a governor, not an
        upgrade path (`07` "Budget/limit layers"). The pinned revision must be
        published and in the caller's organization (`404` otherwise).
        Maintainer+. Appends `assignment.created`.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignmentCreate"
      responses:
        "201":
          description: Assignment created.
          headers:
            X-Communication-Replica:
              $ref: "#/components/headers/XCommunicationReplica"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Assignment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/assignments/{assignmentId}:
    patch:
      operationId: patchAssignment
      tags: [assignments]
      summary: Re-pin a revision, change budgets or disable
      description: >
        Re-pinning is *explicit promotion* (`07` "Version rollout"): it takes
        effect at **new run creation only** — every queued or running run keeps
        the revision it pinned at creation together with its
        `policies_snapshot` (ADR-0002, `12` case 11). Budget edits follow the
        same rule: a running run is governed by its snapshot, not by this row.
        `enabled: false` stops new runs and leaves existing ones alone.
        Appends `assignment.updated` with the `before`/`after` pair.
        Maintainer+.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: "#/components/parameters/AssignmentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignmentPatch"
      responses:
        "200":
          description: Updated assignment; `version` is incremented.
          headers:
            X-Communication-Replica:
              $ref: "#/components/headers/XCommunicationReplica"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Assignment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
    delete:
      operationId: deleteAssignment
      tags: [assignments]
      summary: Remove an assignment
      description: >
        Stops future `POST /runs` through this assignment. Runs already created
        keep their pinned revision and `policies_snapshot` and finish under the
        rules they started with (`09`: assignment removal does not affect
        running runs). Maintainer+.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: "#/components/parameters/AssignmentId"
      responses:
        "204":
          description: Assignment removed.
          headers:
            X-Communication-Replica:
              $ref: "#/components/headers/XCommunicationReplica"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  # ------------------------------------------------- M6: schedules ----------
  /api/v1/projects/{projectId}/schedules:
    get:
      operationId: listProjectSchedules
      tags: [schedules]
      summary: List a project's schedules
      description: >
        Every schedule of the project, oldest first (the UI's assignment-row
        grouping order). Carries the derived clock (`next_run_at`) and the
        record of the last fire (`last_run_at`, `last_run_id`) so a viewer can
        answer "when does it run next, and did it run last time?" without a
        second request. Viewer+ (ADR-0032).
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Schedules.
          headers:
            X-Communication-Replica:
              $ref: "#/components/headers/XCommunicationReplica"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createProjectSchedule
      tags: [schedules]
      summary: Schedule an assignment's pinned revision on a cron cadence
      description: >
        `{assignment_id, cron_expr, inputs, enabled}`. The schedule fires the
        assignment's *pinned* revision with the fixed `inputs` — it is an
        assignment property, never a second execution engine, and a fire goes
        through the same create path as a manual run (ADR-0032). `cron_expr`
        is a 5-field cron expression evaluated in UTC; an expression the
        parser refuses is `422` `invalid_cron` (field `cron_expr`). An
        assignment that can never fire (disabled, or pinned to an
        unpublished revision) is `409` `assignment_not_fireable` — the
        schedule says no out loud rather than silently never running.
        `inputs` are validated against the pinned revision's input schema
        (`422` with the same validation-error body as run creation).
        Maintainer+.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleCreate"
      responses:
        "201":
          description: Schedule created; `next_run_at` is its first slot.
          headers:
            X-Communication-Replica:
              $ref: "#/components/headers/XCommunicationReplica"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /api/v1/schedules/{scheduleId}:
    patch:
      operationId: patchSchedule
      tags: [schedules]
      summary: Change a schedule's cadence, inputs or enabled flag
      description: >
        `{version, cron_expr?, inputs?, enabled?}` — optimistic concurrency:
        `version` is required and must equal the row's current version, or the
        edit is `409` `schedule_version_stale` (re-read and replay). A fire
        never bumps `version`, so this only ever means "somebody else edited
        the schedule". Re-enabling re-derives `next_run_at` from *now*: a
        schedule that was off does not backfill the missed slots. Editing
        `cron_expr` re-derives the clock too. Maintainer+ on the owning
        project.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: "#/components/parameters/ScheduleId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SchedulePatch"
      responses:
        "200":
          description: Updated schedule; `version` is incremented.
          headers:
            X-Communication-Replica:
              $ref: "#/components/headers/XCommunicationReplica"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  # ---------------------------------------------------- M4: runs ------------
  /api/v1/projects/{projectId}/runs:
    get:
      operationId: listProjectRuns
      tags: [runs]
      summary: List a project's runs
      description: >
        Newest first (`created_at DESC, id DESC`, `runs_project_created_idx`).
        Carries `status`, both digests, `depth`, `parent_run_id` and the timing
        columns; a child run is listed beside its siblings with its
        `parent_run_id` set, because the tree route is the *relationship* view
        and this is the *activity* view. Viewer+. M4 has no pagination.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Runs.
          headers:
            X-Communication-Replica:
              $ref: "#/components/headers/XCommunicationReplica"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunSummaryList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createRun
      tags: [runs]
      summary: Start a run at a pinned revision (idempotent)
      description: >
        Exactly one of `assignment_id` (the assignment's pinned revision and
        run ceilings) or `pipeline_revision_id` (a direct revision pin, no
        assignment budgets). In **one transaction** the run resolves and pins
        `pipeline_revision_id`, `revision_digest`, `plan_digest`,
        `plan_snapshot`, `policies_snapshot` and `repo_snapshot` (starting base
        commits, `03` step 2) — after this response a library edit cannot reach
        the run (`12` case 11) — validates `inputs` against `spec.inputs`
        (`422` with validate-style locations on a missing or mistyped input;
        absent optional inputs take their declared defaults, and `run_inputs`
        records which origin each value came from), enforces
        `assignments.max_concurrent_runs` at creation, and appends
        `run.created`.
        `Idempotency-Key` (the header, or the `idempotency` body member; the
        header wins) per ADR-0023 § 12: the same key with the same
        `request_sha256` re-answers `200` with the stored run — a retried click
        is not a second run (`12` case 1) — and the same key with a different
        body is `409` `idempotency_key_mismatch`, never an update. Keys are
        scoped per project and expire after 24 h. Contributor+.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunCreate"
      responses:
        "201":
          description: Run created and queued.
          headers:
            X-Communication-Replica:
              $ref: "#/components/headers/XCommunicationReplica"
            Location:
              description: "`/api/v1/runs/{runId}` for the new run."
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunCreateResponse"
        "200":
          description: >
            Idempotent replay: the key matched a stored run whose
            `request_sha256` equals this request's. Body is the stored run.
          headers:
            X-Communication-Replica:
              $ref: "#/components/headers/XCommunicationReplica"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunCreateResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidateFailed"

  /api/v1/runs/{runId}:
    get:
      operationId: getRun
      tags: [runs]
      summary: Read one run — pinned identity, status and honest placement
      description: >
        Both digests, status, `failed_cause`, `paused_reason`, `depth`,
        `parent_run_id`, timing, `expression_evaluations` and the validated
        `inputs`. `worker_affinity` is reported **as a boolean placement view
        only** (`{scheduled, reason}`): worker ids beyond what M3 already
        exposes are not browser knowledge. `queued` with
        `placement.scheduled: false` and reason `volume_affinity_unsatisfied`
        is the honest "waiting for the run's worker" answer (ADR-0023 § 4/§ 5):
        the affinity is a one-way door set by the worker that prepared the
        workspace, and M4 never rebinds, migrates or pretends otherwise.
        Viewer+.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: The run.
          headers:
            X-Communication-Replica:
              $ref: "#/components/headers/XCommunicationReplica"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/runs/{runId}/nodes:
    get:
      operationId: listRunNodes
      tags: [runs]
      summary: Every node execution of a run
      description: >
        One row per node execution, ordered by `node_instance_key`: the path
        identity (`/build_until_verified[2]/review` — node ids plus
        iteration/index suffixes, never a position index, `01` invariant 6),
        the kind verbatim from the catalogue, `execution_location`, status,
        business `outcome`, `error_class`, attempt accounting, `in_flight`
        (fan-out accounting), `waiting_reason`, artifact refs and
        `depends_on`. Control-plane scope nodes additionally carry
        `iterations`/`items`. Viewer+.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Node executions.
          headers:
            X-Communication-Replica:
              $ref: "#/components/headers/XCommunicationReplica"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeExecutionList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/runs/{runId}/nodes/{nodeExecutionId}:
    get:
      operationId: getRunNode
      tags: [runs]
      summary: One node execution with its attempts, checkpoint and outputs
      description: >
        The node execution, its full attempt history (`attempts[]`, append-only
        — a retry never rewrites an earlier attempt, `01`), its checkpoint row
        when one exists, its validated `outputs`, and the CEL envelope the node
        publishes to its scope's bindings: `{status, outcome, outputs,
        artifact_refs}` — the exact object an expression against this node
        reads (ADR-0022 § 3; a skipped or unscheduled node's envelope is
        visible too, which is what makes a `when` decision explainable after
        the fact). Attempts here follow the same field rules as
        `GET /attempts/{attemptId}`: no worker id, no fencing token, no lease
        deadline. Viewer+.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/NodeExecutionId"
      responses:
        "200":
          description: The node execution detail.
          headers:
            X-Communication-Replica:
              $ref: "#/components/headers/XCommunicationReplica"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeExecutionDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/runs/{runId}/tree:
    get:
      operationId: getRunTree
      tags: [runs]
      summary: The child-run tree rooted at this run
      description: >
        `pipeline_invocations` joined to children, recursively, depth-limited
        by the `runs.depth` ceiling (root 0, maximum 2 — a third level is
        refused by both the compiler `child_depth_exceeded` check and a DB
        CHECK). Each node names the `pipeline_invocations` facts (which node
        execution invoked it, its wait policy) beside the child run summary.
        Children under a `detach` wait policy would remain visible even when
        the parent's cancellation does not reach them — M4 refuses `detach` at
        validate time (ADR-0024 § 4), so no M4 tree has one. Viewer+.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: The tree.
          headers:
            X-Communication-Replica:
              $ref: "#/components/headers/XCommunicationReplica"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunTree"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/runs/{runId}/checkpoints:
    get:
      operationId: listRunCheckpoints
      tags: [runs]
      summary: The run's durable boundary records
      description: >
        One record per succeeded worker node execution (`run_checkpoints`):
        `node_instance_key`, inputs/outputs digests, per-repository
        `repo_states` (base/head commits plus the modified-paths artifact) and
        `volume_id`. This is the API answer to "what does a retry inherit?" —
        and, being same-volume records only (D-024 stays **Open**), the honest
        limit of what a retry *can* inherit. Absolute paths are absent by
        design; a `volume_id` (`sha256:<64 hex>`) is the identity M3 already
        defined as honest. Viewer+.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Boundary records, oldest first.
          headers:
            X-Communication-Replica:
              $ref: "#/components/headers/XCommunicationReplica"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunCheckpointList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/runs/{runId}/pause:
    post:
      operationId: pauseRun
      tags: [runs]
      summary: Stop future scheduling (in-flight attempts finish honestly)
      description: >
        Sets `status: paused`, `paused_reason: manual`, and stops the advancer
        *creating new work* (ADR-0023 § 10): live attempts keep their leases
        and report their real outcomes — a pause never rewrites an in-flight
        unit as cancelled. `run.paused` names the `in_flight_attempts[]` that
        continued past the pause. A run that is `waiting_human` (its gate is
        the wait), already `paused`, or terminal is `409`. Contributor+.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: The paused run.
          headers:
            X-Communication-Replica:
              $ref: "#/components/headers/XCommunicationReplica"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/RunConflict"
  /api/v1/runs/{runId}/resume:
    post:
      operationId: resumeRun
      tags: [runs]
      summary: Resume a paused run
      description: >
        `paused → queued`; the advancer re-derives every node's readiness from
        row state (never from a memory), so a resume behaves identically after
        any number of replica restarts (`02` recovery semantics).
        `run.resumed` names the `paused_reason` it cleared — including
        `human_takeover`, which `return-control` clears with the recorded
        intervention as the next attempt's `retry_context` (ADR-0016 § 5,
        unchanged by M4). A non-`paused` run is `409`. Contributor+.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: The resumed run.
          headers:
            X-Communication-Replica:
              $ref: "#/components/headers/XCommunicationReplica"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/RunConflict"
  /api/v1/runs/{runId}/cancel:
    post:
      operationId: cancelRun
      tags: [runs]
      summary: Request cancellation (cascades to child runs)
      description: >
        Sets `cancel_requested_at` and returns; this response is a *request*,
        not proof anything stopped. The advancer cancels `queued`/`ready` rows,
        marks live attempts cancel-requested (the worker closes them under its
        valid fence), and recurses into `pipeline_invocations` children,
        writing `run.cancel_requested` with `cascade: true` and the
        `children[]` ids (ADR-0023 § 10). The run reaches `cancelled` only when
        every branch is terminal, and then `run.cancelled` names the
        `cancelled_node_executions[]` and `cancelled_attempts[]`. An
        already-terminal run is `409`. Contributor+.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "202":
          description: >
            Cancellation requested; the body is the run as it stands, with
            `cancel_requested_at` set.
          headers:
            X-Communication-Replica:
              $ref: "#/components/headers/XCommunicationReplica"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/RunConflict"
  /api/v1/runs/{runId}/retry:
    post:
      operationId: retryRun
      tags: [runs]
      summary: Retry failed, interrupted or cancelled node executions
      description: >
        Targets default to every non-succeeded terminal node execution, or the
        named `node_instance_keys[]`. Scope bookkeeping is recomputed so an
        `until` loop restarts its dead iteration, not the whole loop
        (ADR-0023 § 6). Re-queues attempts carrying `retry_context` (what the
        last attempt knew: attempt number, error class, head commit,
        modified-path count); a node declaring `retry.workspacePolicy:
        restore_checkpoint` additionally requires every repository to be
        committed at that boundary — otherwise `409`
        `checkpoint_unavailable` and *nothing* is reset (a destructive default
        would be a data-loss bug wearing a feature badge, `12` C6d). The
        default policy is `continue_workspace`: the interrupted unit's edits
        stay where they are and the retry is *told* about them. Retry-time
        `inputs` overrides are recorded as run inputs (attempt-level `overrides`
        are visible on the attempt; `run.override.applied` is reserved and not
        emitted, ADR-0024 § 3). `409` `run_not_retriable` on a `running` or
        completed run. Contributor+. Appends `run.retried`.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: "#/components/parameters/RunId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunRetryRequest"
      responses:
        "200":
          description: The run re-queued with its retry attempts.
          headers:
            X-Communication-Replica:
              $ref: "#/components/headers/XCommunicationReplica"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/RunConflict"

  /api/v1/runs/{runId}/events:
    get:
      operationId: streamRunEvents
      tags: [events, runs]
      summary: Stream one run's durable events (SSE)
      description: |
        `text/event-stream` of this run's rows from the `domain_events` journal,
        selected by the `domain_events.run_id` column M4's migration adds (the
        partial index `(run_id, global_seq)`). Framing, `global_seq` resume,
        gap-safety, the `: heartbeat` comment and the `Last-Event-ID`
        beats-`?after=` rule are identical to
        `GET /api/v1/projects/{projectId}/events` (ADR-0014 § 5, § 9).
        Authorization is the run's project membership, re-checked at subscribe
        **and** before each flush (the removed-member rule, unchanged).
        `domain_events.attempt_id` is populated on every worker row so an
        attempt's slice of the stream is derivable from the envelope members
        alone; an attempt-scoped query parameter is a later addition.

        M4 adds the three optional envelope correlation members `run_id`,
        `node_execution_id` and `attempt_id` (additive, ADR-0014 § 8: an
        additive member is not a version bump, and consumers ignore what they
        do not know). The correlation rule, stated once: a worker row that
        touches a node execution sets all three columns (not only the payload
        copies); a control-plane row may carry `node_execution_id` with
        `attempt_id` null, because control-plane work creates no attempts
        (ADR-0023 § 3); reconciler rows are `actor.kind: system`.

        These M4 types also arrive on the project stream (every payload carries
        `project_id`); the run stream is the filtered view. Payload members
        beyond the envelope's own ids (payload structs are one shape for the
        control plane and the worker — `internal/pipelines/events/events.go`
        until the M4 merge into `internal/events/events.go`, member sets pinned
        by `events_test.go`):

        | `type` | `payload` members |
        |---|---|
        | `run.created` | `project_id`, `run_id`, `pipeline_id`, `revision_id`, `revision_digest`, `plan_digest`, `digest_scope`, `assignment_id`, `depth`, `parent_run_id`, `input_names`, `priority` |
        | `run.started` | `project_id`, `run_id`, `worker_affinity_present`, `repo_snapshot` |
        | `run.paused` | `project_id`, `run_id`, `paused_reason`, `in_flight_attempts`, `requested_by` |
        | `run.resumed` | `project_id`, `run_id`, `paused_reason` |
        | `run.waiting_human` | `project_id`, `run_id`, `approval_id`, `node_instance_key`, `deadline_at`, `approver_roles` |
        | `run.retried` | `project_id`, `run_id`, `requested_by`, `targets`, `input_names`, `workspace_policies` |
        | `run.checkpoint_saved` | `project_id`, `run_id`, `checkpoint` |
        | `run.checkpoint_restored` | `project_id`, `run_id`, `node_instance_key`, `from_commit`, `discarded_paths` |
        | `run.completed` | `project_id`, `run_id`, `result_bindings`, `artifact_refs`, `iteration_totals` |
        | `run.failed` | `project_id`, `run_id`, `failed_cause`, `error_class`, `node_instance_key`, `budget`, `evidence_artifacts` |
        | `run.cancel_requested` | `project_id`, `run_id`, `cascade`, `children`, `requested_by` |
        | `run.cancelled` | `project_id`, `run_id`, `cancelled_node_executions`, `cancelled_attempts` |
        | `run.interrupted` | `project_id`, `run_id`, `reason`, `error_class`, `node_instance_keys` |
        | `node.execution_skipped` | `project_id`, `run_id`, `node_instance_key`, `reason` |
        | `node.execution_cancelled` | `project_id`, `run_id`, `node_instance_key`, `reason` |
        | `node.scope.started` | `project_id`, `run_id`, `scope_key`, `node_instance_key`, `kind`, `iteration`, `items` |
        | `node.scope.iteration` | `project_id`, `run_id`, `scope_key`, `node_instance_key`, `iteration`, `items`, `pass_when_result`, `predicate_error_detail` |
        | `node.scope.completed` | `project_id`, `run_id`, `scope_key`, `node_instance_key`, `kind`, `iterations`, `items`, `result_bindings` |
        | `node.scope.failed` | `project_id`, `run_id`, `scope_key`, `node_instance_key`, `kind`, `failed_cause`, `evidence`, `iterations_stopped` |
        | `node.attempt.started` | `project_id`, `run_id`, `node_instance_key`, `attempt_number`, `error_class`, `worker_affinity`, `sandbox_verified`, `session_resumed` |
        | `node.attempt.completed` | `project_id`, `run_id`, `node_instance_key`, `attempt_number`, `outputs_digest`, `outputs`, `artifact_refs`, `checkpoint_saved` |
        | `node.attempt.failed` | `project_id`, `run_id`, `node_instance_key`, `attempt_number`, `error_class`, `detail`, `output_errors`, `next_attempt_number`, `scheduled_at` |
        | `node.attempt.interrupted` | `project_id`, `run_id`, `node_instance_key`, `attempt_number`, `reason` |
        | `node.attempt.cancelled` | `project_id`, `run_id`, `node_instance_key`, `attempt_number`, `reason` |
        | `node.attempt.retry_scheduled` | `project_id`, `run_id`, `node_instance_key`, `attempt_number`, `next_attempt_number`, `error_class`, `delay_seconds`, `scheduled_at` |
        | `approval.requested` | `project_id`, `run_id`, `approval_id`, `node_instance_key`, `summary_digest`, `artifact_refs`, `deadline_at`, `on_timeout`, `approver_roles`, `approver_user_ids` |
        | `approval.decided` | `project_id`, `run_id`, `approval_id`, `decision`, `comments_present`, `version`, `decided_by` |
        | `approval.expired` | `project_id`, `run_id`, `approval_id`, `on_timeout`, `re_requested` |
        | `approval.denied` | `project_id`, `run_id`, `approval_id`, `reason` |
        | `approval.cancelled` | `project_id`, `run_id`, `approval_id`, `reason` |
        | `pipeline.created` | `project_id`, `pipeline_id`, `slug` |
        | `pipeline.draft.updated` | `project_id`, `draft_id`, `version`, `source_sha256`, `edited_by`, `kind` |
        | `pipeline.draft.validated` | `project_id`, `draft_id`, `valid`, `revision_digest`, `plan_digest`, `error_count`, `error_codes` |
        | `pipeline.revision.published` | `project_id`, `pipeline_id`, `revision_id`, `revision_number`, `version_label`, `revision_digest`, `plan_digest`, `digest_scope`, `schema_digest`, `cel_env_digest` |
        | `pipeline.revision.deprecated` | `project_id`, `revision_id`, `revision_digest` |
        | `assignment.created` | `project_id`, `assignment_id`, `pipeline_id`, `pinned_revision_id`, `revision_digest`, `max_concurrent_runs`, `budget_overrides` |
        | `assignment.updated` | `project_id`, `assignment_id`, `pipeline_id`, `pinned_revision_id`, `revision_digest`, `max_concurrent_runs`, `budget_overrides`, `before`, `after` |

        Nested shapes (named here because the payload member is the object's
        name; none of it carries a path, a secret value, a prompt body, a
        fencing token or a lease deadline — the same structural rule M3's
        payload tests pin for its own types):
        `run.checkpoint_saved`'s `checkpoint` is `{node_instance_key,
        inputs_digest, outputs_digest, repo_states, artifact_refs, volume_id}`
        with each `repo_state` `{repository_id, base_commit, head_commit,
        modified_paths_artifact}` — **no paths**, the volume identity is the
        address (D-009's durable boundary, ADR-0023 § 6).
        `approval.requested` carries `summary_digest`, not the summary text:
        a gate summary may embed another node's output, and the journal is
        readable by every project member (`12` C11's vector); the full text is
        a `GET /approvals/{approvalId}` fetch. `pipeline.draft.validated`
        carries codes only (`error_codes`), so the journal records *what*
        failed without cloning the editor's payload; its audit trail for editor
        churn is `pipeline.draft.updated`, which never carries the document
        body either. `run.completed`'s `result_bindings` is the run's
        configured output bindings (`03`); `completed` means the configured
        acceptance passed (`01`), **not** merged. `run.failed`'s `failed_cause`
        names the budget when a budget caused it (`max_duration_exceeded`,
        `node_execution_budget_exceeded`, `child_depth_exceeded`,
        `expression_eval_budget_exceeded`, `run_duration_exceeded`).
        `run.interrupted` is emitted by the reconciler only — never by the dead
        process — with `error_class: workspace_lost` among its arms and no
        auto-retry (case 20's honest arm). `node.attempt.started`'s
        `session_resumed` is the single field M4 claims about session
        behaviour (`continue_live` is refused at validate,
        `unsupported_session_mode`).

        Enumerated values, spelled exactly: `node.execution_skipped`'s `reason`
        is `dependency_skipped`, `condition_default`, `case_not_selected` or
        `for_each_zero_items_body_unreached` (03's zero-item edge case emits
        `node.scope.completed` with `items: 0`, not a skip);
        `node.execution_cancelled`'s `reason` is `cascade`,
        `on_child_failure_stop` or `run_cancelled`; `node.scope.failed`'s
        `failed_cause` is `until_exhausted`, `child_failed`, `predicate_error`
        or `child_run_failed` — an *indeterminate* predicate is a
        `predicate_error` that fails the scope at once, never counted as false
        (ADR-0022 § 3; cost exhaustion reports the class
        `predicate_error` with the code `predicate_cost_exceeded`, one event,
        two names, § 6); `node.attempt.interrupted`'s `reason` is
        `lease_expired`, `worker_gone`, `worker_shutdown`,
        `process_group_kill_timeout` or `human_takeover` — reconciler rows for
        the first two, the worker closing its own attempt honestly for the last
        three, and never a claim of resume-without-loss;
        `node.attempt.cancelled`'s `reason` is `acp_cancel_ack`,
        `process_group_terminated` or `before_claim`; every `error_class`
        member carries ADR-0023 § 7's enum (`infra`, `interrupted`, `timeout`,
        `agent_error`, `invalid_output`, `predicate_error`,
        `sandbox_enforcement_failed`, `workspace_lost`, `binding_error`,
        `approval_expired`, `cancelled`); `approval.denied`'s `reason` is
        `approver_lost_access`, `not_a_designated_approver`, `already_decided`
        or `run_terminal`; `approval.cancelled`'s is `run_cancelled` or
        `superseded`; `on_timeout` is `fail`, `cancel_run` or `expire` (where
        `expire` re-requests exactly once, `re_requested` marks the second
        gate). CEL failure text enters the journal only as
        `predicate_error_detail`, truncated to 512 bytes and
        redaction-scanned (ADR-0022 Security).

        `run.override.applied` is **reserved and NOT emitted** by M4
        (ADR-0024 § 3): the name is fixed here so M5 can land it without
        renaming the wire; an M4 journal never carries it. M4's overrides are
        visible on the attempt row (`overrides`) and in `run.retried`.

        The types reused unchanged from M2/M3 arrive on this stream too when
        their correlation ids name the run — `conversation.*` and
        `agent.session.*` (an `agent.acp` attempt owns a conversation and a
        turn), `workspace.prepared|committed|quarantined|released|recovery_lost`
        (now with `scope_kind: run`), `sandbox.verified`,
        `sandbox.enforcement_failed`, `secret.materialized|removed|
        materialization_failed` (the `lifecycle: node_attempt` arm ADR-0018
        reserved), `artifact.created|deleted`, `repository.mirror_updated` —
        and M4 adds no payload member to any of them. Their vocabularies are
        documented on the project and conversation streams.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/LastEventId"
        - $ref: "#/components/parameters/After"
      responses:
        "200":
          description: >
            An open `text/event-stream` of event envelopes; the stream does not
            terminate on its own.
          headers:
            X-Communication-Replica:
              $ref: "#/components/headers/XCommunicationReplica"
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/EventEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /api/v1/attempts/{attemptId}:
    get:
      operationId: getAttempt
      tags: [runs]
      summary: Read one attempt's execution record
      description: >
        Status, `error_class`, the bounded (≤ 512 bytes, redaction-scanned)
        `detail`, `output_errors` (the `invalid_output` evidence: one unit per
        schema violation), `scheduled_at` — the *computed* backoff landing time,
        which is what makes a retry's promise durable rather than a memory —
        `deadline_at` (the node's `timeoutSeconds`), `overrides`,
        `retry_context` (what the previous attempt knew: attempt number, error
        class, head commit, modified-path count), artifact refs, and the
        conversation/turn pair an `agent.acp` attempt owns (both null until the
        attempt claims one; `attempts_agent_turn_pair` makes half a pair
        unrepresentable). **Never** `worker_id`, `fencing_token` or
        `lease_expires_at`: lease machinery is asserted server-side and a
        browser cannot participate in lease arbitration (ADR-0016 § 8,
        unchanged). Viewer+.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/AttemptId"
      responses:
        "200":
          description: The attempt.
          headers:
            X-Communication-Replica:
              $ref: "#/components/headers/XCommunicationReplica"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attempt"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  # -------------------------------------------------- M4: approvals ---------
  /api/v1/projects/{projectId}/approvals:
    get:
      operationId: listProjectApprovals
      tags: [approvals]
      summary: Pending and decided gates for the project's runs
      description: >
        The UI's "needs attention" list: pending gates first, ordered by
        `deadline_at` (the one about to expire is the urgent one), then decided
        history newest first. These are the durable pipeline gates
        (`approval_requests`), *not* the ACP permission prompts of M2
        (`permission_requests`): different table, different authorizer,
        different CAS (ADR-0023 § 9 keeps the two names apart on purpose).
        Viewer+.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Gates.
          headers:
            X-Communication-Replica:
              $ref: "#/components/headers/XCommunicationReplica"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/approvals/{approvalId}:
    get:
      operationId: getApproval
      tags: [approvals]
      summary: Read one gate
      description: >
        The summary in full (this route is the evidence surface; the journal
        only carries its digest), artifact refs, designated roles and user ids,
        deadline, `on_timeout`, `state`, the decision when one exists, and the
        CAS `version` a `decide` must echo. Authorized through the gate's own
        project: a gate of a project the caller cannot see is `404`. Viewer+.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ApprovalId"
      responses:
        "200":
          description: The gate.
          headers:
            X-Communication-Replica:
              $ref: "#/components/headers/XCommunicationReplica"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Approval"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/approvals/{approvalId}/decide:
    post:
      operationId: decideApproval
      tags: [approvals]
      summary: Decide a gate (authorized at decision time, CAS)
      description: >
        `{decision: approved|rejected, comments?, version}` with `version`
        equal to the gate's current `version`. Two rules make this the `12`
        case 9 route:

        * **Authorization is evaluated now, not at gate creation.** The caller
          must be named in `approver_user_ids` or hold one of the
          `approver_roles` in the gate's project *at this moment*; a decider
          who lost access gets `403`/`409` plus `approval.denied`
          (`reason: approver_lost_access`) and the gate stays `pending` — a
          refusal is not a decision, and a stale grant cannot decide anything
          (ADR-0023 § 9).
        * **Exactly one decision.** A CAS miss or an already-decided gate is
          `409` `approval_already_decided` carrying the winner's decision,
          decider and version: two maintainers clicking at once produce one
          `200` (`approvals_decided_consistency` makes the second decision
          unrepresentable, `version` increments once).

        A **rejection is a business outcome, not an execution failure**: the
        node goes `succeeded` with `outputs.decision = rejected` and
        `comments_present`, and downstream `when`/`passWhen` expressions read
        it — `03`'s success/fail split applied to gates. Only a **timeout** is
        the execution-side failure (`error_class: approval_expired`,
        reconciler pass 2, honouring `on_timeout`; `expire` re-requests exactly
        once). `comments` is ≤ 8 KiB and never enters the journal —
        `approval.decided` reports `comments_present` instead. A gate whose run
        went terminal is `409` with `approval.denied` (`run_terminal`).
        Designated approvers only (`01` matrix); CSRF and origin rules as
        everywhere.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: "#/components/parameters/ApprovalId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalDecide"
      responses:
        "200":
          description: >
            Decision recorded; the body is the gate at its new `version`. The
            run leaves `waiting_human` through the advancer, not in this
            response.
          headers:
            X-Communication-Replica:
              $ref: "#/components/headers/XCommunicationReplica"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Approval"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ApprovalConflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  # ------------------------------------------------- M4: scheduler ops ------
  /api/v1/system/scheduler:
    get:
      operationId: getSystemScheduler
      tags: [system, runs]
      summary: Scheduler and engine counters for the ops page
      description: >
        The counters ADR-0023 Consequences names, so "is the engine wedged?" is
        answerable without reading code: attempts by status, the age of the
        oldest `queued` attempt, observed lease expirations, the deepest retry
        loop in flight, pending gates, `queued_unbindable_runs` (§ 5.2's honest
        "waiting for the run's worker" count) and per-worker `active_attempts`
        against `capacity`. Session required, no membership check — this
        matches `GET /api/v1/workers`: an operator has to see the queue before
        anyone trusts it. No prompt text and no secret material in any field
        (`02` Observability).
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Scheduler counters.
          headers:
            X-Communication-Replica:
              $ref: "#/components/headers/XCommunicationReplica"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchedulerStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: communication_session
      description: |
        Session cookie issued by `GET /auth/callback`: a random 32-byte token, of
        which Postgres stores only the SHA-256 (`sessions.token_hash`). HttpOnly,
        SameSite=Lax, Path=/, `Secure` per `COMMUNICATION_COOKIE_SECURE`, 12 h
        expiry, renewed on use. Reads require this cookie only.
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: |
        Double-submit token: the `csrf_token` from `GET /api/v1/me`, echoed by the
        UI on every `POST`/`PUT`/`DELETE`. Required together with `sessionCookie`
        for all mutations; a missing or mismatched token is `403`. If the request
        carries an `Origin` header it must match `COMMUNICATION_PUBLIC_URL`'s origin
        or the request's own scheme+host.
  headers:
    XCommunicationReplica:
      description: |
        Name of the `serve` replica that produced this response
        (`COMMUNICATION_REPLICA_NAME`, defaulting to the hostname). Present on
        every response; the M1 acceptance check and the UI's `/ops` page use it to
        confirm that state is consistent across replicas behind the load balancer.
      required: false
      schema:
        type: string
  parameters:
    ReturnTo:
      name: return_to
      in: query
      required: false
      description: >
        Same-origin relative path to resume after login (must start with `/` and
        not with `//`). Anything else is treated as `/`.
      schema:
        type: string
        default: /
        examples:
          - /
          - /projects/01987a6c-4d5e-7f1a-9b2c-3d4e5f6a7b80
    ProjectId:
      name: projectId
      in: path
      required: true
      description: >
        Project id (`uuid`). Project-scoped access is checked server-side on every
        request; a non-member who is not an organization admin receives `404`.
      schema:
        type: string
        format: uuid
        pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$"
    UserId:
      name: userId
      in: path
      required: true
      description: >
        Target user id (`uuid`), which must belong to the caller's organization.
      schema:
        type: string
        format: uuid
        pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$"
    ConversationId:
      name: conversationId
      in: path
      required: true
      description: >
        Conversation id (`uuid`). Conversation routes are not nested under a
        project: the conversation's own project membership is the authorization
        scope, checked on every request, and a caller outside that project gets
        `404` so existence is not disclosed.
      schema:
        type: string
        format: uuid
        pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$"
    PermissionRequestId:
      name: requestId
      in: path
      required: true
      description: >
        Permission prompt id (`uuid`) — the `permission_request_id` from
        `conversation.permission.requested`, i.e. the `permission_requests` row
        id. Not the ACP JSON-RPC request id, which never leaves the worker.
      schema:
        type: string
        format: uuid
        pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$"
    LastEventId:
      name: Last-Event-ID
      in: header
      required: false
      description: >
        Last event `global_seq` the client processed, sent automatically by
        `EventSource` on reconnect. Events with `global_seq` strictly greater than
        this are replayed before the stream goes live.
      schema:
        type: integer
        format: int64
        minimum: 0
    After:
      name: after
      in: query
      required: false
      description: >
        Explicit resume cursor for clients that do not send `Last-Event-ID` (the UI
        records the last `global_seq` it rendered). Events with `global_seq`
        strictly greater than this are replayed.
      schema:
        type: integer
        format: int64
        minimum: 0
    SecretId:
      name: secretId
      in: path
      required: true
      description: >
        A `secret_metadata` id. Resolved through the project in the path: a
        secret belonging to another project is `404`, identical byte-for-byte to
        a random uuid (`09`: existence is project-scoped information).
      schema:
        type: string
        format: uuid
    SecretMountId:
      name: mountId
      in: path
      required: true
      description: A `secret_mounts` declaration id, scoped to the project in the path.
      schema:
        type: string
        format: uuid
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      description: >
        A `workspaces` id. Authorization runs through the workspace's own
        `project_id`, so a workspace of a project the caller cannot see is `404`.
      schema:
        type: string
        format: uuid
    RepositoryId:
      name: repositoryId
      in: path
      required: true
      description: A `repositories` id belonging to the same project as the workspace.
      schema:
        type: string
        format: uuid
    TurnId:
      name: turnId
      in: path
      required: true
      description: >
        A `conversation_turns` id. Authorized through turn -> conversation ->
        project, never through the worker that ran it (`09`: no accidental
        worker-service surface).
      schema:
        type: string
        format: uuid
    ArtifactId:
      name: artifactId
      in: path
      required: true
      description: >
        An `artifacts` id. Sensitivity gates the bytes, not just the row: see
        `ADR-0020` D3's table.
      schema:
        type: string
        format: uuid
    ProfileId:
      name: profileId
      in: path
      required: true
      description: >
        An `agent_profiles` id. Profiles are organization-scoped, so a profile
        of another organization is `404` — never a peek (ADR-0014 §3). A member
        of the *same* organization who lacks the library role gets `403`, because
        the row is already list-visible to them and role is not existence
        information.
      schema:
        type: string
        format: uuid
    PipelineId:
      name: pipelineId
      in: path
      required: true
      description: >
        A `pipelines` id. Pipelines are organization-scoped: a definition of
        another organization is `404`, never `403`, so library existence is
        not disclosed across tenants.
      schema:
        type: string
        format: uuid
    DraftId:
      name: draftId
      in: path
      required: true
      description: >
        A `pipeline_drafts` id. Authorization resolves through the draft's
        pipeline and its organization (contributor+ of that organization's
        library surface).
      schema:
        type: string
        format: uuid
    RevisionDigestOrId:
      name: digestOrId
      in: path
      required: true
      description: >
        Either a `pipeline_revisions` id (`uuid`) or its `revision_digest`
        (`sha256:<64 hex>`). A digest belonging to another organization is
        `404`, byte-identical to an unknown one.
      schema:
        type: string
        pattern: "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}|sha256:[0-9a-f]{64})$"
    RevisionId:
      name: revisionId
      in: path
      required: true
      description: >
        A `pipeline_revisions` id. Revisions have no mutation route except
        `deprecate`; the document itself is immutable forever (ADR-0002).
      schema:
        type: string
        format: uuid
    AssignmentId:
      name: assignmentId
      in: path
      required: true
      description: >
        An `assignments` id. Authorization runs through the assignment's own
        `project_id` (maintainer+); an assignment of another project is `404`.
      schema:
        type: string
        format: uuid
    ScheduleId:
      name: scheduleId
      in: path
      required: true
      description: >
        A `schedules` id. Authorization runs through the schedule's owning
        project (read viewer+, edit maintainer+); a schedule of another
        project is `404` (ADR-0032).
      schema:
        type: string
        format: uuid
    RunId:
      name: runId
      in: path
      required: true
      description: >
        A `runs` id, root or child. Authorized through the run's own
        `project_id` — a child run's project always equals its parent's, so
        one predicate covers the whole tree. `404` from outside it.
      schema:
        type: string
        format: uuid
    NodeExecutionId:
      name: nodeExecutionId
      in: path
      required: true
      description: >
        A `node_executions` id. The run id in the path is checked to own this
        node execution (`node_executions_run_matches`), so a cross-run pairing
        is `404`, never a leak.
      schema:
        type: string
        format: uuid
    AttemptId:
      name: attemptId
      in: path
      required: true
      description: >
        An `attempts` id. Authorized through attempt -> node execution -> run
        -> project, never through the worker that ran it (`09`: no accidental
        worker-service surface).
      schema:
        type: string
        format: uuid
    ApprovalId:
      name: approvalId
      in: path
      required: true
      description: >
        An `approval_requests` (pipeline gate) id. Not a M2
        `permission_requests` id — the two never share a route.
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >
        `POST /projects/{projectId}/runs` only (ADR-0023 § 12): an opaque key
        matching `^[A-Za-z0-9._-]{1,128}$`. The server stores
        `(project_id, key) -> (run_id, request_sha256)` for 24 h. Re-sending
        the same key with the same request body re-answers `200` with the
        stored run (a retried click is not a second run — `12` case 1); the
        same key with a different body is `409` `idempotency_key_mismatch`,
        never an update of the mapping. The body's `idempotency` member is the
        same mechanism for clients that cannot set headers; the header wins
        when both are present.
      schema:
        type: string
        pattern: "^[A-Za-z0-9._-]{1,128}$"
  responses:
    BadRequest:
      description: >
        The request body is structurally fine JSON but names something this
        endpoint refuses — the case that matters here is a `PUT` to
        `/secrets/{secretId}` carrying `value`: rotation is a different verb
        (`POST /secrets/{secretId}/versions`), and silently ignoring a field that
        was meant to change a secret would turn a mistaken request into a silent
        no-op.
      headers:
        X-Communication-Replica:
          $ref: "#/components/headers/XCommunicationReplica"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://communication.dev/errors/value-not-updatable
            title: Secret value is not updatable here
            status: 400
            detail: Rotate with POST /secrets/{secretId}/versions.
    Unauthorized:
      description: >
        No valid `communication_session` cookie (missing, expired, or deleted
        server-side). The UI redirects to `/login`.
      headers:
        X-Communication-Replica:
          $ref: "#/components/headers/XCommunicationReplica"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://communication.dev/errors/unauthenticated
            title: Unauthenticated
            status: 401
            detail: No valid session cookie.
    Forbidden:
      description: >
        Authenticated but not allowed to perform this operation: `X-CSRF-Token`
        missing or wrong, a mismatched `Origin`, or a role that is too low for a
        maintainer-only mutation. Note that being *outside* a project is `404`, not
        `403`, to avoid leaking project existence.
      headers:
        X-Communication-Replica:
          $ref: "#/components/headers/XCommunicationReplica"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://communication.dev/errors/csrf-token-invalid
            title: CSRF token invalid
            status: 403
            detail: X-CSRF-Token does not match the session.
    NotFound:
      description: >
        The resource does not exist, or the caller is not a member of the project
        (returned as `404` so that project existence is not disclosed to
        non-members). A denied attempt writes an `audit_events` row with outcome
        `denied`.
      headers:
        X-Communication-Replica:
          $ref: "#/components/headers/XCommunicationReplica"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://communication.dev/errors/not-found
            title: Not found
            status: 404
            detail: No such project.
    Conflict:
      description: >
        The request collides with an existing unique constraint — a duplicate
        project `slug` within the organization, or a duplicate repository `name`
        within the project.
      headers:
        X-Communication-Replica:
          $ref: "#/components/headers/XCommunicationReplica"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://communication.dev/errors/slug-taken
            title: Slug already taken
            status: 409
            detail: An organization project with slug "widgets" already exists.
    ConversationConflict:
      description: >
        The request conflicts with the conversation's current state, and the
        body says what that state is so the client can recover without guessing:
        a stale CAS `version` (`https://communication.dev/errors/control-version-
        stale`), a caller who is not the controller (`.../not-controller`), a
        turn already in flight (`.../turn-in-progress`), no active turn to cancel
        (`.../no-active-turn`), or a prompt that is no longer pending
        (`.../permission-not-pending`). `control` is always the current control
        row, so exactly one of two racing `take-control` callers sees the winner
        instead of a bare failure (communication-spec/06 edge cases, ADR-0016).
      headers:
        X-Communication-Replica:
          $ref: "#/components/headers/XCommunicationReplica"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ConversationConflictProblem"
          example:
            type: https://communication.dev/errors/control-version-stale
            title: Control version stale
            status: 409
            detail: conversation_control.version is 7, not 5.
            conversation_id: 01987a70-1111-7000-8000-abcdef012345
            control:
              kind: human
              user_id: 01987a62-2345-7000-8000-abcdef012345
              display_name: Dana Observer
              previous_user_id: 01987a61-2345-7000-8000-abcdef012345
              version: 7
    UnprocessableEntity:
      description: >
        The request body is well-formed JSON but fails validation: missing or empty
        required field, an invalid slug, an unsupported `git_url` scheme, or an
        unknown role.
      headers:
        X-Communication-Replica:
          $ref: "#/components/headers/XCommunicationReplica"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://communication.dev/errors/validation-failed
            title: Validation failed
            status: 422
            detail: "git_url must be https://, ssh://, git@host:path or file://."
    AgentProfileAPMProblem:
      description: >
        `422` on an agent-profile write: a well-formed body the contract or the
        columns refuse. The `code` member is the machine-readable half and is
        stable; the `detail` prose beside it is not. Codes (ADR-0030):
        `apm_pin_incomplete` (the three APM members were not set or cleared
        together), `apm_package_ref_invalid` (not an apm git dependency string
        with a `#<ref>`), `apm_target_invalid` (not `claude`/`codex`),
        `apm_lock_digest_invalid` (not `sha256:<64 lowercase hex>`),
        `profile_name_invalid`, `launcher_id_invalid`. Adding a code is
        additive; renaming one is not.
      headers:
        X-Communication-Replica:
          $ref: "#/components/headers/XCommunicationReplica"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/AgentProfileProblem"
          example:
            type: https://communication.dev/errors/apm_pin_incomplete
            title: Incomplete APM Pin
            status: 422
            detail: "apm_package_ref, apm_target and apm_lock_digest must be set together, or all three cleared to remove the pin."
            code: apm_pin_incomplete
    ServiceUnavailable:
      description: >
        The replica cannot serve the request: Postgres is unreachable, or its
        schema version is older than the binary expects. Retrying a different
        replica may succeed.
      headers:
        X-Communication-Replica:
          $ref: "#/components/headers/XCommunicationReplica"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://communication.dev/errors/not-ready
            title: Not ready
            status: 503
            detail: "schema version 0 is older than expected 1."
    DraftConflict:
      description: >
        `409` for a draft route, and the body says what the draft is now so
        the editor can recover without guessing: `stale_draft_version` (a
        concurrent writer won; `current_version` is the winner's),
        `draft_changed_since_validation` (the document's `source_sha256` no
        longer matches the one the stored `validation` was produced against —
        revalidate, publish never silently revalidates), `draft_not_valid`, or
        `revision_already_published` (`existing_revision_id` names the live
        revision whose `revision_digest` this document collides with,
        `UNIQUE (organization_id, revision_digest)`).
      headers:
        X-Communication-Replica:
          $ref: "#/components/headers/XCommunicationReplica"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/DraftConflictProblem"
          example:
            type: https://communication.dev/errors/stale-draft-version
            title: Draft version stale
            status: 409
            detail: "draft version is 8, not 5."
            draft_id: 01987a80-1111-7000-8000-abcdef012345
            current_version: 8
    RunConflict:
      description: >
        `409` for a run action: `run_not_retriable` (the run is `running` or
        ended successfully — a completed run has nothing to retry), an
        `idempotency_key_mismatch` on create, `checkpoint_unavailable` on retry
        (the node declares `restore_checkpoint` but a repository is not
        committed at that boundary — and nothing was reset), or a pause/resume/
        cancel against a run whose state refuses the transition.
      headers:
        X-Communication-Replica:
          $ref: "#/components/headers/XCommunicationReplica"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/RunConflictProblem"
          example:
            type: https://communication.dev/errors/checkpoint-unavailable
            title: Checkpoint unavailable
            status: 409
            detail: "/implement declares restore_checkpoint but app is dirty at the boundary."
            run_id: 01987a81-2222-7000-8000-abcdef012345
            run_status: failed
    ApprovalConflict:
      description: >
        `409` for `POST /approvals/{approvalId}/decide`: the gate is already
        decided (`approval_already_decided`) or a CAS `version` miss — and the
        body carries the *winner*, so the loser's UI shows who decided and at
        which version instead of guessing. Also the arm for an approver whose
        access was revoked between gate-open and decision (with
        `approval.denied`, `reason: approver_lost_access`); the gate stays
        `pending` in that case.
      headers:
        X-Communication-Replica:
          $ref: "#/components/headers/XCommunicationReplica"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ApprovalConflictProblem"
          example:
            type: https://communication.dev/errors/approval-already-decided
            title: Approval already decided
            status: 409
            detail: "carol decided approved at version 2."
            approval_id: 01987a82-3333-7000-8000-abcdef012345
            approval:
              state: decided
              decision: approved
              decided_by: 01987a63-3333-7000-8000-abcdef012345
              version: 2
    PublishUnprocessable:
      description: >
        `422` for `POST /drafts/{draftId}/publish`: the document would publish
        except for a blocking validation class — today that means a
        `secret_literal_detected` (ADR-0021 Security / `01` invariant 5: the
        compiler-side detector, a block not a warning, and the response body
        **redacts the value** — it names the location and the shape, never the
        literal). The `errors[]` units are the § 2.2 shape; the envelope path
        of ADR-0018 stays the only place a value is ever held.
      headers:
        X-Communication-Replica:
          $ref: "#/components/headers/XCommunicationReplica"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://communication.dev/errors/secret-literal-detected
            title: Secret literal detected
            status: 422
            detail: "a secret-shaped literal sits at /spec/nodes/2/config/prompt; move it to a secret reference."
    ValidateFailed:
      description: >
        `422` on run creation: the submitted `inputs` failed validation against
        the pinned revision's `spec.inputs`. The body reuses the § 2.2 shape —
        same `errors[]` units with machine-readable `instance_location`s — so
        one editor component renders both.
      headers:
        X-Communication-Replica:
          $ref: "#/components/headers/XCommunicationReplica"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ValidateProblem"
          example:
            type: https://communication.dev/errors/validation-failed
            title: Run inputs invalid
            status: 422
            detail: "input goal is required."
            valid: false
            errors:
              - code: type_mismatch
                source: schema
                message: input goal expects a string
                instance_location: /inputs/goal
                schema_location: /spec/inputs/1/schema/type
                hint: got null, want string
  schemas:
    Problem:
      title: Problem
      description: >
        Error body in the `application/problem+json` shape (RFC 9457-compatible).
        `type` is a stable URI that clients may switch on; `title` is a short
        constant summary; `detail` is human-readable and may change.
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
          description: Stable error identifier, e.g. `https://communication.dev/errors/not-found`.
        title:
          type: string
          description: Short human-readable summary, stable per error type.
        status:
          type: integer
          minimum: 400
          maximum: 599
          description: HTTP status code, identical to the response status.
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence.
    Me:
      title: Me
      description: The signed-in principal plus the CSRF token required by mutations.
      type: object
      required: [id, display_name, email, is_org_admin, organization, csrf_token]
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: string
        email:
          type: ["string", "null"]
          description: From the OIDC `email` claim; null when the provider did not supply it.
        is_org_admin:
          type: boolean
        organization:
          $ref: "#/components/schemas/Organization"
        csrf_token:
          type: string
          description: Send back as the `X-CSRF-Token` header on every mutation.
    Organization:
      title: Organization
      type: object
      required: [id, slug, name]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
          description: M1 seeds a single organization with slug `default`.
        name:
          type: string
    User:
      title: User
      description: An organization member as listed in the user directory.
      type: object
      required: [id, display_name, email]
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: string
        email:
          type: ["string", "null"]
    Project:
      title: Project
      description: >
        A project. `version` increments on every project mutation and is the
        conditional-update token for later milestones.
      type: object
      required: [id, slug, name, description, created_at, version, my_role]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
          pattern: "^[a-z0-9]([a-z0-9-]{0,38}[a-z0-9])?$"
          maxLength: 40
          description: >
            Lowercase `[a-z0-9-]`, at most 40 characters, starting and ending
            with an alphanumeric character. `createProject` enforces the same
            rule for an explicit slug and for the one it derives from `name`.
        name:
          type: string
          maxLength: 200
          description: >
            As supplied to `createProject`, which accepts at most 200 characters
            (longer is `422`).
        description:
          type: string
        created_at:
          type: string
          format: date-time
        version:
          type: integer
          minimum: 1
        my_role:
          type: string
          enum: [maintainer, contributor, viewer]
          description: >
            The caller's role in this project. Organization admins who hold no
            explicit membership are reported as `maintainer`.
      example:
        id: 01987a6c-4d5e-7f1a-9b2c-3d4e5f6a7b80
        slug: widgets
        name: Widgets
        description: Widget incubator
        created_at: "2026-10-14T18:00:00Z"
        version: 1
        my_role: maintainer
    ProjectCreate:
      title: ProjectCreate
      description: Request body for creating a project.
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: >
            At most 200 characters; longer is `422`. An all-whitespace name is
            `422` as well, because it is stored trimmed of surrounding space.
        slug:
          type: string
          pattern: "^[a-z0-9]([a-z0-9-]{0,38}[a-z0-9])?$"
          maxLength: 40
          description: >
            Optional; derived from `name` when absent (lowercase, `[a-z0-9-]`,
            collapsed and trimmed to at most 40 characters). A slug is at most
            40 characters and never begins or ends with a hyphen; anything
            else is `422`. Duplicate slugs in the organization are `409`.
        description:
          type: string
          maxLength: 2000
    Repository:
      title: Repository
      type: object
      required: [id, project_id, name, git_url, default_branch, created_at]
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        name:
          type: string
          pattern: "^[A-Za-z0-9._-]{1,100}$"
          maxLength: 100
          description: >
            Unique within the project. It also names the repository's checkout
            directory under a run workspace (`repos/<name>`,
            communication-spec/05-workspaces-security-secrets.md), so it is a
            single filename-safe path component: `[A-Za-z0-9._-]`, at most 100
            characters, and never `.` or `..`.
        git_url:
          type: string
          description: Remote URL as stored; see `RepositoryCreate.git_url` for the accepted forms.
        default_branch:
          type: string
        created_at:
          type: string
          format: date-time
      example:
        id: 01987a6f-7a8b-7c9d-a0e1-f2b3c4d5e6f0
        project_id: 01987a6c-4d5e-7f1a-9b2c-3d4e5f6a7b80
        name: communication
        git_url: https://github.com/example/communication.git
        default_branch: main
        created_at: "2026-10-14T18:00:00Z"
    RepositoryCreate:
      title: RepositoryCreate
      description: Request body for adding a repository to a project.
      type: object
      required: [name, git_url]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          pattern: "^[A-Za-z0-9._-]{1,100}$"
          description: >
            Unique within the project; a duplicate is `409`. Filename-safe
            (`[A-Za-z0-9._-]`) because it names a workspace directory; anything
            else, including `.` and `..`, is `422`.
        git_url:
          type: string
          pattern: "^((https|ssh)://[^/\\s]+/.+|file:///[^\\s]+|git@[^:/\\s]+:.+)$"
          description: >
            One of `https://host/path`, `ssh://[user@]host[:port]/path`,
            `git@host:path` or `file:///absolute/path`. Anything else is `422`.
        default_branch:
          type: string
          minLength: 1
          maxLength: 200
          default: main
    Member:
      title: Member
      description: A project membership with the member's display name resolved.
      type: object
      required: [user_id, display_name, role]
      properties:
        user_id:
          type: string
          format: uuid
        display_name:
          type: string
        role:
          type: string
          enum: [maintainer, contributor, viewer]
          description: >
            maintainer = everything in M1 (including adding repositories and
            members); contributor and viewer are read-only.
    MemberPut:
      title: MemberPut
      description: Request body for setting a member's role.
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [maintainer, contributor, viewer]
    Worker:
      title: Worker
      type: object
      required: [id, name, hostname, version, status, started_at, last_heartbeat_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: Unique worker name.
        hostname:
          type: string
        version:
          type: string
          description: Worker build version.
        status:
          type: string
          enum: [online, draining, offline]
        started_at:
          type: string
          format: date-time
        last_heartbeat_at:
          type: string
          format: date-time
    Health:
      title: Health
      description: Liveness plus replica identity; does not touch the database.
      type: object
      required: [status, replica, version]
      properties:
        status:
          type: string
          enum: [ok]
        replica:
          type: string
          description: >
            `COMMUNICATION_REPLICA_NAME` (default hostname); same value as the
            `X-Communication-Replica` response header.
        version:
          type: string
          description: Build version of this replica.
    Readiness:
      title: Readiness
      description: >
        Database reachability and migration currency. `503` (a `Problem`, not this
        schema) when Postgres is unreachable or `schema_version` is below
        `expected_schema_version`.
      type: object
      required: [status, schema_version, expected_schema_version]
      properties:
        status:
          type: string
          enum: [ready]
        schema_version:
          type: integer
          minimum: 0
          description: Highest applied migration version in this database.
        expected_schema_version:
          type: integer
          minimum: 0
          description: Migration version this binary requires.
    ProjectList:
      title: ProjectList
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Project"
    RepositoryList:
      title: RepositoryList
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Repository"
    GitHubIssue:
      title: GitHubIssue
      type: object
      required: [number, title, body, labels, html_url, state, updated_at, body_truncated]
      properties:
        number:
          type: integer
          description: GitHub issue number, unique within the repository.
        title:
          type: string
        body:
          type: string
          description: >
            Issue body as GitHub returned it, truncated to 4000 bytes on a
            rune boundary; `body_truncated` says whether that happened. May
            be empty.
        labels:
          type: array
          items:
            type: string
          description: Label names; GitHub's own `labels[].name`.
        html_url:
          type: string
          format: uri
          description: GitHub's URL for the issue — the link to open the tracker entry.
        state:
          type: string
          enum: [open, closed]
        updated_at:
          type: string
          format: date-time
          description: GitHub's `updated_at`, not our read time.
        body_truncated:
          type: boolean
    GitHubIssueList:
      title: GitHubIssueList
      type: object
      required: [repository, state, items]
      properties:
        repository:
          type: string
          description: >
            The `owner/repo` the upstream call addressed, echoed so a client
            can confirm which remote a `git_url` resolved to.
          example: octo/widgets
        state:
          type: string
          enum: [open, closed, all]
          description: The effective state filter (defaults to `open`).
        label:
          type: string
          description: The label filter, when one was given.
        items:
          type: array
          items:
            $ref: "#/components/schemas/GitHubIssue"
          description: >
            Pull requests are excluded (GitHub's issues endpoint returns
            them); at most `per_page=50` newest-first issues per call, no
            pagination surface yet.
    MemberList:
      title: MemberList
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Member"
    UserList:
      title: UserList
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/User"
    WorkerList:
      title: WorkerList
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Worker"
    AgentProfile:
      title: AgentProfile
      description: >
        A launchable agent configuration (`agent_profiles`). `launcher_id` is a
        key into the agent launcher registry, not a promise that the harness
        works on this host — capability evidence lives in
        `docs/compatibility/ACP.md`.
      type: object
      required: [id, name, launcher_id, permission_mode, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 200
          description: Unique within the organization.
        launcher_id:
          type: string
          pattern: "^[a-z0-9][a-z0-9_-]{0,63}$"
          description: >
            Registry id (M2 seeds `claude` and `codex`) — the executable argv
            the worker spawns, no shell expansion.
        permission_mode:
          type: string
          enum: [ask, preapproved_within_sandbox, deny]
          description: >
            `ask` sends every ACP permission prompt to the current controller.
            `preapproved_within_sandbox` may only be set once an enforced
            sandbox is verified for that launcher (`04` "Permission policy",
            ADR-0009); both M2 seeds are `ask`. `deny` rejects prompts outright.
        created_at:
          type: string
          format: date-time
        apm_package_ref:
          type: ["string", "null"]
          description: >
            An apm git dependency string, pinned: `<owner>/<repo>[/<skill
            subdirectory>][#<tag|branch|commit>]` — e.g.
            `mattpocock/skills#v1.3.1`, or
            `mattpocock/skills/skills/engineering/ask-matt#v1.3.1` for one skill
            out of a multi-skill repo (`docs/compatibility/APM.md`, T-tag-5). The
            `#<ref>` is required: without it apm resolves the default branch,
            which is not a pin anything downstream can check. Null when this
            profile stages no packaged context.
        apm_target:
          type: ["string", "null"]
          enum: [claude, codex, null]
          description: >
            The APM install target the digest below was recorded for. apm keeps
            one `apm.lock.yaml` per checkout and *moving* to a second target
            changes that digest (APM.md probe A3), so a digest is meaningful only
            per target — and per launch that means one launcher, one harness.
        apm_lock_digest:
          type: ["string", "null"]
          pattern: "^sha256:[0-9a-f]{64}$"
          description: >
            `sha256` of the `apm.lock.yaml` the operator recorded after a real
            `apm install`. `internal/agent/apm` re-computes it before every
            launch and **refuses the launch** on a mismatch — the control that
            probe A5 proved `--frozen` is not. Set with the other two members or
            not at all: a ref with no digest is refused at the API
            (`apm_pin_incomplete`) and again at the worker. Null means "stages
            nothing", not "unknown".
      example:
        id: 01987a71-2222-7000-8000-abcdef012345
        name: Claude Code
        launcher_id: claude
        permission_mode: ask
        created_at: "2026-10-14T18:00:00Z"
        apm_package_ref: mattpocock/skills#v1.3.1
        apm_target: claude
        apm_lock_digest: sha256:127ccf2b000000000000000000000000000000000000000000000000000000ab
    AgentProfileCreate:
      title: AgentProfileCreate
      description: >
        POST /api/v1/agent-profiles. Two fields, and deliberately no
        `permission_mode`, no `apm_*`, no sandbox/workspace/commit axis: a new
        profile is a launch descriptor whose APM pin is recorded later, by
        whoever holds the lockfile digest (ADR-0030).
      type: object
      required: [name, launcher_id]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: Unique within the organization; a clash is `409`.
        launcher_id:
          type: string
          pattern: "^[a-z0-9][a-z0-9_-]{0,63}$"
          description: >
            A launcher registry id. Never a command line: argv only, no shell
            expansion, and no claim that the harness works on this host.
      example:
        name: Claude Code (pinned skills)
        launcher_id: claude
    AgentProfileAPMPatch:
      title: AgentProfileAPMPatch
      description: >
        PATCH /api/v1/agent-profiles/{profileId}. All three members present, or
        all three absent/empty; any partial triple is `422`
        `apm_pin_incomplete` (see the route description for why). Unknown fields
        are refused.
      type: object
      additionalProperties: false
      minProperties: 0
      properties:
        apm_package_ref:
          type: ["string", "null"]
          description: See AgentProfile.apm_package_ref.
        apm_target:
          type: ["string", "null"]
          enum: [claude, codex, null]
        apm_lock_digest:
          type: ["string", "null"]
          pattern: "^sha256:[0-9a-f]{64}$"
      example:
        apm_package_ref: mattpocock/skills#v1.3.1
        apm_target: claude
        apm_lock_digest: sha256:127ccf2b000000000000000000000000000000000000000000000000000000ab
    AgentProfileProblem:
      title: AgentProfileProblem
      description: >
        A profile-write `422`: the Problem document plus the stable `code` member
        and a `type` URI ending in that same code. Clients switch on `code`.
      type: object
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          const: 422
        detail:
          type: string
        code:
          type: string
          description: One of the AgentProfileAPMProblem codes. An unknown code must be tolerated.
    AgentProfileList:
      title: AgentProfileList
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AgentProfile"
    ConversationControl:
      title: ConversationControl
      description: >
        The conversation's single-controller lock (`conversation_control`,
        ADR-0016). Exactly one holder, always: `kind` is `human` with
        `user_id` set, or `none` with `user_id` null. `run_attempt` is the M4
        shape — reserved in the schema and never emitted by M2. `version` is
        the compare-and-swap token every control mutation must echo.
      type: object
      required: [kind, version]
      properties:
        kind:
          type: string
          enum: [none, human, run_attempt]
        user_id:
          type: ["string", "null"]
          format: uuid
          description: Current controller; null when `kind` is `none`.
        display_name:
          type: ["string", "null"]
          description: Resolved name of `user_id` for the UI badge; null when uncontrolled.
        previous_user_id:
          type: ["string", "null"]
          format: uuid
          description: >
            Who held control before the current holder — `return-control` hands
            it back to this user if they still may, otherwise control goes to `none`.
        version:
          type: integer
          minimum: 1
          description: >
            `conversation_control.version`. Increments on every successful
            take/return; a mutation carrying anything other than this value is
            `409`.
    AgentSessionBinding:
      title: AgentSessionBinding
      description: >
        The agent instance currently attached to a conversation
        (`acp_session_bindings`), as observed. Present only while a worker holds
        a live ACP session; its absence means the next prompt will start a fresh
        session. `agent_capabilities` is what the agent itself reported at
        `initialize` — data, not a support claim.
      type: object
      required: [binding_id, worker_id, launcher_id, acp_session_id, protocol_version, session_origin, connected_at, last_seen_at]
      properties:
        binding_id:
          type: string
          format: uuid
        worker_id:
          type: string
          format: uuid
        worker_name:
          type: ["string", "null"]
          description: Worker display name (`workers.name`) for the UI; null if unresolvable.
        launcher_id:
          type: string
        launcher_version:
          type: string
          description: Adapter version as observed at connect time; `""` when unknown.
        acp_session_id:
          type: string
          description: Session id the harness itself issued.
        protocol_version:
          type: integer
          minimum: 1
          description: Negotiated ACP protocol version (M2 targets v1).
        session_origin:
          type: string
          enum: [new, resumed]
          description: >
            `new` = `session/new` on a freshly launched process; `resumed` =
            `session/load` succeeded against a capability the agent advertised.
            A failed resume is recorded as `new`, never as a silent resume.
            Bindings only ever carry these two values; `conversation.turn.started`
            payloads additionally report `reused` for a turn that rode a live
            session from an earlier turn.
        agent_capabilities:
          type: object
          description: Agent-reported capability object, verbatim.
          additionalProperties: true
        connected_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
    ConversationTurn:
      title: ConversationTurn
      description: >
        One prompt and the agent's whole response for it
        (`conversation_turns`) — the unit of work a worker claims. Internal
        lease machinery (`lease_expires_at`, `fencing_token`) is persisted and
        asserted server-side but deliberately not exposed: a browser cannot and
        must not participate in lease arbitration (ADR-0016).
      type: object
      required: [id, conversation_id, status, submitted_by, created_at]
      properties:
        id:
          type: string
          format: uuid
        conversation_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [queued, leased, running, completed, cancelled, failed, interrupted]
          description: >
            `queued` → `leased` → `running` is the only forward path; the four
            terminals are final. `interrupted` means nobody reported an outcome
            (expired lease, vanished worker, worker shutdown) — it is never
            rendered as "resumed without loss".
        prompt:
          type: string
          maxLength: 65536
          description: >
            The prompt text as stored. Echoed only by `POST .../messages` and
            `getConversation`'s `active_turn`; never part of a list response.
        submitted_by:
          type: string
          format: uuid
          description: User who submitted the prompt (always a human in M2).
        submitted_by_display_name:
          type: ["string", "null"]
        worker_id:
          type: ["string", "null"]
          format: uuid
          description: Worker that claimed the turn; null while `queued`.
        cancel_requested_at:
          type: ["string", "null"]
          format: date-time
          description: >
            Set by `POST .../cancel` or by a takeover; the worker sends ACP
            `session/cancel` and the turn ends `cancelled`. A request, not a stop.
        stop_reason:
          type: ["string", "null"]
          description: >
            Harness `stopReason` verbatim (`end_turn`, `max_tokens`,
            `max_turn_requests`, `refusal`, `cancelled`); null for `interrupted`
            turns, because nothing reported one.
        created_at:
          type: string
          format: date-time
        started_at:
          type: ["string", "null"]
          format: date-time
        finished_at:
          type: ["string", "null"]
          format: date-time
    Conversation:
      title: Conversation
      description: >
        A durable, project-scoped agent conversation. The agent process is not
        part of this identity: `status` describes the conversation, the (nullable)
        `agent_session` describes what is attached right now.
      type: object
      required: [id, project_id, agent_profile_id, title, status, created_by, created_at, updated_at, control]
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        agent_profile_id:
          type: string
          format: uuid
        agent_profile_name:
          type: string
          description: Resolved profile name for display (`"Claude Code"`).
        launcher_id:
          type: string
          description: Launcher the profile resolves to, repeated for display convenience.
        title:
          type: string
          maxLength: 200
        status:
          type: string
          enum: [active, idle, disconnected, archived]
          description: >
            `active` = an agent session is attached; `idle` = history, nothing
            attached; `disconnected` = the session went away with a turn still
            open (recovery is honest — the next prompt starts or resumes a
            session and records which); `archived` = read-only.
        created_by:
          type: string
          format: uuid
        created_by_display_name:
          type: ["string", "null"]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        control:
          $ref: "#/components/schemas/ConversationControl"
        active_turn:
          description: >
            The conversation's non-terminal turn (`queued`/`leased`/`running`),
            or null when none. At most one can exist — the DB enforces it
            (ADR-0016).
          allOf:
            - $ref: "#/components/schemas/ConversationTurn"
        agent_session:
          description: The live agent instance attached to this conversation, or null.
          allOf:
            - $ref: "#/components/schemas/AgentSessionBinding"
        pending_permissions:
          type: array
          description: >
            Prompts awaiting a decision (`permission_requests` rows in
            `pending`), oldest first. Only the current controller may answer.
          items:
            $ref: "#/components/schemas/PermissionRequest"
    ConversationSummary:
      title: ConversationSummary
      description: >
        List row for `listConversations`. Carries the controller (a project
        timeline shows who is driving) but not the transcript, binding or
        pending prompts — fetch the conversation for those.
      type: object
      required: [id, project_id, agent_profile_id, title, status, created_by, created_at, updated_at, control]
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        agent_profile_id:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 200
        status:
          type: string
          enum: [active, idle, disconnected, archived]
        created_by:
          type: string
          format: uuid
        created_by_display_name:
          type: ["string", "null"]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        control:
          $ref: "#/components/schemas/ConversationControl"
        has_active_turn:
          type: boolean
          description: >
            Cheap "someone is prompting now" flag; the turn itself is on the
            detail route and the transcript stream.
        agent_connected:
          type: boolean
          description: Whether a live ACP session is attached to this conversation.
    ConversationSummaryList:
      title: ConversationSummaryList
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ConversationSummary"
    ConversationCreate:
      title: ConversationCreate
      description: >
        Request body for `createConversation`. `prompt` is optional: when
        present it becomes the first queued turn (and the
        `conversation.message.user` event) exactly as if it had been POSTed to
        `.../messages` afterwards.
      type: object
      required: [agent_profile_id, title]
      properties:
        agent_profile_id:
          type: string
          format: uuid
          description: >
            Must be a profile of the caller's organization (`422` otherwise).
        title:
          type: string
          minLength: 1
          maxLength: 200
        prompt:
          type: string
          minLength: 1
          maxLength: 65536
          description: First prompt to enqueue for the controller.
    ConversationMessageCreate:
      title: ConversationMessageCreate
      description: >
        Request body for `postConversationMessage`. The conversation's transcript
        is append-only: editing a submitted prompt is not an M2 operation.
      type: object
      required: [prompt]
      properties:
        prompt:
          type: string
          minLength: 1
          maxLength: 65536
          description: >
            Stored verbatim (surrounding whitespace aside) and delivered to the
            harness as one `session/prompt`.
    ControlVersionRequest:
      title: ControlVersionRequest
      description: >
        Compare-and-swap token for `takeConversationControl` and
        `returnConversationControl`: the `control.version` the caller last read.
      type: object
      required: [version]
      properties:
        version:
          type: integer
          minimum: 1
    PermissionOption:
      title: PermissionOption
      description: One choice the agent offered for a permission prompt.
      type: object
      required: [option_id, label]
      properties:
        option_id:
          type: string
          description: Opaque id issued by the harness; echo it in `PermissionDecision.option_id`.
        label:
          type: string
          description: Human-facing label as offered (`"Allow once"`, ...).
        kind:
          type: string
          description: >
            ACP option kind as observed (`allow_once`, `allow_always`,
            `reject_once`, `reject_always`); empty when the harness did not label it.
    PermissionRequest:
      title: PermissionRequest
      description: >
        A durable ACP permission prompt (`permission_requests`) surfaced to the
        controller. `tool_call_id` links it to the `conversation.tool.call` row
        that describes the work; the prompt's tool input is never repeated here.
      type: object
      required: [id, conversation_id, turn_id, status, tool_title, options, requested_at]
      properties:
        id:
          type: string
          format: uuid
          description: This row's id — the `requestId` path parameter of the decision route.
        conversation_id:
          type: string
          format: uuid
        turn_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, decided, expired, cancelled]
        tool_title:
          type: string
          description: Human-readable summary of what the agent wants to do.
        tool_kind:
          type: string
          description: ACP tool kind (`edit`, `execute`, ...); empty when unlabelled.
        tool_call_id:
          type: ["string", "null"]
        options:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/PermissionOption"
        decided_by:
          type: ["string", "null"]
          format: uuid
          description: Controller who answered; null while `pending`.
        decision_option_id:
          type: ["string", "null"]
          description: The `option_id` chosen; null unless `status` is `decided`.
        requested_at:
          type: string
          format: date-time
        deadline_at:
          type: ["string", "null"]
          format: date-time
          description: >
            When the offer stops being actionable (`04`: no hanging forever).
            A prompt past its deadline is moved to `expired` by the reconciler.
        decided_at:
          type: ["string", "null"]
          format: date-time
      example:
        id: 01987a72-3333-7000-8000-abcdef012345
        conversation_id: 01987a70-1111-7000-8000-abcdef012345
        turn_id: 01987a73-4444-7000-8000-abcdef012345
        status: pending
        tool_title: "Write to internal/api/projects.go"
        tool_kind: edit
        tool_call_id: toolu_01
        options:
          - option_id: allow_once
            label: Allow once
            kind: allow_once
          - option_id: reject_once
            label: Reject
            kind: reject_once
        requested_at: "2026-10-14T18:02:00Z"
    PermissionDecision:
      title: PermissionDecision
      description: >
        The controller's answer. `option_id` must be one of the prompt's offered
        options — anything else is `422`, because a client may not invent a
        permission the agent did not offer.
      type: object
      required: [option_id]
      properties:
        option_id:
          type: string
          minLength: 1
          maxLength: 200
    ConversationConflictProblem:
      title: ConversationConflictProblem
      description: >
        `409` for a conversation route: the `Problem` shape plus the current
        control row (and, for a turn conflict, the turn that is in the way), so
        the client can re-read and re-decide instead of guessing.
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [conversation_id, control]
          properties:
            conversation_id:
              type: string
              format: uuid
            control:
              $ref: "#/components/schemas/ConversationControl"
            active_turn:
              description: The non-terminal turn that blocked this request, when that is the conflict.
              allOf:
                - $ref: "#/components/schemas/ConversationTurn"
    # ------------------------------------------------- M3: secrets ------
    Secret:
      title: Secret
      description: >
        A `secret_metadata` row — the half of a SecretRef that may be shared with
        a client. There is no field here that could hold a value, and
        `content_sha256` is absent on purpose (ADR-0018: retry-comparison only,
        never API-exposed).
      type: object
      required:
        [id, slug, scope, purpose, delivery_mode, current_version,
         allowed_agent_profile_ids, audit_policy, created_at]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
          description: >
            Unique per project (`secret_metadata_project_slug_idx`) or per
            organization for `scope: org`. A mount names a secret by slug, so
            this is not renameable through this API.
          pattern: '^[a-z0-9]([a-z0-9._-]*[a-z0-9])?$'
        scope:
          type: string
          enum: [project, org]
        purpose:
          type: string
          description: >
            Why this exists, for the human reading the list ("integration test
            database"). Never used for authorization.
        delivery_mode:
          type: string
          enum: [env, env_file, integration_broker]
          description: >
            `integration_broker` is declared in `05` and refused in M3
            (`ADR-0018` clause 8) — it can be stored as a policy so the intent
            survives, but no mount may be created for it yet.
        current_version:
          type: integer
          minimum: 1
          description: >
            The version a new launch materializes. Older versions stay readable to
            a unit that pinned them; they are never listed here.
        allowed_agent_profile_ids:
          type: array
          items:
            type: string
            format: uuid
          description: >
            An allowlist. **Empty means denied to every profile** — the profile's
            own `secret_mount_ids` is the other half, and both must agree.
        audit_policy:
          type: string
          enum: [materialization, materialization_and_access]
          description: >
            `materialization_and_access` additionally records preview-style
            accesses; `materialization` is the default because that is the
            evidence M3 produces.
        created_at:
          type: string
          format: date-time
        rotated_at:
          type: [string, "null"]
          format: date-time
        revoked_at:
          type: [string, "null"]
          format: date-time
          description: >
            Set means every version refuses to materialize from now on.
    SecretList:
      title: SecretList
      type: object
      required: [secrets]
      properties:
        secrets:
          type: array
          items:
            $ref: "#/components/schemas/Secret"
    SecretCreate:
      title: SecretCreate
      description: >
        Request body for `createProjectSecret`. `value` exists in exactly one
        schema in this entire document besides `SecretVersionCreate`, and it is
        write-only: it is never echoed back, never logged, and never appears in an
        event.
      type: object
      required: [slug, delivery_mode, value]
      additionalProperties: false
      properties:
        slug:
          type: string
          pattern: '^[a-z0-9]([a-z0-9._-]*[a-z0-9])?$'
          maxLength: 128
        purpose:
          type: string
          maxLength: 512
        delivery_mode:
          type: string
          enum: [env, env_file]
          description: >
            `integration_broker` is not acceptable on create either: a secret with
            no deliverable placement is a secret nobody can use, and refusing it
            here is what keeps `05`'s "prefer a restricted broker" from silently
            degrading into env delivery.
        scope:
          type: string
          enum: [project, org]
          description: >
            Defaults to `project`. `org` requires organization-level rights, and
            an org-scoped secret carries no `project_id` (`secrets_scope_pointer`).
        allowed_agent_profile_ids:
          type: array
          items:
            type: string
            format: uuid
        value:
          type: string
          minLength: 1
          maxLength: 65536
          writeOnly: true
          description: >
            Encrypted with a per-version data key (AES-256-GCM, fresh 12-byte
            nonce, AAD binding `secret_id || version || key_id || sha256(slug)`) and
            stored in `secret_versions` v1. A retried create compares
            `content_sha256` server-side instead of writing a second version.
    SecretUpdate:
      title: SecretUpdate
      description: >
        Request body for `updateProjectSecret`. `additionalProperties: false` is
        load-bearing: `value` in this body is a `400`, not an ignored field, so a
        request that meant to rotate cannot quietly become a no-op.
      type: object
      required: [purpose, allowed_agent_profile_ids, audit_policy]
      additionalProperties: false
      properties:
        purpose:
          type: string
          maxLength: 512
        allowed_agent_profile_ids:
          type: array
          items:
            type: string
            format: uuid
        audit_policy:
          type: string
          enum: [materialization, materialization_and_access]
    SecretVersionCreate:
      title: SecretVersionCreate
      description: Request body for `addProjectSecretVersion`.
      type: object
      required: [value]
      additionalProperties: false
      properties:
        value:
          type: string
          minLength: 1
          maxLength: 65536
          writeOnly: true
    SecretVersionInfo:
      title: SecretVersionInfo
      description: >
        The metadata `addProjectSecretVersion` returns. `key_id` names the
        master-key generation outside this database — an unknown `key_id` is a
        refused decrypt, never a guess.
      type: object
      required: [secret_id, version, key_id, created_at]
      properties:
        secret_id:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
        key_id:
          type: string
        created_at:
          type: string
          format: date-time
    SecretMaterialization:
      title: SecretMaterialization
      description: >
        One `secret_materializations` row: proof that a value was present during
        one unit, at one target, on one worker — and, when `cleaned_at` is set,
        who removed it. A null `cleaned_at` is a finding, not a formatting
        choice: it is what the worker's startup sweep looks for.
      type: object
      required: [id, secret_id, secret_version, delivery_mode, target, materialized_at]
      properties:
        id:
          type: integer
          format: int64
        secret_id:
          type: string
          format: uuid
        slug:
          type: string
        secret_version:
          type: integer
          minimum: 1
        workspace_id:
          type: [string, "null"]
          format: uuid
        turn_id:
          type: [string, "null"]
          format: uuid
          description: >
            M3's unit. `attempt_id` arrives with M4 and nothing is renamed later
            (contract deviation D1/D9).
        worker_id:
          type: string
          format: uuid
        delivery_mode:
          type: string
          enum: [env, env_file]
        target:
          type: string
          description: >
            The env variable name, or the path relative to its repository
            checkout. Never absolute (`mounts_shape` refuses that, and the
            materializer refuses it again against the real filesystem).
        file_mode:
          type: [integer, "null"]
          description: >
            The mode that was actually created, as octal in decimal notation —
            `384` is `0600`. Recorded rather than asserted, because the whole
            claim of case 12/C12a is that the file on disk had this mode.
        materialized_at:
          type: string
          format: date-time
        cleaned_at:
          type: [string, "null"]
          format: date-time
        cleaned_by:
          type: [string, "null"]
          enum: [worker, reconciler, startup_sweep, null]
          description: >
            The unit's own defer, the reconciler, or the sweep over rows that
            survived a crash. `null` while the row is uncleaned.
    SecretMaterializationList:
      title: SecretMaterializationList
      type: object
      required: [materializations]
      properties:
        materializations:
          type: array
          items:
            $ref: "#/components/schemas/SecretMaterialization"
    SecretMount:
      title: SecretMount
      description: >
        A declared placement (`05`'s `secret_mounts`). The shape is enforced twice:
        by the `mounts_shape` CHECK and again at materialization time, where
        `git ls-files`, the mirror's `info/exclude` and the real filesystem get
        votes that a column constraint cannot cast.
      type: object
      required: [id, project_id, secret_id, delivery_mode, lifecycle, allow_tracked, created_at]
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        secret_id:
          type: string
          format: uuid
        secret_slug:
          type: string
        delivery_mode:
          type: string
          enum: [env, env_file]
        repository_id:
          type: [string, "null"]
          format: uuid
          description: Required for `env_file`; a repository of another project is `422`.
        relative_path:
          type: [string, "null"]
          description: >
            Relative to the repository checkout root: no leading `/`, no `..`
            segment, no empty segment.
        env_name:
          type: [string, "null"]
          description: Required for `env`; it names a variable, never a path.
        key:
          type: [string, "null"]
          description: >
            Single-key extraction from a multi-line value (`secret-mounts.yaml`
            `key`), so one stored blob can serve one variable.
        lifecycle:
          type: string
          enum: [turn, workspace, node_attempt]
          description: >
            `turn` is removed at the turn's terminal state, `workspace` at
            `workspace.released`. `node_attempt` is legal in the CHECK and honoured
            by nothing until M4's attempts exist — accepted, not silently
            reinterpreted as `turn` (contract deviation D9).
        allow_tracked:
          type: boolean
          description: >
            `05`'s explicit policy exception. Default false, and a tracked target
            is refused with `secret.materialization_failed`
            (`reason=tracked_target`) rather than overwritten.
        created_at:
          type: string
          format: date-time
    SecretMountCreate:
      title: SecretMountCreate
      description: Request body for `createProjectSecretMount`.
      type: object
      required: [secret_id, delivery_mode]
      additionalProperties: false
      properties:
        secret_id:
          type: string
          format: uuid
        delivery_mode:
          type: string
          enum: [env, env_file]
        repository_id:
          type: string
          format: uuid
        relative_path:
          type: string
        env_name:
          type: string
        key:
          type: string
        lifecycle:
          type: string
          enum: [turn, workspace, node_attempt]
        allow_tracked:
          type: boolean
    SecretMountList:
      title: SecretMountList
      type: object
      required: [secret_mounts]
      properties:
        secret_mounts:
          type: array
          items:
            $ref: "#/components/schemas/SecretMount"
    # ---------------------------------------------- M3: workspaces ------
    WorkspaceRepo:
      title: WorkspaceRepo
      description: >
        One repository inside a workspace. Paths are absent by design: `admin_dir`
        is the path a sandbox grant names, and `mirror_path` is where the shared
        object store lives — both are worker-side topology. `run_ref` is the
        client-usable identity: it names the branch this scope owns and nothing
        else.
      type: object
      required: [repository_id, name, run_ref, base_commit, workspace_mode]
      properties:
        repository_id:
          type: string
          format: uuid
        name:
          type: string
        run_ref:
          type: string
          description: >
            `<scope-id>/<name>` — the only ref namespace this workspace may write
            (ADR-0017 D4's commit grant, measured: run-2's sandboxed
            `update-ref` of run-1's ref was denied with `Permission denied`).
        base_commit:
          type: string
          description: The commit the worktree was created at.
        head_commit:
          type: [string, "null"]
          description: >
            Set by the worker's post-commit ref read (P8: an exit status is not
            proof, the ref read afterwards is), null until then.
        workspace_mode:
          type: string
          enum: [worktree, clone]
        modified_paths:
          type: array
          items:
            type: string
          description: >
            The manifest, repository-relative, with `excluded_paths` already
            subtracted (ADR-0017 D8). A manifest, not a diff.
        excluded_paths:
          type: array
          items:
            type: string
          description: >
            The project-scoped exclusion set (materialized `.env` targets and
            APM-staged paths). Filtered again by the checkpoint and artifact
            paths, so a git-level exclusion is never the only thing between a
            secret and an artifact.
    Workspace:
      title: Workspace
      description: >
        A scope's workspace on one worker's volume (ADR-0017 D3). `state` is the
        field that decides whether work may proceed: `quarantined` means a security
        check failed here (a leftover materialized secret, an exclusion that could
        not be established, an unresolvable worktree) and reuse is blocked — it is
        never auto-cleaned, because quietly deleting the evidence of a security
        failure is worse than the failure.
      type: object
      required:
        [id, project_id, scope_kind, worker_id, volume_id, workspace_mode, state,
         created_at, repos]
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        scope_kind:
          type: string
          enum: [conversation, run]
          description: >
            `run` is legal today and unpopulated until M4, so that milestone does
            not rename the wire (contract deviation D1).
        conversation_id:
          type: [string, "null"]
          format: uuid
        run_id:
          type: [string, "null"]
          format: uuid
        worker_id:
          type: string
          format: uuid
        volume_id:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
          description: >
            Identity of the storage root this workspace was created on, derived
            from `(st_dev, st_ino, root path)` — **not** from `st_dev` alone.
            Probe V3 found two different docker named volumes at one path sharing a
            device number, so an `st_dev`-only identity would reclaim workspaces
            whose bytes are gone and call it recovery.
        workspace_mode:
          type: string
          enum: [worktree, clone]
        state:
          type: string
          enum: [preparing, ready, quarantined, released, lost]
        repos:
          type: array
          items:
            $ref: "#/components/schemas/WorkspaceRepo"
        created_at:
          type: string
          format: date-time
        ready_at:
          type: [string, "null"]
          format: date-time
        released_at:
          type: [string, "null"]
          format: date-time
        lost_at:
          type: [string, "null"]
          format: date-time
        lost_reason:
          type: [string, "null"]
          enum: [volume_changed, path_missing, different_worker, null]
          description: >
            Present when `state` is `lost`, from `workspace.recovery_lost`. The UI
            renders this as "prior edits lost, rerun required" — never "resumed"
            (`10` J7's honesty rule; D-024 cross-host rehydration stays **Open**).
    WorkspaceList:
      title: WorkspaceList
      type: object
      required: [workspaces]
      properties:
        workspaces:
          type: array
          items:
            $ref: "#/components/schemas/Workspace"
    WorkspaceRepoStatus:
      title: WorkspaceRepoStatus
      description: >
        The worker's last recorded view of one checkout. `recorded_at` makes
        staleness explicit: this is a journal of what the worker observed at a
        unit boundary, not a live `git status`, and saying so is what keeps the
        UI from implying it watched the filesystem.
      type: object
      required: [workspace_id, repository_id, run_ref, base_commit, dirty, modified_paths, recorded_at]
      properties:
        workspace_id:
          type: string
          format: uuid
        repository_id:
          type: string
          format: uuid
        run_ref:
          type: string
        base_commit:
          type: string
        head_commit:
          type: [string, "null"]
        dirty:
          type: boolean
        modified_paths:
          type: array
          items:
            type: string
        excluded_paths:
          type: array
          items:
            type: string
        recorded_at:
          type: string
          format: date-time
    # ------------------------------------------------ M3: sandbox -------
    SandboxGrant:
      title: SandboxGrant
      description: >
        One entry of a launched unit's grant set, named by **role**. A Landlock
        ruleset is a list of host paths, and this API does not publish host paths
        (`09`: no accidental worker-service surface; `10` needs to *show* what was
        enforced, not where the disks are). Roles answer the same question and stay
        meaningful after the workspace is gone.
      type: object
      required: [role, access]
      properties:
        role:
          type: string
          enum:
            - workspace_repo
            - workspace_scratch
            - workspace_home
            - mirror_read
            - mirror_objects
            - mirror_run_refs
            - mirror_run_logs
            - mirror_admin_dir
            - harness_credentials
        access:
          type: string
          enum: [ro, rw]
    TurnSandbox:
      title: TurnSandbox
      description: >
        What one launched unit actually ran under. Built from the turn's
        `sandbox.verified` / `sandbox.enforcement_failed` events; `stage` is where
        the ADR-0019 chain ended, and `child_started` is the one boolean that
        answers 12-test-strategy's case-13 question — was a process ever exec'd?
      type: object
      required: [turn_id, stage, verified, child_started, backend, grants, denied_what]
      properties:
        turn_id:
          type: string
          format: uuid
        workspace_id:
          type: [string, "null"]
          format: uuid
        worker_id:
          type: [string, "null"]
          format: uuid
        stage:
          type: string
          enum: [none, probe, profile, policy_assert, grant_assert, exec, runtime]
          description: >
            `none` means the chain completed (a verified launch) — the failure
            stages are where it stopped.
        reason:
          type: [string, "null"]
          description: >
            ADR-0019 D6's enum when the chain stopped: `binary_missing`,
            `landlock_unavailable`, `fs_unverified`, `tcp_unverified`,
            `af_unix_not_mediated`, `profile_invalid`, `grant_mismatch`,
            `temp_path_grant`, `cwd_not_granted`, `policy_delegation_refused`,
            `deny_unsupported`, `egress_check_failed`.
        policy_digest:
          type: [string, "null"]
          pattern: '^sha256:[0-9a-f]{64}$'
        backend:
          type: string
          description: Sandbox backend name (`nono` in M3; `none` for a labelled run).
        backend_version:
          type: [string, "null"]
        enforcement:
          type: [string, "null"]
          enum: [required, permissive-dev, disabled, null]
          description: >
            The mode this unit ran under. `permissive-dev` and `disabled` are
            configured choices, never recovery paths, and every event from such a
            launch is labelled `isolation="none"` (`05`).
        verified:
          type: boolean
          description: >
            True only when N-a..N-d all passed **for this unit** (ADR-0019). A
            probe is not a proof, so a worker that merely booted reports false.
        af_unix_mediation:
          type: [string, "null"]
          enum: [pathname, none, null]
          description: >
            From `nono profile show`, not from a dry-run grant list (probe N4: the
            verbose dry-run does not mention `AF_UNIX` at all).
        network_enforced:
          type: boolean
          description: >
            False on the `agent-turn` profile — reported, not hidden (ADR-0019 D3,
            D-021 **Proposed**). True only for the command-only egress profile.
        child_started:
          type: boolean
        grants:
          type: array
          items:
            $ref: "#/components/schemas/SandboxGrant"
        commit_granted:
          type: boolean
        denied_what:
          type: array
          items:
            type: string
          description: >
            Which layer denied what (ADR-0009 D3), as roles and reasons — e.g.
            `mirror_run_refs:rw denied for another scope`. Bounded and redacted.
    WorkerSandboxStatus:
      title: WorkerSandboxStatus
      description: >
        One worker's self-reported sandbox capability, as registration data
        (ADR-0019 D5). The honest default for a worker that has never probed is
        `backend: none`, `verified: false` — a default must never read as a
        capability.
      type: object
      required: [worker_id, backend, enforcement, verified]
      properties:
        worker_id:
          type: string
          format: uuid
        backend:
          type: string
        backend_version:
          type: [string, "null"]
        enforcement:
          type: string
          enum: [required, permissive-dev, disabled]
        verified:
          type: boolean
        volumes:
          type: array
          items:
            type: object
            required: [root_kind, volume_id]
            properties:
              root_kind:
                type: string
                enum: [workspaces, repos]
              volume_id:
                type: string
                pattern: '^sha256:[0-9a-f]{64}$'
                description: >
                  Per-root on purpose: probe V5b measured /workspaces and /repos as
                  one device with different inodes, so a single identity column
                  could only ever name one of the two trees.
          description: >
            The measured identity of each storage root this worker sees, which is
            what makes case 20's two arms (same volume, replaced volume) different
            answers.
        notes:
          type: array
          items:
            type: string
          description: Bounded diagnostics, e.g. the forbidden capabilities observed.
    SystemSandbox:
      title: SystemSandbox
      description: >
        Fleet sandbox health for `10`'s ops page, plus what the deployment ships:
        the pinned nono version and policy digest are the answer to "which ruleset
        did those grants come from?".
      type: object
      required: [workers, pinned_backend_version, policy_digest]
      properties:
        workers:
          type: array
          items:
            $ref: "#/components/schemas/WorkerSandboxStatus"
        pinned_backend_version:
          type: string
          description: >
            The nono version vendored into the worker image (ADR-0019 D1 pins by
            sha256; `0.80.0` at the time of writing).
        policy_digest:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
          description: Digest of `worker/sandbox/profiles/communication-agent.json`.
    # ------------------------------------------------ M3: artifacts -----
    Artifact:
      title: Artifact
      description: >
        One `artifacts` row. Bytes are never in the database and `storage_key` is
        never serialized: this object is the index into the backend, not the
        backend. `preview_url` is a template until a token is minted — the preview
        origin is a different **hostname**, because cookies are host-scoped and a
        port would not remove one (ADR-0020 D6).
      type: object
      required:
        [id, project_id, name, kind, media_type, sha256, size_bytes, sensitivity,
         state, redaction_count, created_by, created_at]
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        run_id:
          type: [string, "null"]
          format: uuid
        node_execution_id:
          type: [string, "null"]
          format: uuid
        attempt_id:
          type: [string, "null"]
          format: uuid
        conversation_id:
          type: [string, "null"]
          format: uuid
        turn_id:
          type: [string, "null"]
          format: uuid
        worker_id:
          type: [string, "null"]
          format: uuid
        name:
          type: string
        kind:
          type: string
          enum: [markdown, image, html, json, patch, archive, checkpoint]
          description: >
            `checkpoint` is ADR-0020 D8: ADR-0017's captured diff plus manifest,
            stored as an artifact rather than through a second mechanism. It is a
            *capture*: cross-host rehydration (D-024) stays **Open**.
        media_type:
          type: string
        sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: >
            Content digest; with (project_id, kind) it is the dedupe key, so a
            retried Put is the same row rather than a second byte-count.
        size_bytes:
          type: integer
          format: int64
          minimum: 0
        sensitivity:
          type: string
          enum: [standard, internal, restricted, secret]
          description: >
            Gates `/content`: contributor for `standard`/`internal`, maintainer for
            `restricted`, and `secret` has **no** download path in M3 — the label
            exists so a policy can be written against it before the mechanism does.
        state:
          type: string
          enum: [uploading, ready, orphan, deleted]
          description: >
            `uploading` is never served: a row stuck there is the reconciler's
            orphan sweep, which is what makes a worker crash leave an artifact
            unserved instead of half-served.
        redaction_count:
          type: integer
          minimum: 0
          description: >
            The scanner's own count, which makes "the scanner saw nothing"
            distinguishable from "the scanner is broken" (ADR-0020 D4). 0 is
            normal and is not a warning.
        created_by:
          type: string
          description: >
            `worker`, or the id of the user who uploaded it (`06` wants the actor
            recorded for both).
        created_at:
          type: string
          format: date-time
        ready_at:
          type: [string, "null"]
          format: date-time
        expires_at:
          type: [string, "null"]
          format: date-time
        deleted_at:
          type: [string, "null"]
          format: date-time
        preview_url:
          type: [string, "null"]
          description: >
            `http://preview.localhost:18084/preview/{token}` with the token left to
            be minted; null when the caller may not mint one. Absent for anything
            that is not previewable HTML.
    ArtifactList:
      title: ArtifactList
      type: object
      required: [artifacts]
      properties:
        artifacts:
          type: array
          items:
            $ref: "#/components/schemas/Artifact"
    PreviewToken:
      title: PreviewToken
      description: >
        A single-artifact, digest-bound, short-TTL token plus the URL that
        consumes it. Treat it like a credential: it is the only thing that
        authorizes the preview fetch, since the preview origin has no session
        cookie by design. Minting this is itself audited as an access.
      type: object
      required: [artifact_id, preview_url, expires_at]
      properties:
        artifact_id:
          type: string
          format: uuid
        token:
          type: string
          writeOnly: true
          description: >
            Included in the mint response only; it is never stored in plaintext,
            never appears in an event, and never appears in an access log line for
            the preview origin (`12` case 16 asserts the log has no `Cookie` for
            `/preview/`).
        preview_url:
          type: string
          description: >
            Fully qualified, on the preview origin. A URL on the app origin is a
            bug: the origin difference is what removes the cookie.
        expires_at:
          type: string
          format: date-time
    # ------------------------------------------------ M4: validation --------
    ValidateError:
      title: ValidateError
      description: >
        One validation finding (`docs/m4-contract.md` § 2.2). `errors` arrays
        are sorted by `(instance_location, schema_location, code, message)`
        — stable ordering is a spike-fidelity requirement
        (`docs/compatibility/m4-spike/README.md`), not presentation. The codes
        are a public contract named by § 2.2 by source: loader
        (`invalid_yaml`, `document_too_large`, `multiple_documents`,
        `duplicate_key`, `alias_budget_exceeded`, `invalid_number`,
        `unquoted_date`, `unknown_document_kind`); schema (`schema_shape`, one
        unit per validator error — the location is the payload);
        topology/identity (`duplicate_node_id`, `unknown_dependency`,
        `self_dependency`, `cycle_detected`, `depends_on_outside_scope`,
        `scope_entry_ambiguous`, `unreachable_terminal`, `graph_too_large`,
        `empty_body`); bindings (`binding_syntax_error`,
        `binding_offset_out_of_range`, `binding_position_mismatch`,
        `escape_not_supported`, `expression_too_large`, `cel_compile_error`,
        `undeclared_root`, `cel_function_not_allowed`, `non_boolean_expression`,
        `unknown_field`, `type_mismatch`, `undeclared_output_schema`,
        `reserved_node_id`, `expression_budget_exceeded`); policy/registry
        (`kind_not_implemented`, `unknown_profile`, `unknown_repository`,
        `unknown_node_template`, `template_publish_deferred`,
        `secret_literal_detected`, `invalid_secret_ref`, `budget_below_minimum`,
        `budget_exceeds_assignment_ceiling`, `unsupported_policy`,
        `unsupported_session_mode`, `child_depth_exceeded`); publish-time
        (`draft_changed_since_validation`, `stale_draft_version`,
        `draft_not_valid`, `revision_already_published`,
        `unresolved_node_template`). `code` is deliberately an open string:
        adding a code is additive, renaming one is not, and a client must
        tolerate codes it has not seen.
      type: object
      required: [code, source, message]
      properties:
        code:
          type: string
          description: Stable machine code (see the description for the § 2.2 vocabulary).
        source:
          type: string
          enum: [loader, schema, compiler]
          description: >
            Which stage spoke. The three are **ordered, not merged**: loader
            rules gate the JSON the schema validator sees; schema units
            convert 1:1 (`instanceLocation`/`keywordLocation` → snake_case);
            the compiler names only the classes it can see.
        message:
          type: string
          description: Human-facing text. Never quotes a secret-scanned value.
        instance_location:
          type: ["string", "null"]
          description: >
            JSON-Pointer-style location in the canonical document, e.g.
            `/spec/nodes/2/config/passWhen`. Null when the finding is not
            addressable in the document.
        schema_location:
          type: ["string", "null"]
          description: JSON-Pointer into the schema; null when not applicable.
        hint:
          type: string
          description: >
            User-facing guidance. May quote an offending scalar *shape*
            (`got string, want integer`) but never a value a secret scanner
            flags (ADR-0021 Security).
    ValidateResponse:
      title: ValidateResponse
      description: >
        The `POST /drafts/{draftId}/validate` body (§ 2.2), stored verbatim on
        the draft as its `validation` and echoed by `GET /drafts/{draftId}` so
        an editor reload does not revalidate to repaint its problems panel.
        Bounded at 200 errors; truncation appends `errors_truncated` to
        `notes` (a 2 000-error list is a browser outage, § 6).
      type: object
      required: [valid, digest_scope, errors, notes]
      properties:
        valid:
          type: boolean
        revision_digest:
          type: ["string", "null"]
          pattern: "^sha256:[0-9a-f]{64}$"
          description: >
            Digest over the canonical document (ADR-0021 § 5), null unless
            `valid` is true.
        plan_digest:
          type: ["string", "null"]
          pattern: "^sha256:[0-9a-f]{64}$"
          description: Digest over the compiled plan, null unless `valid` is true.
        digest_scope:
          type: string
          description: >
            Versioned digest scope (`v1alpha1-canonical-1`): the rules this
            digest was produced under, so a future canonicalization change is
            distinguishable rather than a silent digest break.
        errors:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/ValidateError"
        notes:
          type: array
          items:
            type: string
          description: >
            Non-error prose the tooling must surface (`aliases and merge keys
            were expanded before hashing; the export is regenerated`) and
            flags (`errors_truncated`).
    ValidateProblem:
      title: ValidateProblem
      description: >
        A `422` that speaks the validation vocabulary — today run-input failure
        on `POST /runs`, so one client-side renderer covers both editors and
        runners.
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [valid, errors]
          properties:
            valid:
              type: boolean
              const: false
            errors:
              type: array
              items:
                $ref: "#/components/schemas/ValidateError"
    # ------------------------------------------------ M4: pipelines ---------
    PipelineSummary:
      title: PipelineSummary
      description: >
        A row of the organization's pipeline library. No document bytes on a
        list route — `revision_count` and the latest number tell the story and
        the content is a fetch.
      type: object
      required: [id, slug, display_name, latest_revision_number, revision_count, archived]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
          pattern: "^[a-z][a-z0-9.-]{0,127}$"
        display_name:
          type: string
        latest_revision_number:
          type: integer
          minimum: 0
          description: 0 when the pipeline has never published.
        revision_count:
          type: integer
          minimum: 0
        archived:
          type: boolean
    PipelineList:
      title: PipelineList
      type: object
      required: [pipelines]
      properties:
        pipelines:
          type: array
          items:
            $ref: "#/components/schemas/PipelineSummary"
    Pipeline:
      title: Pipeline
      description: >
        The logical definition plus its revision summaries. This is the unit
        that is *not* immutable — revisions are (ADR-0002), and neither this
        route nor any other can rewrite a published one.
      type: object
      required:
        [id, slug, display_name, description, created_by, created_at,
         latest_revision_number, revision_count, archived, revisions]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
          pattern: "^[a-z][a-z0-9.-]{0,127}$"
        display_name:
          type: string
        description:
          type: string
        created_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        latest_revision_number:
          type: integer
          minimum: 0
        revision_count:
          type: integer
          minimum: 0
        archived:
          type: boolean
        revisions:
          type: array
          items:
            $ref: "#/components/schemas/PipelineRevisionSummary"
    PipelineCreate:
      title: PipelineCreate
      description: Request body for `createPipeline`.
      type: object
      required: [slug]
      properties:
        slug:
          type: string
          pattern: "^[a-z][a-z0-9.-]{0,127}$"
          description: Unique in the organization; a duplicate is `409`.
        display_name:
          type: string
          maxLength: 200
        description:
          type: string
          maxLength: 2000
    PipelineUpdate:
      title: PipelineUpdate
      description: >
        Request body for `updatePipeline` — metadata only. There is no field
        here that reaches a revision, a draft, or a run.
      type: object
      minProperties: 1
      properties:
        display_name:
          type: string
          maxLength: 200
        description:
          type: string
          maxLength: 2000
        archived:
          type: boolean
    PipelineRevisionSummary:
      title: PipelineRevisionSummary
      description: >
        The identity of an immutable revision — both digests, no body.
        `revision_digest` covers the canonical document, `plan_digest` the
        compiled plan, `digest_scope` names the rules both were computed under
        (ADR-0021 § 5/§ 6).
      type: object
      required:
        [revision_number, version_label, revision_digest, plan_digest,
         digest_scope, published_at, published_by, status]
      properties:
        revision_number:
          type: integer
          minimum: 1
          description: Monotonic per pipeline, unique, never reused (there is no update path).
        version_label:
          type: string
          pattern: "^\\d+\\.\\d+\\.\\d+$"
          description: The semver label from `07` "One schema, multiple editors"; unique per pipeline.
        revision_digest:
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
        plan_digest:
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
        digest_scope:
          type: string
        published_at:
          type: string
          format: date-time
        published_by:
          type: string
          format: uuid
        status:
          type: string
          enum: [published, deprecated]
    PipelineRevisionSummaryList:
      title: PipelineRevisionSummaryList
      type: object
      required: [revisions]
      properties:
        revisions:
          type: array
          items:
            $ref: "#/components/schemas/PipelineRevisionSummary"
    PipelineRevision:
      title: PipelineRevision
      description: >
        The full immutable record. `document_text` is the YAML **regenerated**
        from `canonical_document` — the author's original bytes are not stored
        on the revision, because canonicalization (alias expansion, merge-key
        flattening, NFC, deleting `metadata.ui`) is one-way and the regenerated
        form is the only one that re-canonicalizes to `revision_digest`
        (ADR-0021 § 5). `schema_digest` and `cel_env_digest` pin *which*
        validator and *which* CEL environment produced the plan, so a digest
        is explainable years later.
      type: object
      required:
        [id, pipeline_id, revision_number, version_label, api_version,
         canonical_document, document_text, revision_digest, digest_scope,
         compiled_plan, plan_digest, schema_digest, cel_env_digest, status,
         published_by, published_at]
      properties:
        id:
          type: string
          format: uuid
        pipeline_id:
          type: string
          format: uuid
        draft_id:
          type: ["string", "null"]
          format: uuid
          description: The draft that produced this revision (audit trail of the publish).
        revision_number:
          type: integer
          minimum: 1
        version_label:
          type: string
          pattern: "^\\d+\\.\\d+\\.\\d+$"
        api_version:
          type: string
          enum: [communication.dev/v1alpha1]
        canonical_document:
          type: object
          additionalProperties: true
          description: The canonical JSON the digests are computed over.
        document_text:
          type: string
          description: YAML regenerated from `canonical_document`; never re-hashed.
        ui_layout:
          type: object
          additionalProperties: true
          description: >
            The `metadata.ui` block, served and **never digested** — moving a
            node box on a canvas cannot change what a run executes.
        revision_digest:
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
        digest_scope:
          type: string
        compiled_plan:
          type: object
          additionalProperties: true
          description: >
            The compiler's output the scheduler and engine execute; a run
            copies it into `plan_snapshot`, so execution never reads the
            revision row mid-flight.
        plan_digest:
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
        schema_digest:
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
          description: Digest of the pipeline schema the document validated against.
        cel_env_digest:
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
          description: Digest of the pinned CEL declaration set (ADR-0022 § 5).
        status:
          type: string
          enum: [published, deprecated]
        published_by:
          type: string
          format: uuid
        published_at:
          type: string
          format: date-time
    # -------------------------------------------------- M4: drafts ----------
    DraftSummary:
      title: DraftSummary
      description: A row of a pipeline's draft list.
      type: object
      required: [id, status, version, updated_at, edited_by]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [draft, validating, valid, invalid, published]
          description: >
            `validating` is transient (a validate in flight on this row);
            `published` means the draft produced a revision and is now
            immutable — a `published` draft is the audit trail, not a draft.
        version:
          type: integer
          minimum: 1
          description: The CAS token `PUT /drafts/{id}` and `publish` must echo.
        updated_at:
          type: string
          format: date-time
        edited_by:
          type: string
          format: uuid
    DraftSummaryList:
      title: DraftSummaryList
      type: object
      required: [drafts]
      properties:
        drafts:
          type: array
          items:
            $ref: "#/components/schemas/DraftSummary"
    Draft:
      title: Draft
      description: >
        The only mutable pipeline object. `document_yaml` is what the author
        wrote (bounded at 256 KiB — the loader refuses `document_too_large`
        before the DB CHECK does); `validation` is the last validate body
        verbatim, null when never validated. `source_sha256` is the hash
        `validate` recorded and `publish` compares — the mechanism behind
        `draft_changed_since_validation`.
      type: object
      required:
        [id, pipeline_id, status, document_yaml, source_kind, source_sha256,
         ui_layout, digest_scope, version, edited_by, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        pipeline_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [draft, validating, valid, invalid, published]
        document_yaml:
          type: string
          maxLength: 262144
        source_kind:
          type: string
          enum: [manual, yaml_import, assistant, clone]
        source_sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
        ui_layout:
          type: object
          additionalProperties: true
          description: The `metadata.ui` block, served and never digested.
        validation:
          description: The last `POST /validate` body verbatim; null when never validated.
          allOf:
            - $ref: "#/components/schemas/ValidateResponse"
        digest_scope:
          type: string
        revision_digest:
          type: ["string", "null"]
          pattern: "^sha256:[0-9a-f]{64}$"
          description: Set only by a successful validate (and carried to publish).
        plan_digest:
          type: ["string", "null"]
          pattern: "^sha256:[0-9a-f]{64}$"
        published_revision_id:
          type: ["string", "null"]
          format: uuid
          description: The revision this draft produced, once `status` is `published`.
        version:
          type: integer
          minimum: 1
        edited_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    DraftCreate:
      title: DraftCreate
      description: >
        Request body for `createPipelineDraft`: exactly one of `document_yaml`
        (new document) or `from_revision_id` (clone a published revision).
        Supplying both or neither is `422`.
      type: object
      minProperties: 1
      maxProperties: 1
      properties:
        document_yaml:
          type: string
          minLength: 1
          maxLength: 262144
        from_revision_id:
          type: string
          format: uuid
    DraftPut:
      title: DraftPut
      description: >
        Request body for `putDraft` — a full document replacement guarded by
        the CAS `version` the editor last read.
      type: object
      required: [document_yaml, version]
      properties:
        document_yaml:
          type: string
          minLength: 1
          maxLength: 262144
        version:
          type: integer
          minimum: 1
    DraftPublish:
      title: DraftPublish
      description: >
        Request body for `publishDraft`: the CAS `version` the caller believes
        is current, and optionally the `version_label` (semver, `07` "One
        schema, multiple editors") to stamp the revision with — unique per
        pipeline (`UNIQUE (pipeline_id, version_label)`), absent means the
        server assigns the next label for the `revision_number`. A colliding
        label is `409`.
      type: object
      required: [version]
      properties:
        version:
          type: integer
          minimum: 1
        version_label:
          type: string
          pattern: "^\\d+\\.\\d+\\.\\d+$"
    DraftConflictProblem:
      title: DraftConflictProblem
      description: >
        `409` for a draft route: the `Problem` shape plus what the draft is
        now — `current_version` for `stale_draft_version`, `existing_revision_id`
        for `revision_already_published` (the live revision this byte-identical
        document collides with). The client recovers by re-reading, never by
        guessing.
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [draft_id]
          properties:
            draft_id:
              type: string
              format: uuid
            current_version:
              type: integer
              minimum: 1
              description: >
                The draft's actual version; present for `stale_draft_version`.
            existing_revision_id:
              type: ["string", "null"]
              format: uuid
              description: >
                The already-published revision with the same digest; present
                for `revision_already_published`.
    # --------------------------------------------- M4: assignments ----------
    Assignment:
      title: Assignment
      description: >
        A project's pin of a pipeline revision plus the run ceilings
        (`max_concurrent_runs`) and budget *ceilings* (`budget_overrides`,
        which may only lower what the pipeline declares —
        `budget_overrides_may_only_lower`). `effective_budgets` is the merged
        view a new run will snapshot, so the UI shows the enforced truth
        instead of recomputing the layering. This row is a pin and budgets —
        **not** a stable/beta rollout channel and not a promotion workflow
        (all M6, `07` "Version rollout"): re-pinning here is the promotion,
        effective only at new run creation (ADR-0002).
      type: object
      required:
        [id, project_id, pipeline_id, pinned_revision_id, pinned_revision_digest,
         max_concurrent_runs, budget_overrides, effective_budgets, enabled,
         version, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        pipeline_id:
          type: string
          format: uuid
        pinned_revision_id:
          type: string
          format: uuid
        pinned_revision_digest:
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
          description: Denormalized from the pinned revision for list rendering.
        pinned_version_label:
          type: ["string", "null"]
          pattern: "^\\d+\\.\\d+\\.\\d+$"
        max_concurrent_runs:
          type: integer
          minimum: 1
          maximum: 8
        budget_overrides:
          type: object
          additionalProperties: true
          description: Ceilings only, never a raise.
        effective_budgets:
          type: object
          additionalProperties: true
          description: Pipeline-declared budgets with the overrides applied.
        enabled:
          type: boolean
        version:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AssignmentList:
      title: AssignmentList
      type: object
      required: [assignments]
      properties:
        assignments:
          type: array
          items:
            $ref: "#/components/schemas/Assignment"
    AssignmentCreate:
      title: AssignmentCreate
      description: Request body for `createProjectAssignment`.
      type: object
      required: [pipeline_id, pinned_revision_id]
      properties:
        pipeline_id:
          type: string
          format: uuid
        pinned_revision_id:
          type: string
          format: uuid
          description: Must be a published revision of `pipeline_id` in this organization.
        max_concurrent_runs:
          type: integer
          minimum: 1
          maximum: 8
          default: 1
        budget_overrides:
          type: object
          additionalProperties: true
          description: >
            Ceilings only: a value that raises a limit is `400`
            `budget_overrides_may_only_lower`.
    AssignmentPatch:
      title: AssignmentPatch
      description: >
        Request body for `patchAssignment`. Every change is effective at *new
        run creation* only; queued and running runs keep the snapshot they
        started with.
      type: object
      minProperties: 1
      properties:
        pinned_revision_id:
          type: string
          format: uuid
        max_concurrent_runs:
          type: integer
          minimum: 1
          maximum: 8
        budget_overrides:
          type: object
          additionalProperties: true
        enabled:
          type: boolean
    # ---------------------------------------------- M6: schedules -----------
    Schedule:
      title: Schedule
      description: >
        A recurring intent attached to a project assignment: it fires that
        assignment's *pinned* revision with the fixed `inputs` (ADR-0032).
        `cron_expr` is a 5-field expression evaluated in UTC — `next_run_at`
        is the derived clock (always set; the row's CHECK guarantees it),
        `last_run_at`/`last_run_id` the record of the most recent fire (null
        until then). Missed fires collapse into ONE late run; they are never
        backfilled. `version` counts config edits only — a fire never bumps
        it — and is the PATCH route's optimistic-concurrency token.
      type: object
      required:
        [id, project_id, assignment_id, cron_expr, inputs, enabled,
         next_run_at, version, created_by, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        assignment_id:
          type: string
          format: uuid
        cron_expr:
          type: string
          description: >
            Normalized to single spaces (what the parser reports back).
            Refused at the door: seconds/year fields, month/weekday names,
            `?`, `L`, `W`, `#`, `H`, wrapped ranges.
        inputs:
          type: object
          additionalProperties: true
          description: >
            Fixed run inputs, validated against the pinned revision's input
            schema at create and edit — never at fire time re-derivation.
        enabled:
          type: boolean
        next_run_at:
          type: string
          format: date-time
        last_run_at:
          type: ["string", "null"]
          format: date-time
        last_run_id:
          type: ["string", "null"]
          format: uuid
        version:
          type: integer
          minimum: 1
        created_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ScheduleList:
      title: ScheduleList
      type: object
      required: [schedules]
      properties:
        schedules:
          type: array
          items:
            $ref: "#/components/schemas/Schedule"
    ScheduleCreate:
      title: ScheduleCreate
      description: Request body for `createProjectSchedule`.
      type: object
      required: [assignment_id, cron_expr]
      properties:
        assignment_id:
          type: string
          format: uuid
        cron_expr:
          type: string
        inputs:
          type: object
          additionalProperties: true
        enabled:
          type: boolean
          default: true
    SchedulePatch:
      title: SchedulePatch
      description: >
        Request body for `patchSchedule`. `version` is required (the value the
        caller read); at least one editable member must be present.
      type: object
      required: [version]
      minProperties: 2
      properties:
        version:
          type: integer
          minimum: 1
        cron_expr:
          type: string
        inputs:
          type: object
          additionalProperties: true
        enabled:
          type: boolean
    # -------------------------------------------------- M4: runs ------------
    RunStatus:
      title: RunStatus
      type: string
      enum: [queued, preparing, running, waiting_human, paused, completed, failed, cancelled, interrupted]
      description: >
        `01`'s run machine. `waiting_human` means a gate holds a *scope* (the
        run's other branches keep running); `interrupted` is reconciler-written
        only (lease/deadline/volume-loss arms — never the dead process itself),
        always with a `failed_cause`, and with `workspace_lost` never
        auto-retried (case 20's honest arm).
    RunSummary:
      title: RunSummary
      description: >
        A row of the project run list. The digests are on the list row on
        purpose: "which revision is this run actually executing?" is a
        first-glance question, and the answer is pinned, immutable data.
      type: object
      required:
        [id, project_id, pipeline_id, pipeline_revision_id, revision_digest,
         plan_digest, status, depth, priority, created_at]
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        pipeline_id:
          type: string
          format: uuid
        pipeline_revision_id:
          type: string
          format: uuid
        assignment_id:
          type: ["string", "null"]
          format: uuid
          description: Null for a direct `pipeline_revision_id` start.
        revision_digest:
          type: string
          pattern: "^(sha256:)?[0-9a-f]{64}$"
          description: Serialized verbatim as the run stored it.
        plan_digest:
          type: string
          pattern: "^(sha256:)?[0-9a-f]{64}$"
        status:
          $ref: "#/components/schemas/RunStatus"
        failed_cause:
          type: ["string", "null"]
          description: >
            Why the run stopped when it did not complete — a node reference
            (`node_execution_failed:/implement`), a budget name
            (`run_duration_exceeded`, `expression_eval_budget_exceeded`,
            `node_execution_budget_exceeded`, `max_duration_exceeded`,
            `child_depth_exceeded`) or `until_exhausted`. Required by the DB
            for `failed`/`interrupted` (`runs_terminal_cause`).
        depth:
          type: integer
          minimum: 0
          maximum: 2
          description: 0 for a root run; a child is its parent's depth + 1. Depth 3 is refused twice over.
        parent_run_id:
          type: ["string", "null"]
          format: uuid
          description: Non-null exactly when `depth > 0` (`runs_root_is_unparented`).
        triggered_by:
          type: ["string", "null"]
          format: uuid
          description: Null for a child run or a system start.
        priority:
          type: integer
          minimum: 0
          maximum: 10
          description: Claim tie-break only (ADR-0023 § 4), never starvation insurance.
        created_at:
          type: string
          format: date-time
        started_at:
          type: ["string", "null"]
          format: date-time
        finished_at:
          type: ["string", "null"]
          format: date-time
          description: Non-null exactly when `status` is terminal (`runs_terminal_timestamped`).
    RunSummaryList:
      title: RunSummaryList
      type: object
      required: [runs]
      properties:
        runs:
          type: array
          items:
            $ref: "#/components/schemas/RunSummary"
    RunPlacement:
      title: RunPlacement
      description: >
        The honest scheduling answer, deliberately **not** the worker id:
        affinity is a one-way door set by the worker that prepared the run's
        workspace (ADR-0023 § 4), M4 has no rebinding, and browser knowledge
        of fleet topology stops where M3's stops.
      type: object
      required: [scheduled]
      properties:
        scheduled:
          type: boolean
          description: >
            False on a `queued`/`preparing` run means "waiting for the run's
            worker" — the affinity worker is offline, draining, or full, and
            nothing pretends otherwise (`queued_unbindable_runs` counts these).
        reason:
          type: ["string", "null"]
          enum: [volume_affinity_unsatisfied, null]
    RunInputValue:
      title: RunInputValue
      description: >
        One validated run input: the value bindings read, plus where it came
        from. `origin` distinguishes what the submitter sent from defaults and
        retry-time overrides, so "what did the loop actually receive?" is
        answerable from the row.
      type: object
      required: [name, value, origin]
      properties:
        name:
          type: string
          pattern: "^[a-z][a-z0-9_]{0,62}$"
        value: {}
        origin:
          type: string
          enum: [submitted, default, override]
    RunRepoSnapshot:
      title: RunRepoSnapshot
      description: >
        A repository's starting base commit for the run (`03` step 2) — a
        commit identity, never a path.
      type: object
      required: [repository_id, base_commit]
      properties:
        repository_id:
          type: string
          format: uuid
        base_commit:
          type: string
    Run:
      title: Run
      description: >
        The run detail: everything the summary carries, plus the pause/
        cancellation facts, the honest placement view, the validated inputs and
        the expression-evaluation counter (the advancer fails the run at the
        10 000 budget, so the counter is load-bearing telemetry, not trivia).
      allOf:
        - $ref: "#/components/schemas/RunSummary"
        - type: object
          required: [digest_scope, expression_evaluations, placement]
          properties:
            digest_scope:
              type: string
            paused_reason:
              type: ["string", "null"]
              enum: [human_takeover, manual, worker_unavailable, null]
              description: Non-null exactly when `status` is `paused` (`runs_paused_reasoned`).
            cancel_requested_at:
              type: ["string", "null"]
              format: date-time
              description: >
                Set by `POST /cancel`; the advancer's cascade and the worker's
                honest close follow from it — the timestamp is the request, not
                the stop.
            placement:
              $ref: "#/components/schemas/RunPlacement"
            expression_evaluations:
              type: integer
              minimum: 0
              description: CEL evaluations this run has spent (cap 10 000, § 6).
            inputs:
              type: array
              items:
                $ref: "#/components/schemas/RunInputValue"
            repo_snapshot:
              type: array
              items:
                $ref: "#/components/schemas/RunRepoSnapshot"
    RunCreate:
      title: RunCreate
      description: >
        Request body for `createRun`: exactly one of `assignment_id` or
        `pipeline_revision_id`. `inputs` is validated against the pinned
        revision's `spec.inputs` in the creating transaction (`422` with
        validate-style units otherwise; absent optional inputs take declared
        defaults, recorded as `origin: default` in `run_inputs`).
      type: object
      minProperties: 1
      properties:
        assignment_id:
          type: string
          format: uuid
        pipeline_revision_id:
          type: string
          format: uuid
        inputs:
          type: object
          additionalProperties: true
          description: Values keyed by declared input name; unknown names are `422`.
        idempotency:
          type: string
          pattern: "^[A-Za-z0-9._-]{1,128}$"
          description: >
            Same semantics as the `Idempotency-Key` header (which wins when
            both are present); the mapping is stored per project for 24 h.
    RunCreateResponse:
      title: RunCreateResponse
      description: >
        The `201` (and the `200` idempotent replay): the run is queued, and
        every later fact about it arrives through `GET /runs/{runId}` or its
        event stream — this response proves creation and pinning, nothing else.
      type: object
      required: [run_id, status]
      properties:
        run_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [queued]
    RunRetryRequest:
      title: RunRetryRequest
      description: >
        Request body for `retryRun`. Omitted `node_instance_keys` targets every
        non-succeeded terminal node execution; named keys must exist and be
        terminal (`409` otherwise). Scope bookkeeping is recomputed so an
        `until` restarts its dead iteration, not the loop.
      type: object
      properties:
        node_instance_keys:
          type: array
          minItems: 1
          items:
            type: string
        inputs:
          type: object
          additionalProperties: true
          description: Retry-time input overrides (attempt-level `overrides` and `run.retried`'s `input_names` name them).
        reason:
          type: string
          maxLength: 512
          description: Free text for the audit trail ("crash", "flaky test"), not interpreted.
    RunConflictProblem:
      title: RunConflictProblem
      description: >
        `409` for a run action: `run_not_retriable`, `checkpoint_unavailable`
        (nothing was reset — that is the point), `idempotency_key_mismatch`,
        or a lifecycle action against a state that refuses it. The body names
        the run's current status so the client can re-read cheaply.
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [run_id, run_status]
          properties:
            run_id:
              type: string
              format: uuid
            run_status:
              $ref: "#/components/schemas/RunStatus"
    # ----------------------------------------- M4: node executions ----------
    ErrorClass:
      title: ErrorClass
      type: string
      enum:
        - infra
        - interrupted
        - timeout
        - agent_error
        - invalid_output
        - predicate_error
        - sandbox_enforcement_failed
        - workspace_lost
        - binding_error
        - approval_expired
        - cancelled
      description: >
        ADR-0023 § 7's execution-failure taxonomy, the same enum the
        `attempts.error_class` CHECK enforces. `predicate_error` is an
        *indeterminate* expression — never treated as false (ADR-0022 § 3);
        cost exhaustion reports this class with the code
        `predicate_cost_exceeded` (§ 6).
    NodeExecutionStatus:
      title: NodeExecutionStatus
      type: string
      enum: [pending, ready, leased, running, succeeded, failed, skipped, waiting, cancelled, interrupted]
      description: >
        `01`'s node machine, two-path per ADR-0023 § 3: control-plane work
        moves `pending → ready → succeeded` inside `serve` and a DB CHECK
        (`node_executions_control_plane_never_leased`) makes `leased`/`running`
        on such a row *unrepresentable* — the two writers cannot lie about the
        same row.
    NodeExecution:
      title: NodeExecution
      description: >
        One execution of one node at one place in the run's tree of scopes.
        `node_instance_key` is the path identity (`/build_until_verified[2]/
        review`, `/fan_out[3]/invoke`) — a text path of node ids with
        iteration/index suffixes, unique per run, never a position index
        (`01` invariant 6). `status` is the *execution* fact; `outcome` is the
        business fact (`03`'s test that ran and failed is `succeeded` with
        `outcome: failed` — the distinction the exit loop reads).
      type: object
      required:
        [id, run_id, node_id, kind, node_instance_key, scope_key,
         execution_location, status, attempt_count, attempt_limit, in_flight,
         depends_on, artifact_refs, created_at]
      properties:
        id:
          type: string
          format: uuid
        run_id:
          type: string
          format: uuid
        node_id:
          type: string
          pattern: "^[a-z][a-z0-9_]{0,62}$"
        kind:
          type: string
          description: Catalogue name verbatim (`agent.acp`, `process.exec`, `human.approval`, `until`, `for_each`, `condition`, `pipeline.invoke`, ...).
        node_instance_key:
          type: string
          pattern: "^(/[a-z][a-z0-9_]{0,62})(\\[[0-9]{1,9}\\])?(/[a-z][a-z0-9_]{0,62}(\\[[0-9]{1,9}\\])?)*$"
          maxLength: 2048
        scope_key:
          type: string
          description: "'/' for the root scope, otherwise the parent scope key — the path this execution's siblings share."
        execution_location:
          type: string
          enum: [worker, control_plane]
        status:
          $ref: "#/components/schemas/NodeExecutionStatus"
        outcome:
          type: ["string", "null"]
          description: Business outcome (`passed`/`failed`/`rejected`/...), distinct from `status` by design.
        error_class:
          description: >
            ADR-0023 § 7 class when the execution failed; null when there was
            no execution error.
          allOf:
            - $ref: "#/components/schemas/ErrorClass"
        failed_cause:
          type: ["string", "null"]
        outputs:
          description: "The validated output object (`01` invariant 4: present exactly when `succeeded`, possibly `{}`)."
          type: ["object", "null"]
          additionalProperties: true
        artifact_refs:
          type: array
          items:
            type: object
            additionalProperties: true
        depends_on:
          type: array
          items:
            type: string
          description: Node ids *in this scope* (the compiler rejects edges leaving a scope).
        attempt_count:
          type: integer
          minimum: 0
        attempt_limit:
          type: integer
          minimum: 1
          description: "`retry.maxAttempts` clamped to the assignment ceiling, recorded at compile time."
        in_flight:
          type: integer
          minimum: 0
          description: Live children for fan-out accounting (`for_each.maxConcurrency` enforcement).
        waiting_reason:
          type: ["string", "null"]
          enum: [approval, child_run, join_deferred, null]
        iterations:
          type: integer
          minimum: 0
          description: "`until` scopes only — iterations run so far."
        items:
          type: integer
          minimum: 0
          description: "`for_each` scopes only — items dispatched."
        created_at:
          type: string
          format: date-time
        ready_at:
          type: ["string", "null"]
          format: date-time
        finished_at:
          type: ["string", "null"]
          format: date-time
    NodeExecutionList:
      title: NodeExecutionList
      type: object
      required: [node_executions]
      properties:
        node_executions:
          type: array
          items:
            $ref: "#/components/schemas/NodeExecution"
    CelEnvelope:
      title: CelEnvelope
      description: >
        The object a `nodes.<id>` expression reads — materialized by the
        advancer for **every** declared node in the scope, including
        unscheduled ones (`{status, outcome: null, outputs: {}, artifact_refs:
        []}`), which is what makes a `when`/`skipped` decision explainable
        after the fact (ADR-0022 § 3).
      type: object
      required: [status, outputs, artifact_refs]
      properties:
        status:
          $ref: "#/components/schemas/NodeExecutionStatus"
        outcome:
          type: ["string", "null"]
        outputs:
          type: object
          additionalProperties: true
        artifact_refs:
          type: array
          items:
            type: object
            additionalProperties: true
    # ------------------------------------------------ M4: attempts ----------
    AttemptStatus:
      title: AttemptStatus
      type: string
      enum: [queued, leased, running, succeeded, failed, cancelled, interrupted]
      description: >
        The claim unit's machine (ADR-0023 § 4). A `queued` row is unowned by
        construction (`attempts_queued_unowned`), a `leased`/`running` row
        always carries the full lease triple (worker, deadline, token —
        `attempts_lease_is_a_triple`) that this API deliberately does not
        serialize, and a terminal row always has `finished_at`.
    Attempt:
      title: Attempt
      description: >
        One worker's honest report on one unit of node work. **Never**
        `worker_id`, `fencing_token` or `lease_expires_at` (ADR-0016 § 8 —
        leases are asserted server-side; the fence, not the client, keeps a
        stale writer out, `12` case 3). `scheduled_at` is the *computed*
        backoff landing time persisted by the retry scheduler — `12` case 5's
        visible half: the promise survives any restart because it is a column,
        not a goroutine. `detail` is bounded at 512 bytes and
        redaction-scanned.
      type: object
      required:
        [id, node_execution_id, run_id, attempt_number, status, output_errors,
         artifact_refs, scheduled_at, created_at]
      properties:
        id:
          type: string
          format: uuid
        node_execution_id:
          type: string
          format: uuid
        run_id:
          type: string
          format: uuid
        attempt_number:
          type: integer
          minimum: 1
          description: Unique per node execution (`09`'s triple, enforced transitively); attempts append, never overwrite.
        status:
          $ref: "#/components/schemas/AttemptStatus"
        error_class:
          description: >
            Set exactly when `status` is `failed`
            (`attempts_failed_has_class`); also `interrupted`/`cancelled` arms.
          allOf:
            - $ref: "#/components/schemas/ErrorClass"
        detail:
          type: ["string", "null"]
          maxLength: 512
          description: Bounded, redaction-scanned diagnostic.
        output_errors:
          type: array
          items:
            type: object
            additionalProperties: true
          description: The `invalid_output` evidence — one unit per schema violation, as the validator spoke it.
        scheduled_at:
          type: string
          format: date-time
          description: When this attempt became claimable (backoff landing time, persisted).
        deadline_at:
          type: ["string", "null"]
          format: date-time
          description: The node's `timeoutSeconds` boundary; the reconciler's pass-3 partner.
        overrides:
          type: ["object", "null"]
          additionalProperties: true
          description: Run-local input overrides this attempt ran with (the `run.override.applied` event stays reserved; this row is where overrides are visible).
        retry_context:
          type: ["object", "null"]
          additionalProperties: true
          description: >
            What the previous attempt knew: `{attempt, error_class,
            head_commit, modified_path_count}` for `continue_workspace` (the
            default — edits survive and the retry is *told*), plus the restore
            boundary when `restore_checkpoint` applied.
        artifact_refs:
          type: array
          items:
            type: object
            additionalProperties: true
        outputs:
          description: >
            The validated output object, present exactly when `succeeded`
            (`attempts_succeeded_has_outputs` — `01` invariant 4; possibly
            `{}`). Bounded inline at 32 KiB; oversize content travels as a
            `kind=json` artifact with the ref here.
          type: ["object", "null"]
          additionalProperties: true
        outputs_digest:
          type: ["string", "null"]
          pattern: "^sha256:[0-9a-f]{64}$"
        conversation_id:
          type: ["string", "null"]
          format: uuid
          description: The conversation an `agent.acp` attempt owns; null for `process.exec`/`model.chat`.
        turn_id:
          type: ["string", "null"]
          format: uuid
          description: Set exactly with `conversation_id` (`attempts_agent_turn_pair` makes half a pair unrepresentable).
        created_at:
          type: string
          format: date-time
        started_at:
          type: ["string", "null"]
          format: date-time
        finished_at:
          type: ["string", "null"]
          format: date-time
    NodeExecutionDetail:
      title: NodeExecutionDetail
      description: >
        The node execution plus everything that explains it: the full attempt
        history, the boundary checkpoint when one exists, and the CEL envelope
        expressions against this node actually saw.
      allOf:
        - $ref: "#/components/schemas/NodeExecution"
        - type: object
          required: [attempts, cel_envelope]
          properties:
            attempts:
              type: array
              items:
                $ref: "#/components/schemas/Attempt"
            checkpoint:
              description: The durable boundary record for this execution, when it succeeded with one.
              allOf:
                - $ref: "#/components/schemas/RunCheckpoint"
            cel_envelope:
              $ref: "#/components/schemas/CelEnvelope"
    # --------------------------------------------- M4: checkpoints ----------
    CheckpointRepoState:
      title: CheckpointRepoState
      description: >
        One repository's state at a boundary: commits and a pointer, never
        paths. `modified_paths_artifact` is an artifact *id* holding the
        manifest (inline ≤ 5 000 paths, else the manifest *is* the artifact —
        § 6).
      type: object
      required: [repository_id, base_commit, head_commit]
      properties:
        repository_id:
          type: string
          format: uuid
        base_commit:
          type: string
        head_commit:
          type: string
        modified_paths_artifact:
          type: ["string", "null"]
          format: uuid
    RunCheckpoint:
      title: RunCheckpoint
      description: >
        D-009's durable boundary record (`run_checkpoints`, ADR-0023 § 6):
        what the world looked like after a succeeded worker node execution,
        so a retry can inherit it. Same-volume only — `volume_id` is required
        because a checkpoint without its volume's identity is a promise nobody
        can keep (D-024 stays **Open**; this is what `restore_checkpoint`
        restores *from*, and `run.checkpoint_restored` is the event that proves
        the engine knows the difference from `continue_workspace`).
      type: object
      required:
        [run_id, node_execution_id, attempt_id, node_instance_key,
         inputs_digest, outputs_digest, repo_states, artifact_refs,
         workspace_id, volume_id, worker_id, plan_digest, created_at]
      properties:
        run_id:
          type: string
          format: uuid
        node_execution_id:
          type: string
          format: uuid
        attempt_id:
          type: string
          format: uuid
        node_instance_key:
          type: string
        inputs_digest:
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
        outputs_digest:
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
        repo_states:
          type: array
          items:
            $ref: "#/components/schemas/CheckpointRepoState"
        artifact_refs:
          type: array
          items:
            type: object
            additionalProperties: true
          description: The `kind=checkpoint` capture plus its `kind=json` manifest (ADR-0020 D8).
        workspace_id:
          type: string
          format: uuid
        volume_id:
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
        worker_id:
          type: string
          format: uuid
          description: The worker whose volume holds the boundary — M3's fleet identity, already browser-visible.
        plan_digest:
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
        created_at:
          type: string
          format: date-time
    RunCheckpointList:
      title: RunCheckpointList
      type: object
      required: [checkpoints]
      properties:
        checkpoints:
          type: array
          items:
            $ref: "#/components/schemas/RunCheckpoint"
    # ------------------------------------------------- M4: run tree ---------
    RunTree:
      title: RunTree
      description: >
        A run and the child runs its `pipeline_invocations` produced,
        recursively (max depth 2 under the root). A child is a *run* — its own
        workspace, attempts and stream — this row is the relationship: which
        node execution invoked it, with which wait policy, resolved against
        which revision at run start (never re-resolved mid-flight, `12` case
        11's child-side twin).
      type: object
      required: [run, children]
      properties:
        run:
          $ref: "#/components/schemas/RunSummary"
        node_instance_key:
          type: ["string", "null"]
          description: The invoking node execution's key; null on the root.
        wait_policy:
          type: ["string", "null"]
          enum: [completion, started, detach, null]
          description: >
            `detach` exists in the enum because the column's CHECK carries it;
            M4 refuses it at validate (`unsupported_policy`, ADR-0024 § 4), so
            no M4 tree shows one.
        depth:
          type: integer
          minimum: 1
          maximum: 2
          description: This child's distance below the root; null on the root itself.
        children:
          type: array
          items:
            $ref: "#/components/schemas/RunTree"
    # ---------------------------------------------- M4: approvals ----------
    Approval:
      title: Approval
      description: >
        A durable pipeline gate (`approval_requests`) — not an ACP permission
        prompt (`permission_requests`, M2): different table, different
        authorizer, different CAS (ADR-0023 § 9). Holds **no worker and no
        lease**: while a gate is `pending` there is no attempt behind it (§ 5.3,
        asserted in `12` C9a). `state` is the lifecycle; `decision` only exists
        with a decider, and the consistency CHECK
        (`approvals_decided_consistency`) makes `decided` without a decision or
        `denied` with one unrepresentable. A rejection is a business outcome
        downstream (`outputs.decision = rejected` on the node), only a timeout
        is an execution failure.
      type: object
      required:
        [id, project_id, run_id, node_execution_id, kind, summary,
         artifact_refs, approver_roles, approver_user_ids, deadline_at,
         on_timeout, re_requested, state, version, created_at]
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        run_id:
          type: string
          format: uuid
        node_execution_id:
          type: string
          format: uuid
        node_instance_key:
          type: ["string", "null"]
          description: Denormalized for list rendering.
        kind:
          type: string
          enum: [pipeline_gate, promotion_deferred]
          description: Only `pipeline_gate` occurs in M4; the other member is M6's, kept so the wire does not rename later.
        summary:
          type: string
          maxLength: 65536
          description: The gate text in full (the journal carries only its digest).
        artifact_refs:
          type: array
          items:
            type: object
            additionalProperties: true
        approver_roles:
          type: array
          items:
            type: string
            enum: [maintainer, contributor, viewer]
          description: Project roles evaluated **at decision time**, not snapshotted at gate-open.
        approver_user_ids:
          type: array
          items:
            type: string
            format: uuid
        deadline_at:
          type: string
          format: date-time
        on_timeout:
          type: string
          enum: [fail, cancel_run, expire]
          description: >
            `expire` re-requests exactly once (`re_requested` marks the second
            gate) and then fails — an approval can never hang forever.
        re_requested:
          type: boolean
        state:
          type: string
          enum: [pending, decided, expired, cancelled, denied]
        decision:
          type: ["string", "null"]
          enum: [approved, rejected, null]
        comments:
          type: ["string", "null"]
          maxLength: 8192
          description: The decider's note; never carried in an event (`approval.decided` says `comments_present`).
        decided_by:
          type: ["string", "null"]
          format: uuid
        decided_at:
          type: ["string", "null"]
          format: date-time
        version:
          type: integer
          minimum: 1
          description: The CAS token `decide` must echo; increments exactly once, for exactly one decision.
        created_at:
          type: string
          format: date-time
    ApprovalList:
      title: ApprovalList
      type: object
      required: [approvals]
      properties:
        approvals:
          type: array
          items:
            $ref: "#/components/schemas/Approval"
    ApprovalDecide:
      title: ApprovalDecide
      description: Request body for `decideApproval`.
      type: object
      required: [decision, version]
      properties:
        decision:
          type: string
          enum: [approved, rejected]
        comments:
          type: string
          maxLength: 8192
        version:
          type: integer
          minimum: 1
          description: The `version` the caller last read; a miss is `409` with the winner.
    ApprovalConflictProblem:
      title: ApprovalConflictProblem
      description: >
        `409` for a decision: the `Problem` shape plus the current gate state,
        so the losing click renders the winner's decision instead of guessing
        (`12` case 9d: exactly one `200`, and both callers see the same truth).
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [approval_id]
          properties:
            approval_id:
              type: string
              format: uuid
            approval:
              description: >
                The winner, as the loser must render it: state, decision,
                decider, version — the full gate is a `GET /approvals/{id}`
                fetch, the conflict body only answers "who beat me and to
                what".
              type: object
              required: [state, version]
              properties:
                state:
                  type: string
                  enum: [pending, decided, expired, cancelled, denied]
                decision:
                  type: ["string", "null"]
                  enum: [approved, rejected, null]
                decided_by:
                  type: ["string", "null"]
                  format: uuid
                version:
                  type: integer
                  minimum: 1
    # -------------------------------------------- M4: scheduler ops ---------
    SchedulerWorkerLoad:
      title: SchedulerWorkerLoad
      description: >
        One worker's claim capacity as registered (ADR-0023 § 4's predicate is
        `active_attempts < capacity`, so the ops page shows the same pair the
        claim SQL does).
      type: object
      required: [worker_id, name, capacity, active_attempts]
      properties:
        worker_id:
          type: string
          format: uuid
        name:
          type: string
        capacity:
          type: integer
          minimum: 1
          maximum: 16
        active_attempts:
          type: integer
          minimum: 0
    SchedulerStatus:
      title: SchedulerStatus
      description: >
        Engine telemetry (ADR-0023 Consequences, `02` Observability): enough
        to answer "is anything wedged and where?" without names of prompts,
        secrets or users in any field.
      type: object
      required:
        [attempts_by_status, oldest_queued_age_seconds, lease_expirations,
         max_retry_loop_depth, waiting_approvals, queued_unbindable_runs, workers]
      properties:
        attempts_by_status:
          type: object
          required: [queued, leased, running]
          properties:
            queued:
              type: integer
              minimum: 0
            leased:
              type: integer
              minimum: 0
            running:
              type: integer
              minimum: 0
        oldest_queued_age_seconds:
          type: ["number", "null"]
          minimum: 0
          description: Age of the oldest `queued` attempt; null when the queue is empty. The one number that says "the engine is not taking work".
        lease_expirations:
          type: integer
          minimum: 0
          description: Reconciler-observed attempt lease expirations since this replica started (each one is a `node.attempt.interrupted`).
        max_retry_loop_depth:
          type: integer
          minimum: 0
          description: Highest live `attempt_number` in flight — the runaway-retry guard's dashboard number.
        waiting_approvals:
          type: integer
          minimum: 0
          description: Gates in `pending`; no worker and no lease stand behind any of them.
        queued_unbindable_runs:
          type: integer
          minimum: 0
          description: Runs `queued` whose affinity worker is offline/draining/full (§ 5.2) — the single-point-of-failure made visible instead of guessed.
        workers:
          type: array
          items:
            $ref: "#/components/schemas/SchedulerWorkerLoad"
    EventEnvelope:
      $ref: ./schemas/event-envelope.schema.json
