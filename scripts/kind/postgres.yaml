# Throwaway Postgres for scripts/kind/test.sh ONLY — a scratch database the
# chart points at, never a deployment pattern (ADR-0082 Decision 9: Postgres
# arrives as an external database.url secretRef, the chart bundles no database).
#
# Image: postgres:18.6, the same tag the lab (compose.yml) and CI
# (.github/workflows/ci.yml) pin. The task brief asked for postgres:16; 16 is
# refused on purpose — ADR-0013 pins PostgreSQL 18 because the migrations'
# primary keys use the native `uuidv7()` (migrations/00001_m1_core.sql), which
# does not exist before PG 18. A 16 container would fail `migrate up`, i.e. fail
# the test for a reason that has nothing to do with the chart.
#
# The Secret `communication-postgres` (POSTGRES_PASSWORD) is created by the
# script with a random password: no credential ever appears in this file.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: communication-postgres
  namespace: communication
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: communication-postgres
  namespace: communication
  labels:
    app: communication-postgres
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: communication-postgres}
  template:
    metadata:
      labels: {app: communication-postgres}
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        # The official image's entrypoint needs to chown its data directory,
        # which a 10001 uid cannot do; this is the throwaway scratch, not the
        # pattern the chart asks anyone to copy.
        fsGroup: 999
      containers:
        - name: postgres
          image: postgres:18.6
          ports:
            - {containerPort: 5432, name: postgres}
          env:
            - {name: POSTGRES_USER, value: communication}
            - {name: POSTGRES_DB, value: communication}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: communication-postgres, key: password}
          volumeMounts:
            # Postgres 18 keeps the data directory under the cluster root, so
            # the mount has to be the parent.
            - {name: data, mountPath: /var/lib/postgresql}
          readinessProbe:
            # TCP, never the UNIX socket: a socket probe can go Ready against
            # the temporary initdb server on a fresh volume.
            exec: {command: ["pg_isready", "-h", "127.0.0.1", "-p", "5432", "-U", "communication", "-d", "communication"]}
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: communication-postgres}
---
apiVersion: v1
kind: Service
metadata:
  name: communication-postgres
  namespace: communication
  labels:
    app: communication-postgres
spec:
  selector: {app: communication-postgres}
  ports:
    - {name: postgres, port: 5432, targetPort: postgres}
