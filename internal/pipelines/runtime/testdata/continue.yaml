# The onExecutionError: continue arm, authored (contract § 9.2 nodeFailure):
# a fails, b skips, and the run still ends honestly — completed, with b's
# envelope reading "skipped". A run-level retry of a failed /a needs the stop
# arm, so that test uses stop.yaml rather than patching this plan.
apiVersion: communication.dev/v1alpha1
kind: Pipeline
metadata:
  name: continue-policy
spec:
  inputs:
    type: object
    required: [goal]
    properties:
      goal: {type: string, minLength: 1}
  policies:
    maxConcurrentNodes: 4
    maxDurationSeconds: 3600
    maxNodeExecutions: 50
    cancelPolicy: cascade
  nodes:
  - id: a
    kind: process.exec
    config:
      executable: a
    onFailure:
      onExecutionError: continue
  - id: b
    kind: process.exec
    dependsOn: [a]
    config:
      executable: b
  resultBindings:
    b_status: ${{ nodes.b.status }}
