# `==99` -> `==3` rewrite, prints the reviewer JSON), so C4-C9 always take the same branch.
# Node ids are byte-identical to document 1 — the compiled node_instance_key SETS are equal,
# which is what C1 asserts across the two runs (C1 twin requirement). `passWhen` is unchanged.
apiVersion: communication.dev/v1alpha1
kind: Pipeline
metadata:
  name: feature-development-deterministic
  description: Deterministic process.exec twin of feature-development; identical node key set.
