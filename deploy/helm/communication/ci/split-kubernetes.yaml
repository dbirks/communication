# helm lint / helm template CI values: split mode with the pod launcher, the ONE
# configuration that renders RBAC + NetworkPolicy (ADR-0082 Decision 6/7).
mode: split
image:
  repository: ghcr.io/dbirks/communication-worker
  tag: kind
serveImage:
  repository: ghcr.io/dbirks/communication
  tag: kind
serve:
  replicas: 2
database:
  urlSecret:
    name: communication-database-url
    key: url
oidc:
  issuer: http://oidc:8080/default
  clientId: communication-dev
devLogin: true
publicUrl: http://communication.local
keyringSecret: communication-keyring
worker:
  enforcement: required
  launcher: kubernetes
  agentNamespace: communication-agents
  # The release's own claim lives in the release namespace and cannot be mounted
  # by a pod in another one, so attempts mount this claim instead — the kind
  # script binds it to the same volume as `communication-data` and then reads a
  # file back through the worker pod to prove the workspace really is shared
  # (ADR-0082 Decision 4).
  workspacePVC: communication-agents-data
  capacity: 4
networkPolicy:
  # Documentation-shaped example: a model endpoint and a git host, in CIDR form
  # because kind's CNI speaks pod/IP/CIDR and nothing else (research § 2.4).
  egressCIDRs:
    - 198.51.100.7/32
    - 203.0.113.0/24
ingress:
  enabled: true
  host: communication.local
  className: nginx
persistence:
  size: 5Gi
