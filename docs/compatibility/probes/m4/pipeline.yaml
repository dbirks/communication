# docs/compatibility/probes/m4/pipeline.yaml — the § 7 exit seed pipeline set.
# Provenance: document 1 is internal/pipelines/testdata/feature-development-contract.yaml
# (docs/m4-contract.md § 9.3, the compiled-against contract shape) adjusted to § 7's exit
# narrative: (a) the C1 deterministic twin is published beside it as document 2 with the SAME
# node ids, so both revisions compile to an identical node_instance_key set; (b) the § 7.0
# fixture is Python (pytest), so the test node executes the committed fixture script instead
# of `go`, keeping the § 9.3 slots (cwd, json_from_path, {exit_code, result} outputs); (c) the
# C8 fan-out arm lives inside the sample as the when-gated emit_items -> fan_out branch
# (inputs.fanout=false keeps C1's key set clean; =true arms C8a-e against fanout_count items);
# (d) maxChildDepth is 1 because fan_out invokes document 3. Every other line is verbatim § 9.3
# except (e) document 1's /plan output: § 9.3 declares plan as a string, but every real
# m4-planner reply captured live in the lab answers an OBJECT
# {"plan":{"goal","summary","findings":[],"steps":[]}}, which against § 9.3 the outputs validator
# rejects (invalid_output: got object, want string). The agent variant therefore declares the
# observed object shape; the twin's /plan keeps its string plan because C1 compares
# node_instance_key SETS across variants, not output shapes. `summary` is required because the
# expression language has no join/format function (ADR-0022 § 5): interpolating plan.findings or
# plan.steps into the /approve gate's summary renders a raw JSON array the Inbox card truncates
# mid-array, so the gate shows plan.goal plus plan.summary (a <=600-char human-readable plan) and
# nothing else; findings/steps stay in the node outputs; and (f) document 1's /review evidence: §
# 9.3 declares evidence as a string, but the real m4-reviewer replies captured live answer an
# ARRAY of observation strings (two of three) or one string (one of three), and against § 9.3 the
# outputs validator refuses the array (invalid_output: at /evidence: got array, want string). The
# /review prompt now names the array as the shape; the declared schema admits both observed shapes
# ({type: [string, array], items: {type: string}}) so a prose-shaped answer costs an attempt
# instead of the run, and the loop's review_feedback binding carries the same union to /implement
# (an agent reader, via expr.Stringify's canonical JSON). The twin keeps § 9.3's string because
# m4-exit.sh answers one, and C1 compares node_instance_key SETS, not output shapes. README § 7
# deviations 6-7 carry the detail.
# Validated offline against internal/pipelines/schema/assets/pipeline-v1alpha1.schema.json —
# see README.md "Offline validation" for the exact commands. seed.sh posts one document per
# `---`-delimited slice; do not re-indent or reflow (source_sha256 rides the bytes).
#
# Document 1: agent-driven variant — Plan -> Approve -> Implement -> Test -> Review ->
# Loop -> verdict, C8 fan-out arm, then publish evidence.
apiVersion: communication.dev/v1alpha1
kind: Pipeline
metadata:
  name: feature-development
  description: Plan, approve, implement, test, review, loop until verified, publish evidence.
spec:
  inputs:
    type: object
    required: [goal, repository]
    properties:
      goal: {type: string, minLength: 1}
      repository: {type: string, minLength: 1}
      acceptance_criteria:
        type: string
        default: Tests pass, the plan is followed, and the reviewer approves.
      fanout:
        type: boolean
        default: false
        description: Arms the C8 for_each fan-out branch (emit_items + fan_out run only when true).
      fanout_count:
        type: integer
        minimum: 0
        maximum: 1000
        default: 0
        description: Items the m4-exit.sh items fixture emits (C8a 0, C8b-e 25).
  outputs:
    type: object
    required: [implementation_summary]
    properties:
      implementation_summary: {type: string}
      review_approved: {type: boolean}
      iterations: {type: integer}
  policies:
    maxConcurrentNodes: 1
    maxDurationSeconds: 14400
    maxNodeExecutions: 200
    maxChildDepth: 1
    workspaceMode: worktree
    cancelPolicy: cascade
  nodes:
  - id: plan
    kind: agent.acp
    timeoutSeconds: 900
    retry:
      maxAttempts: 3
      backoff: {baseSeconds: 5, multiplier: 2, maxSeconds: 120, jitter: true}
      retriableErrors: [infra, interrupted, timeout, agent_error, invalid_output]
    config:
      profile: m4-planner
      sessionMode: new
      prompt: |
        Goal: ${{ inputs.goal }}
        Acceptance criteria: ${{ inputs.acceptance_criteria }}
        Reply with JSON {"plan": ...} only, where plan is an OBJECT of exactly this shape:
        {"goal": "<one-sentence objective>",
         "summary": "<the plan as a human reads it>",
         "findings": ["<one observed fact each>"],
         "steps": [{"id": 1, "file": "<repo path, omit if none>", "action": "<the change to make>"}]}
        goal is a non-empty string. summary is REQUIRED and is the ONLY plan text a human sees at
        the approval gate: at most 600 characters, 2-6 short lines, plain text or simple "- "
        bullets, one planned change per line in order, no JSON, no braces or quotes, nothing that
        only makes sense next to the full findings/steps arrays. findings is an array of strings,
        steps holds at least one step and every step's action is a non-empty string. Never wrap
        plan in a string.
    outputs:
      type: object
      required: [plan]
      properties:
        plan:
          type: object
          required: [goal, summary, findings, steps]
          properties:
            goal: {type: string, minLength: 1}
            summary: {type: string, minLength: 1, maxLength: 600}
            findings: {type: array, items: {type: string}}
            steps:
              type: array
              minItems: 1
              items:
                type: object
                required: [action]
                properties:
                  id: {type: integer}
                  file: {type: string}
                  action: {type: string, minLength: 1}
  - id: approve
    kind: human.approval
    dependsOn: [plan]
    retry:
      maxAttempts: 1
    config:
      summary: |
        Plan for ${{ inputs.goal }}
        Objective: ${{ nodes.plan.outputs.plan.goal }}
        ${{ nodes.plan.outputs.plan.summary }}
      approverRoles: [maintainer]
      deadlineSeconds: 86400
      onTimeout: fail
  - id: build_until_verified
    kind: until
    dependsOn: [approve]
    timeoutSeconds: 7200
    config:
      maxIterations: 4
      maxDurationSeconds: 7200
      passWhen: nodes.test.outputs.result.successful == true && nodes.review.status == 'succeeded' && nodes.review.outputs.approved == true
      carryForward: true
      body:
        nodes:
        - id: implement
          kind: agent.acp
          retry:
            maxAttempts: 2
            backoff: {baseSeconds: 10, multiplier: 2, maxSeconds: 120, jitter: true}
            retriableErrors: [infra, interrupted, timeout, agent_error]
          config:
            profile: m4-implementer
            sessionMode: resume_if_supported
            fallback: new
            workspace:
              mode: run_workspace
              repositories: ['${{ inputs.repository }}']
            secretRefs: [project/test-database-url]
            prompt: |
              Implement the approved plan in repository ${{ inputs.repository }}.
              Goal: ${{ inputs.goal }}
              Previous reviewer feedback: ${{ has(previous.review_feedback) ? previous.review_feedback : '(first iteration: no prior review)' }}
              Reply with JSON of exactly this shape:
              {"summary": "<what you changed and why, in prose>",
               "files_changed": ["<repo path>"]}
              summary is ONE non-empty plain-text string — no JSON, no nested object, no array.
              files_changed is an ARRAY of repository path strings, one path per element (paths
              only, never objects and never a single string listing them), and [] when nothing
              changed. Write nothing outside this object.
          outputs:
            type: object
            required: [summary]
            properties:
              summary: {type: string, minLength: 1}
              files_changed: {type: array, items: {type: string}}
        - id: test
          kind: process.exec
          dependsOn: [implement]
          timeoutSeconds: 900
          retry:
            maxAttempts: 2
            backoff: {baseSeconds: 5, multiplier: 2, maxSeconds: 60, jitter: false}
            retriableErrors: [infra, interrupted]
          config:
            executable: m4-exit.sh
            args: [test]
            cwd: repos/app
            workspace:
              mode: run_workspace
              repositories: ['${{ inputs.repository }}']
            outputExtraction: {mode: json_from_path, path: build/test-result.json}
          outputs:
            type: object
            required: [exit_code, result]
            properties:
              exit_code: {type: integer}
              result:
                type: object
                required: [successful]
                properties:
                  successful: {type: boolean}
                  packages: {type: array, items: {type: object}}
        - id: review
          kind: agent.acp
          dependsOn: [test]
          retry:
            maxAttempts: 2
            backoff: {baseSeconds: 10, multiplier: 2, maxSeconds: 120, jitter: true}
            retriableErrors: [infra, interrupted, timeout, agent_error, invalid_output]
          config:
            profile: m4-reviewer
            sessionMode: new
            workspace:
              mode: read_only
              repositories: ['${{ inputs.repository }}']
            prompt: |
              Decide whether this iteration's change is verified and may be approved.
              Goal: ${{ inputs.goal }}
              Acceptance criteria: ${{ inputs.acceptance_criteria }}
              Implementer's summary for this iteration: ${{ nodes.implement.outputs.summary }}
              Files the implementer reports changing: ${{ nodes.implement.outputs.files_changed }}
              Test result: ${{ nodes.test.outputs.result }}
              The plan was written and approved BEFORE this loop ran and its text is not repeated
              here: judge the change against the goal and the acceptance criteria above plus what
              you can read in the workspace. There is no plan document in the workspace, so never
              return approved=false because a plan document, plan file, or plan section is missing,
              and never compare the change to a plan you cannot see. The goal and the acceptance
              criteria are the whole contract.
              Approval rule: return approved=true when the test result above reports
              successful=true AND the change in the workspace serves the goal and satisfies every
              acceptance criterion. Return approved=false only for a concrete defect you observed —
              a failing test, a criterion the code misses, or a regression — named in evidence.
              Reply with JSON of exactly this shape:
              {"approved": true,
               "evidence": ["<one observed fact per element>"],
               "findings": ["<one verdict per criterion>", "<the recommendation, last>"]}
              approved is a JSON boolean. evidence is an ARRAY of strings — one observed fact
              per element, plain sentences — never one string holding the whole list and never
              an object. findings is an ARRAY of strings: one verdict per criterion, then the
              recommendation as the last element. Either array may be empty, but each is always
              an array and never null. Write nothing outside this object.
          outputs:
            type: object
            required: [approved, evidence]
            properties:
              approved: {type: boolean}
              evidence: {type: [string, array], items: {type: string}}
              findings: {type: array, items: {type: string}}
      resultBindings:
        implementation_summary: ${{ nodes.implement.outputs.summary }}
        review_feedback: ${{ nodes.review.outputs.evidence }}
        approved: ${{ nodes.review.outputs.approved }}
    outputs:
      type: object
      required: [iterations, approved]
      properties:
        iterations: {type: integer}
        approved: {type: boolean}
        implementation_summary: {type: string}
        review_feedback: {type: [string, array], items: {type: string}}
  - id: emit_items
    kind: process.exec
    dependsOn: [approve]
    when: inputs.fanout == true
    timeoutSeconds: 300
    retry:
      maxAttempts: 2
      backoff: {baseSeconds: 5, multiplier: 2, maxSeconds: 60, jitter: false}
      retriableErrors: [infra, interrupted]
    config:
      executable: m4-exit.sh
      args: [items]
      env:
        M4_FANOUT_COUNT: ${{ string(inputs.fanout_count) }}
      outputExtraction: {mode: json_from_stdout}
    outputs:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {type: object}}
  - id: fan_out
    kind: for_each
    dependsOn: [emit_items]
    when: inputs.fanout == true
    timeoutSeconds: 3600
    config:
      items: ${{ nodes.emit_items.outputs.items }}
      maxConcurrency: 3
      onChildFailure: collect_and_continue
      body:
        nodes:
        - id: invoke
          kind: pipeline.invoke
          timeoutSeconds: 1800
          config:
            pipeline: issue-implementation
            inputs:
              number: ${{ item.number }}
              title: ${{ item.title }}
    outputs:
      type: object
      properties:
        children: {type: array, items: {type: object}}
  - id: verdict
    kind: condition
    dependsOn: [build_until_verified]
    config:
      cases:
      - when: nodes.build_until_verified.outputs.approved == true
        route: verified
      default: needs_attention
  - id: publish_verified
    kind: artifact.publish
    dependsOn: [verdict]
    when: nodes.verdict.outputs.route == 'verified'
    config:
      name: review-evidence.md
      kind: markdown
      mediaType: text/markdown
      sensitivity: standard
      from:
        mode: output_json
        value: ${{ nodes.build_until_verified.outputs }}
  - id: publish_needs_attention
    kind: artifact.publish
    dependsOn: [verdict]
    when: nodes.verdict.outputs.route == 'needs_attention'
    config:
      name: needs-attention.json
      kind: json
      mediaType: application/json
      sensitivity: standard
      from:
        mode: output_json
        value: ${{ nodes.build_until_verified.outputs }}
  resultBindings:
    implementation_summary: ${{ nodes.build_until_verified.outputs.implementation_summary }}
    review_approved: ${{ nodes.build_until_verified.outputs.approved }}
    iterations: ${{ nodes.build_until_verified.outputs.iterations }}
---
# Document 2: the deterministic twin (docs/m4-contract.md § 7.1 C1). The three agent.acp
# nodes of document 1 become process.exec nodes running the committed fixture script
# (fixtures/m4-exit.sh: prints the plan JSON, applies the hello.py docstring edit + the
# `==99` -> `==3` rewrite, prints the reviewer JSON), so C4-C9 always take the same branch.
# Node ids are byte-identical to document 1 — the compiled node_instance_key SETS are equal,
# which is what C1 asserts across the two runs (C1 twin requirement). `passWhen` is unchanged.
apiVersion: communication.dev/v1alpha1
kind: Pipeline
metadata:
  name: feature-development-deterministic
  description: Deterministic process.exec twin of feature-development; identical node key set.
spec:
  inputs:
    type: object
    required: [goal, repository]
    properties:
      goal: {type: string, minLength: 1}
      repository: {type: string, minLength: 1}
      acceptance_criteria:
        type: string
        default: Tests pass, the plan is followed, and the reviewer approves.
      fanout:
        type: boolean
        default: false
        description: Arms the C8 for_each fan-out branch (emit_items + fan_out run only when true).
      fanout_count:
        type: integer
        minimum: 0
        maximum: 1000
        default: 0
        description: Items the m4-exit.sh items fixture emits (C8a 0, C8b-e 25).
      hold_seconds:
        type: integer
        minimum: 0
        maximum: 600
        default: 0
        description: Seconds each process.exec step holds its attempt open (m4-exit.sh M4_HOLD_SECONDS) before any work, so C4/C5/C6 fault injection lands on a LIVE attempt; 0 = shipped speed.
      leave_dirty:
        type: boolean
        default: false
        description: Opt-in dirty-boundary arm for § 7.1 C6d. When true the twin's implement step (m4-exit.sh M4_LEAVE_DIRTY) writes ONE extra UNCOMMITTED file after its edit, so the boundary captured when implement completes records committed=false; false (default) writes nothing and every step is byte-identical.
  outputs:
    type: object
    required: [implementation_summary]
    properties:
      implementation_summary: {type: string}
      review_approved: {type: boolean}
      iterations: {type: integer}
  policies:
    maxConcurrentNodes: 1
    maxDurationSeconds: 14400
    maxNodeExecutions: 200
    maxChildDepth: 1
    workspaceMode: worktree
    cancelPolicy: cascade
  nodes:
  - id: plan
    kind: process.exec
    timeoutSeconds: 900
    retry:
      maxAttempts: 3
      backoff: {baseSeconds: 5, multiplier: 2, maxSeconds: 120, jitter: true}
      retriableErrors: [infra, interrupted, invalid_output]
    config:
      executable: m4-exit.sh
      args: [plan]
      env:
        M4_HOLD_SECONDS: ${{ string(inputs.hold_seconds) }}
      outputExtraction: {mode: json_from_stdout}
    outputs:
      type: object
      required: [plan]
      properties:
        plan: {type: string, minLength: 1}
  - id: approve
    kind: human.approval
    dependsOn: [plan]
    retry:
      maxAttempts: 1
    config:
      summary: |
        Plan for ${{ inputs.goal }}
        ${{ nodes.plan.outputs.plan }}
      approverRoles: [maintainer]
      deadlineSeconds: 86400
      onTimeout: fail
  - id: build_until_verified
    kind: until
    dependsOn: [approve]
    timeoutSeconds: 7200
    config:
      maxIterations: 4
      maxDurationSeconds: 7200
      passWhen: nodes.test.outputs.result.successful == true && nodes.review.status == 'succeeded' && nodes.review.outputs.approved == true
      carryForward: true
      body:
        nodes:
        - id: implement
          kind: process.exec
          timeoutSeconds: 900
          retry:
            maxAttempts: 2
            backoff: {baseSeconds: 10, multiplier: 2, maxSeconds: 120, jitter: true}
            retriableErrors: [infra, interrupted]
          config:
            executable: m4-exit.sh
            args: [implement]
            env:
              M4_HOLD_SECONDS: ${{ string(inputs.hold_seconds) }}
              M4_LEAVE_DIRTY: ${{ string(inputs.leave_dirty) }}
            cwd: repos/app
            workspace:
              mode: run_workspace
              repositories: ['${{ inputs.repository }}']
            secretRefs: [project/test-database-url]
            outputExtraction: {mode: json_from_stdout}
          outputs:
            type: object
            required: [summary]
            properties:
              summary: {type: string}
              files_changed: {type: array, items: {type: string}}
        - id: test
          kind: process.exec
          dependsOn: [implement]
          timeoutSeconds: 900
          retry:
            maxAttempts: 2
            backoff: {baseSeconds: 5, multiplier: 2, maxSeconds: 60, jitter: false}
            retriableErrors: [infra, interrupted]
          config:
            executable: m4-exit.sh
            args: [test]
            env:
              M4_HOLD_SECONDS: ${{ string(inputs.hold_seconds) }}
            cwd: repos/app
            workspace:
              mode: run_workspace
              repositories: ['${{ inputs.repository }}']
            outputExtraction: {mode: json_from_path, path: build/test-result.json}
          outputs:
            type: object
            required: [exit_code, result]
            properties:
              exit_code: {type: integer}
              result:
                type: object
                required: [successful]
                properties:
                  successful: {type: boolean}
                  packages: {type: array, items: {type: object}}
        - id: review
          kind: process.exec
          dependsOn: [test]
          timeoutSeconds: 900
          retry:
            maxAttempts: 2
            backoff: {baseSeconds: 10, multiplier: 2, maxSeconds: 120, jitter: true}
            retriableErrors: [infra, interrupted, invalid_output]
          config:
            executable: m4-exit.sh
            args: [review]
            env:
              M4_HOLD_SECONDS: ${{ string(inputs.hold_seconds) }}
            workspace:
              mode: read_only
              repositories: ['${{ inputs.repository }}']
            outputExtraction: {mode: json_from_stdout}
          outputs:
            type: object
            required: [approved, evidence]
            properties:
              approved: {type: boolean}
              evidence: {type: string}
              findings: {type: array, items: {type: string}}
      resultBindings:
        implementation_summary: ${{ nodes.implement.outputs.summary }}
        review_feedback: ${{ nodes.review.outputs.evidence }}
        approved: ${{ nodes.review.outputs.approved }}
    outputs:
      type: object
      required: [iterations, approved]
      properties:
        iterations: {type: integer}
        approved: {type: boolean}
        implementation_summary: {type: string}
        review_feedback: {type: string}
  - id: emit_items
    kind: process.exec
    dependsOn: [approve]
    when: inputs.fanout == true
    timeoutSeconds: 300
    retry:
      maxAttempts: 2
      backoff: {baseSeconds: 5, multiplier: 2, maxSeconds: 60, jitter: false}
      retriableErrors: [infra, interrupted]
    config:
      executable: m4-exit.sh
      args: [items]
      env:
        M4_FANOUT_COUNT: ${{ string(inputs.fanout_count) }}
      outputExtraction: {mode: json_from_stdout}
    outputs:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {type: object}}
  - id: fan_out
    kind: for_each
    dependsOn: [emit_items]
    when: inputs.fanout == true
    timeoutSeconds: 3600
    config:
      items: ${{ nodes.emit_items.outputs.items }}
      maxConcurrency: 3
      onChildFailure: collect_and_continue
      body:
        nodes:
        - id: invoke
          kind: pipeline.invoke
          timeoutSeconds: 1800
          config:
            pipeline: issue-implementation
            inputs:
              number: ${{ item.number }}
              title: ${{ item.title }}
    outputs:
      type: object
      properties:
        children: {type: array, items: {type: object}}
  - id: verdict
    kind: condition
    dependsOn: [build_until_verified]
    config:
      cases:
      - when: nodes.build_until_verified.outputs.approved == true
        route: verified
      default: needs_attention
  - id: publish_verified
    kind: artifact.publish
    dependsOn: [verdict]
    when: nodes.verdict.outputs.route == 'verified'
    config:
      name: review-evidence.md
      kind: markdown
      mediaType: text/markdown
      sensitivity: standard
      from:
        mode: output_json
        value: ${{ nodes.build_until_verified.outputs }}
  - id: publish_needs_attention
    kind: artifact.publish
    dependsOn: [verdict]
    when: nodes.verdict.outputs.route == 'needs_attention'
    config:
      name: needs-attention.json
      kind: json
      mediaType: application/json
      sensitivity: standard
      from:
        mode: output_json
        value: ${{ nodes.build_until_verified.outputs }}
  resultBindings:
    implementation_summary: ${{ nodes.build_until_verified.outputs.implementation_summary }}
    review_approved: ${{ nodes.build_until_verified.outputs.approved }}
    iterations: ${{ nodes.build_until_verified.outputs.iterations }}
---
# Document 3: the C8 fan-out child (docs/m4-contract.md § 7.1 C8): one process.exec node
# that writes a file and exits 0 — and exits 1 for item number 13, which is C8d/e's failing
# child arm. Invoked by /fan_out in documents 1-2 via pipeline.invoke (children are runs).
apiVersion: communication.dev/v1alpha1
kind: Pipeline
metadata:
  name: issue-implementation
  description: C8 fan-out child; one process.exec that exits 0, except item number 13.
spec:
  inputs:
    type: object
    required: [number]
    properties:
      number: {type: integer, minimum: 1}
      title: {type: string, default: ''}
  outputs:
    type: object
    required: [summary]
    properties:
      summary: {type: string}
  policies:
    maxConcurrentNodes: 1
    maxDurationSeconds: 600
    maxNodeExecutions: 10
    maxChildDepth: 0
    workspaceMode: worktree
    cancelPolicy: cascade
  nodes:
  - id: implement
    kind: process.exec
    timeoutSeconds: 300
    retry:
      maxAttempts: 2
      backoff: {baseSeconds: 5, multiplier: 2, maxSeconds: 60, jitter: false}
      retriableErrors: [infra, interrupted]
    config:
      executable: m4-exit.sh
      args: [issue]
      env:
        M4_ISSUE_NUMBER: ${{ string(inputs.number) }}
        M4_ISSUE_TITLE: ${{ inputs.title }}
      outputExtraction: {mode: json_from_stdout}
    outputs:
      type: object
      required: [summary]
      properties:
        summary: {type: string}
  resultBindings:
    summary: ${{ nodes.implement.outputs.summary }}
