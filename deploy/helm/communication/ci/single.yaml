# helm lint / helm template CI values: one container, dev login, no RBAC.
mode: single
image:
  repository: ghcr.io/dbirks/communication-worker
  tag: kind
  pullPolicy: IfNotPresent
serveImage:
  repository: ghcr.io/dbirks/communication
  tag: kind
serve:
  replicas: 2
database:
  urlSecret:
    name: communication-database-url
    key: url
oidc:
  # A real deployment names its IdP here; the CI values only have to render.
  issuer: http://oidc:8080/default
  clientId: communication-dev
devLogin: true
publicUrl: http://communication.local
keyringSecret: communication-keyring
worker:
  enforcement: required
  launcher: local
  capacity: 2
persistence:
  size: 5Gi
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 2Gi
